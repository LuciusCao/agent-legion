[project]
name = "video-hive"
version = "0.1.0"
description = "Local educational video processing queue and preview tool"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "funasr>=1.3.1",
  "pyyaml",
  "requests",
  "torch>=2.12.0",
  "torchaudio>=2.11.0",
  "uvicorn",
  "websockets",
]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx",
  "mypy>=2.1.0",
  "pytest",
  "pytest-cov>=7.1.0",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "full_gate: deterministic higher-fidelity architecture scenarios",
  "ci_extended: repeated stress scenarios for CI",
]
filterwarnings = [
  "error::ResourceWarning:sqlite3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".uv-cache",
  ".venv",
  "frontend/dist",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["server"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]
