[project]
name = "agent-legion"
version = "0.1.0"
description = "Local processing console for educational videos and Agent Legion workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "filelock",
  "funasr>=1.3.1",
  "psycopg[binary,pool]>=3.2",
  "pydantic",
  "pyyaml",
  "requests",
  "torch>=2.12.0",
  "torchaudio>=2.11.0",
  "uvicorn",
  "websockets",
]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx",
  "mypy>=2.1.0",
  "pytest",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "full_gate: deterministic higher-fidelity architecture scenarios",
  "ci_extended: repeated stress scenarios for CI",
  "slow: tests involving real subprocesses or long sleeps",
]
filterwarnings = [
  "error::ResourceWarning:sqlite3",
  "error::DeprecationWarning",
  "ignore:Legacy absolute path stored:DeprecationWarning",
  # Uvicorn's WebSocket protocol imports these deprecated compatibility APIs.
  "ignore:^websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy$",
  "ignore:^websockets\\.server\\.WebSocketServerProtocol is deprecated$:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".uv-cache",
  ".venv",
  "frontend/dist",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["server"]
omit = [
  "*/__pycache__/*",
  # These paths are referenced only by tests/test_export_openapi.py via
  # compile() filenames; the files do not exist and must not be measured.
  "server/app/routes/legacy.py",
  "server/app/routes/unrelated.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]
