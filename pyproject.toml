[project]
name = "agent-legion"
version = "0.1.0"
description = "Local processing console for educational videos and Agent Legion workflows"
requires-python = ">=3.11"
dependencies = [
  # ACP (Agent Client Protocol) SDK for the Studio chat backend
  # (server/app/studio_chat): asyncio client/agent schemas + stdio transport.
  # Not to be confused with the unrelated `acp-sdk` package (IBM/BeeAI ACP).
  "agent-client-protocol>=0.12,<1",
  "cryptography",
  "fastapi",
  "filelock",
  # Pinned below 2.0: mcp 2.0 removed mcp.server.fastmcp (breaking change) and
  # the standalone fastmcp 3.x package is incompatible with mcp 2.x; the MCP
  # server (server/app/mcp_server) uses FastMCP from mcp.server.fastmcp.
  "mcp>=1.12,<2",
  "psycopg[binary,pool]>=3.2",
  "pydantic",
  "python-dotenv>=1.2.2",
  "pyyaml",
  "requests",
  "uvicorn",
  "websockets",
]

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "httpx",
  "mypy>=2.1.0",
  "pytest",
  "pytest-cov>=7.1.0",
  "pytest-rerunfailures>=15.0",
  "pytest-xdist>=3.8.0",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "full_gate: deterministic higher-fidelity architecture scenarios",
  "ci_extended: repeated stress scenarios for CI",
  "slow: tests involving real subprocesses or long sleeps",
  "repository_gate: whole-repository checks executed separately by the quality gate",
  "postgres: tests that require the isolated PostgreSQL test database",
  "smoke: curated fast high-value tests for the pre-push smoke tier (assigned in tests/conftest.py)",
  "no_db: pure static tests that never touch the database; skips TRUNCATE-based DB isolation",
  "fresh_schema: rebuild the test schema from scratch instead of TRUNCATE-based reset (for tests that mutate DDL)",
]
filterwarnings = [
  "error::ResourceWarning:sqlite3",
  "error::DeprecationWarning",
  "ignore:Legacy absolute path stored:DeprecationWarning",
  # Uvicorn's WebSocket protocol imports these deprecated compatibility APIs.
  "ignore:^websockets\\.legacy is deprecated; see .*:DeprecationWarning:websockets\\.legacy$",
  "ignore:^websockets\\.server\\.WebSocketServerProtocol is deprecated$:DeprecationWarning:uvicorn\\.protocols\\.websockets\\.websockets_impl$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".uv-cache",
  ".venv",
  "frontend/dist",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["server"]
omit = [
  "*/__pycache__/*",
  # These paths are referenced only by tests/test_export_openapi.py via
  # compile() filenames; the files do not exist and must not be measured.
  "server/app/routes/legacy.py",
  "server/app/routes/unrelated.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]
