name: Quality Gate

on:
  pull_request:
    branches: [develop, main, master]
  push:
    branches: [develop, main, master]
  # Nightly run: the only scheduled trigger for the ci-extended stress job.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gate scripts default UV_CACHE_DIR to the in-project .uv-cache; point it back
  # at the default location so astral-sh/setup-uv caching covers it.
  UV_CACHE_DIR: /home/runner/.cache/uv
  # Fresh per-run databases on the service container below. export_openapi's
  # create_app writes worker_control_state at startup, so the backend-postgres
  # job (which hosts the api:check contract step) needs a live database.
  AGENT_LEGION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_ci
  AGENT_LEGION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_test_ci
  # check-skills-shared.py compares skill repos at machine-local paths
  # (~/.agents/skills/...) that only exist on maintainer machines.
  AGENT_LEGION_SKIP_SKILLS_SHARED_CHECK: "1"
  # config/workflow.yaml points agent_workers.register_token_file at the
  # gitignored deploy/secrets/; a dummy inline token keeps settings from
  # reading the absent file. Not a real secret — CI-only placeholder.
  AGENT_LEGION_WORKER_REGISTER_TOKEN: ci-only-dummy-register-token

jobs:
  # Backend is sharded by database dependency (test architecture plan, Phase
  # 5C): backend-unit runs the static checks and the PostgreSQL-offline unit
  # tier with no service container, while backend-postgres keeps Postgres and
  # hosts the api:check contract step (Python env + Postgres + node_modules)
  # plus the full-gate layer. Each tier writes its own coverage data file via
  # COVERAGE_FILE; backend-unit uploads its data + JUnit/rerun telemetry as
  # 1-day artifacts, and backend-postgres downloads them at the end to combine
  # all shards and enforce the 85% floor once — the same combined-coverage
  # semantics the single job previously got from AGENT_LEGION_COV_APPEND.
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Backend static checks
        run: BACKEND_GATE_PHASE=static ./scripts/check-quick-backend.sh

      - name: Backend unit tests (PostgreSQL offline)
        run: |
          mkdir -p coverage-data
          BACKEND_GATE_PHASE=test ./scripts/check-quick-backend.sh
        env:
          AGENT_LEGION_COV: "1"
          AGENT_LEGION_TEST_RESULTS_DIR: test-results
          AGENT_LEGION_TEST_RESULT_NAME: backend-unit
          COVERAGE_FILE: coverage-data/backend-unit.coverage
          GATE_TIER: unit

      # Artifacts carry only data files (coverage data = paths + line counts,
      # no source; JUnit/rerun telemetry), retention 1 day per the repository
      # artifact policy. backend-postgres downloads them for the combined
      # coverage floor and the aggregate summary.
      - name: Upload unit shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: coverage-data/backend-unit.coverage
          retention-days: 1

      - name: Upload unit shard test telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-telemetry
          path: |
            test-results/backend-unit-junit.xml
            test-results/backend-unit-reruns.json
          retention-days: 1

      - name: Backend unit test summary
        if: always()
        env:
          AGENT_LEGION_COV: "1"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "Backend unit test evidence" \
            --junit test-results/backend-unit-junit.xml \
            --rerun-report test-results/backend-unit-reruns.json \
            --output test-results/backend-unit-summary.md
          cat test-results/backend-unit-summary.md >> "$GITHUB_STEP_SUMMARY"

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # api:check's create_app connects to AGENT_LEGION_DATABASE_URL; the
          # service only auto-creates POSTGRES_DB (tests create their own).
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # The api:check contract step regenerates frontend API types via
      # openapi-typescript/prettier from frontend/node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # velites' Linux filesystem sandbox (EXEC-HARNESS-SANDBOX-001) is
      # fail-closed: the tests/full e2e and bwrap-gated cargo tests need a
      # real bubblewrap binary on the runner. Ubuntu 24.04 restricts
      # unprivileged userns via AppArmor ("bwrap: setting up uid map:
      # Permission denied"); setuid bwrap sidesteps that on the CI VM.
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      # api:check boots create_app to export the OpenAPI schema, so it lives
      # in this job (Python env + Postgres) instead of backend-unit or the
      # frontend jobs.
      - name: API contract check
        run: FRONTEND_GATE_PHASE=api-contract ./scripts/check-quick-frontend.sh

      - name: Backend PostgreSQL tests
        run: |
          mkdir -p coverage-data
          BACKEND_GATE_PHASE=test ./scripts/check-quick-backend.sh
        env:
          AGENT_LEGION_COV: "1"
          AGENT_LEGION_TEST_RESULTS_DIR: test-results
          AGENT_LEGION_TEST_RESULT_NAME: backend-postgres
          COVERAGE_FILE: coverage-data/backend-postgres.coverage
          GATE_TIER: postgres

      # Like the tier shards, the full gate writes its own COVERAGE_FILE, so
      # it must not enforce the 85% floor on partial data
      # (--cov-fail-under=0); the combined report below enforces it once.
      - name: Full gate evidence (tests/full)
        run: |
          mkdir -p coverage-data test-results
          uv run pytest -q tests/full -m full_gate \
            --durations=30 \
            --junitxml=test-results/backend-full-junit.xml \
            -p scripts.pytest_telemetry \
            --cov=server --cov-report= --cov-append \
            --cov-fail-under=0
        env:
          AGENT_LEGION_RERUN_REPORT: test-results/backend-full-reruns.json
          COVERAGE_FILE: coverage-data/backend-full.coverage

      # backend-unit (~3 min) finishes long before this job reaches the merge
      # (~8 min in), so its artifacts are always available here. If the unit
      # job failed before uploading, failing this step keeps the gate red
      # instead of computing the floor on partial coverage data.
      - name: Download unit shard coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-coverage
          path: coverage-data

      - name: Download unit shard test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-telemetry
          path: test-results

      # Merging the shard data files replaces the old single-job
      # AGENT_LEGION_COV_APPEND flow; `coverage report` enforces the 85% floor
      # (pyproject [tool.coverage.report] fail_under) once, against the
      # combined data, exactly as before.
      - name: Combined coverage report
        run: |
          for shard in coverage-data/*.coverage; do
            cp "$shard" ".coverage.$(basename "$shard" .coverage)"
          done
          uv run coverage combine
          uv run coverage report

      # Only aggregate counts go to the persistent job summary. Raw JUnit and
      # coverage files stay off the persistent record: the unit shard's copies
      # are 1-day artifacts, everything else remains ephemeral on the runner.
      - name: Backend test summary
        if: always()
        env:
          AGENT_LEGION_COV: "1"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "Backend test evidence" \
            --junit test-results/backend-unit-junit.xml \
            --junit test-results/backend-postgres-junit.xml \
            --junit test-results/backend-full-junit.xml \
            --rerun-report test-results/backend-unit-reruns.json \
            --rerun-report test-results/backend-postgres-reruns.json \
            --rerun-report test-results/backend-full-reruns.json \
            --output test-results/backend-summary.md
          cat test-results/backend-summary.md >> "$GITHUB_STEP_SUMMARY"

  # Frontend is sharded into the two Vitest projects (test architecture plan,
  # Phase 5B): pure logic tests (node) and component tests (jsdom) run as
  # parallel jobs, each emitting a blob report that embeds raw V8 coverage.
  # frontend-coverage then merges the blobs and enforces the global coverage
  # thresholds + inventory once, against the combined data. The OpenAPI
  # contract check lives in the backend-postgres job (Phase 5A/5C), so these
  # jobs need neither Python nor Postgres.
  frontend-logic:
    name: frontend-logic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # FRONTEND_API_CHECK=0: the contract check runs in the backend-postgres job.
      - name: Frontend static checks
        run: FRONTEND_GATE_PHASE=static FRONTEND_TEST_MODE=coverage FRONTEND_API_CHECK=0 ./scripts/check-quick-frontend.sh

      - name: Frontend logic tests
        run: >-
          FRONTEND_GATE_PHASE=test FRONTEND_TEST_MODE=coverage
          FRONTEND_TEST_PROJECT=logic
          FRONTEND_COVERAGE_BLOB_DIR="${{ github.workspace }}/coverage-blobs/logic"
          ./scripts/check-quick-frontend.sh
        env:
          AGENT_LEGION_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results/frontend-logic

      - name: Upload logic coverage blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-blob-logic
          path: coverage-blobs/logic/
          retention-days: 1

      - name: Production bundle
        run: npm run build:bundle
        working-directory: frontend

      # summarize_test_results.py is stdlib-only; the runner's system
      # python3 avoids a full uv sync in this job.
      - name: Frontend logic test summary
        if: always()
        env:
          AGENT_LEGION_COV: frontend-v8-blob
        run: |
          python3 scripts/summarize_test_results.py \
            --title "Frontend logic test evidence" \
            --junit test-results/frontend-logic/vitest-junit.xml \
            --output test-results/frontend-logic-summary.md
          cat test-results/frontend-logic-summary.md >> "$GITHUB_STEP_SUMMARY"

  frontend-component:
    name: frontend-component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Frontend component tests
        run: >-
          FRONTEND_GATE_PHASE=test FRONTEND_TEST_MODE=coverage
          FRONTEND_TEST_PROJECT=component
          FRONTEND_COVERAGE_BLOB_DIR="${{ github.workspace }}/coverage-blobs/component"
          ./scripts/check-quick-frontend.sh
        env:
          AGENT_LEGION_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results/frontend-component

      - name: Upload component coverage blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-blob-component
          path: coverage-blobs/component/
          retention-days: 1

      - name: Frontend component test summary
        if: always()
        env:
          AGENT_LEGION_COV: frontend-v8-blob
        run: |
          python3 scripts/summarize_test_results.py \
            --title "Frontend component test evidence" \
            --junit test-results/frontend-component/vitest-junit.xml \
            --output test-results/frontend-component-summary.md
          cat test-results/frontend-component-summary.md >> "$GITHUB_STEP_SUMMARY"

  frontend-coverage:
    name: frontend-coverage
    needs: [frontend-logic, frontend-component]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download coverage blobs
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-blob-*
          path: coverage-blobs
          merge-multiple: true

      # --merge-reports replays the shard blob reports (tests + embedded V8
      # coverage) and applies vite.config.ts coverage thresholds to the
      # merged data; json-summary feeds the job summary below.
      - name: Merge coverage and enforce thresholds
        run: >-
          npx vitest run
          --merge-reports "${{ github.workspace }}/coverage-blobs"
          --coverage.enabled=true
          --coverage.reporter=text
          --coverage.reporter=json
          --coverage.reporter=json-summary
        working-directory: frontend

      - name: Coverage inventory
        run: npm run test:coverage-inventory
        working-directory: frontend

      - name: Frontend coverage summary
        if: always()
        run: |
          node -e '
            const summary = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "functions", "branches", "statements"]
              .map((key) => `| ${key} | ${summary[key].pct}% |`)
              .join("\n");
            console.log(`## Frontend coverage (merged shards)\n\n| Metric | Total |\n| --- | ---: |\n${rows}\n`);
          ' >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

  # Deterministic Chromium smoke (test architecture plan, Phase 4): real
  # backend + vite preview + Playwright, offline via the in-process CMS stub
  # and a dedicated E2E database. Cold start stays well under the 3-minute
  # budget; failure evidence (trace/screenshot/backend log) uploads only on
  # failure with a short retention.
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_legion_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync

      - run: npm ci
        working-directory: frontend

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser smoke E2E
        run: uv run python scripts/e2e/run_browser_smoke.py
        env:
          AGENT_LEGION_E2E_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: frontend/e2e-results/
          retention-days: 5

  # Nightly workspace stress + multi-browser smoke (test architecture plan,
  # Phase 4C). The stress step runs the existing five-minute scenario against
  # a real backend and uploads report.md + frontend-metrics.json for
  # diagnostics; the smoke step re-runs the deterministic browser suite on
  # Firefox/WebKit as well (PR/push stays Chromium-only via E2E_BROWSERS).
  # Stress profile rationale: 50 agents / 2000 jobs / 300s at 200 events/s
  # keeps the page under live SSE traffic long enough for stable click
  # latency / long task / memory samples while the whole job stays well
  # under the 45-minute timeout (local 5-agent/60s validation: ~95s total).
  nightly-e2e:
    name: nightly-e2e
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: Multi-browser smoke E2E
        run: uv run python scripts/e2e/run_browser_smoke.py
        env:
          AGENT_LEGION_E2E_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          E2E_BROWSERS: chromium,firefox,webkit

      - name: Workspace stress run
        run: >-
          uv run python scripts/stress/run_e2e_stress.py
          --agents 50 --jobs 2000 --duration 300 --event-rate 200
        env:
          # Shared runners hiccup under load: allow occasional probe timeouts
          # while the p95 click-latency assertion still guards regressions.
          STRESS_PROBE_TIMEOUT_MS: "5000"
          STRESS_MAX_PROBE_ERRORS: "3"

      - name: Upload stress report and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-${{ github.run_id }}
          path: stress-results/
          retention-days: 14

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cold build is ~14 min; the cache is mandatory, not optional.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velites

      # Enables the bwrap-gated sandbox integration tests in cargo test.
      # Ubuntu 24.04 restricts unprivileged userns via AppArmor ("bwrap:
      # setting up uid map: Permission denied"); setuid bwrap sidesteps it.
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: velites

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: velites

      - name: cargo test
        run: cargo test --locked
        working-directory: velites

  ci-extended:
    name: ci-extended
    # Repeated stress scenarios; too slow for the PR/push loop. Runs nightly
    # (schedule) and on manual dispatch, replacing the old per-push policy.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # api:check's create_app connects to AGENT_LEGION_DATABASE_URL; the
          # service only auto-creates POSTGRES_DB (tests create their own).
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: CI extended architecture evidence
        run: |
          mkdir -p test-results
          uv run pytest -q tests/ci -m ci_extended \
            --durations=30 \
            --junitxml=test-results/ci-extended-junit.xml \
            -p scripts.pytest_telemetry
        env:
          AGENT_LEGION_RERUN_REPORT: test-results/ci-extended-reruns.json

      - name: CI extended test summary
        if: always()
        env:
          AGENT_LEGION_COV: "0"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "CI extended test evidence" \
            --junit test-results/ci-extended-junit.xml \
            --rerun-report test-results/ci-extended-reruns.json \
            --output test-results/ci-extended-summary.md
          cat test-results/ci-extended-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Flaky governance (test architecture plan, Phase 5D): reruns are fine
      # only for nodeids registered in tests/flaky_registry.yaml with a live
      # deadline. Nightly-only; PR/push lanes never run this job.
      - name: Fail on unregistered reruns
        if: always()
        run: >-
          uv run python scripts/check_reruns.py
          --rerun-report test-results/ci-extended-reruns.json
