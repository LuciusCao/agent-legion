name: Quality Gate

on:
  pull_request:
    branches: [develop, main, master]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  push:
    # develop merges are already covered by the PR gate; keep push triggers
    # on the trunk branches only so a merge does not burn a second full gate.
    branches: [main, master]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:
  # The weekly schedule moved to nightly-gate.yml (issue #193): the stress
  # jobs never run on PR/push anyway, and a scheduled run on a trunk ref
  # shared this file's concurrency group, so it could cancel an in-flight
  # push gate for the same ref. Dispatch here runs the regular lanes only;
  # dispatch nightly-gate.yml for the stress jobs.

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gate scripts default UV_CACHE_DIR to the in-project .uv-cache; point it back
  # at the default location so astral-sh/setup-uv caching covers it.
  UV_CACHE_DIR: /home/runner/.cache/uv
  # Fresh per-run databases on the service containers below. export_openapi's
  # create_app writes worker_control_state at startup, so the api-check job
  # (which hosts the api:check contract step) needs a live database.
  AGENT_LEGION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_ci
  AGENT_LEGION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_test_ci
  # The global worker register token was retired (issue #35): registration
  # uses scoped tokens and settings fails fast on this variable, so CI must
  # not inject it anymore.

jobs:
  # Lane detection (Actions minutes cost control): push/PR runs narrow the
  # gate by changed paths, mirroring the local pre-push lane policy —
  # frontend-only changes skip the backend pytest shards (api-check still
  # runs), velites-only changes run just the rust job, docs-only changes
  # skip the gate entirely. Shared files (config, scripts, tests,
  # workflows, anything outside frontend//velites//docs/) run the full
  # backend+frontend gate; dispatch runs always get every lane.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          backend=true; frontend=true; rust=true; docker=true
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          # No usable base (dispatch, brand-new branch): full gate.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            backend=false; frontend=false; rust=false; docker=false
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md|LICENSE) ;;
                frontend/*) frontend=true ;;
                velites/*) rust=true ;;
                # 镜像内容/打包相关：Dockerfile 年久失修只有真构建才能发现
                #（2026-08 host 缺 g++、worker 缺 requests 两次实例）。
                Dockerfile|.dockerignore|pyproject.toml|uv.lock|worker/*|shared/*|deploy/*) backend=true; frontend=true; docker=true ;;
                *) backend=true; frontend=true ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  # Backend is sharded by database dependency (test architecture plan, Phase
  # 5C): backend-unit runs the static checks and the PostgreSQL-offline unit
  # tier with no service container, while the postgres side (Phase 5C-2/5C-3)
  # runs as the three-shard backend-postgres matrix job below. backend-coverage
  # merges every shard's coverage artifact and enforces the 85% floor once
  # (issue #193: this used to be the aggregator half of backend-postgres-a,
  # which polled `gh api` for peer artifacts — the needs-DAG makes the merge
  # event-driven instead).
  backend-unit:
    name: backend-unit
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history for the backend static round: budget_monotonicity
      # compares ceilings against HEAD^ and hard-fails when the anchor does
      # not resolve — a depth-1 clone would red the job on every run. Deep
      # history keeps the anchors resolvable (codex review on PR #231);
      # changes already fetches depth 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Backend static checks
        run: BACKEND_GATE_PHASE=static ./scripts/check-quick-backend.sh
        env:
          # Release train (develop→main)与 main 合并后 push 重跑：main 的
          # 预算 floor 落后 develop 整整一个发布周期，HEAD^ 锚点会把刚合入
          # 的、已经过门禁的历史再拒一遍（0.4.0 的 PR #249 与其 main push
          # run 各撞一次）。进入 main 的合并都已被对应 PR 门覆盖
          # （release train 走本 env，hotfix PR 走严格锚点），push 重跑
          # 锚点只看 HEAD。feature→develop PR 保持 HEAD^ 完整严格性。
          AGENT_LEGION_BUDGET_MONOTONICITY_RELEASE_TRAIN: ${{ (github.base_ref == 'main' && github.head_ref == 'develop') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && '1' || '0' }}

      - name: Backend unit tests (PostgreSQL offline)
        run: |
          mkdir -p coverage-data
          BACKEND_GATE_PHASE=test ./scripts/check-quick-backend.sh
        env:
          AGENT_LEGION_COV: "1"
          AGENT_LEGION_TEST_RESULTS_DIR: test-results
          AGENT_LEGION_TEST_RESULT_NAME: backend-unit
          COVERAGE_FILE: coverage-data/backend-unit.coverage
          GATE_TIER: unit

      # Artifacts carry only data files (coverage data = paths + line counts,
      # no source; JUnit/rerun telemetry), retention 1 day per the repository
      # artifact policy. backend-coverage downloads them for the combined
      # coverage floor and the aggregate summary.
      - name: Upload unit shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: coverage-data/backend-unit.coverage
          retention-days: 1

      - name: Upload unit shard test telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-telemetry
          path: |
            test-results/backend-unit-junit.xml
            test-results/backend-unit-reruns.json
          retention-days: 1

      - name: Backend unit test summary
        if: always()
        env:
          AGENT_LEGION_COV: "1"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "Backend unit test evidence" \
            --junit test-results/backend-unit-junit.xml \
            --rerun-report test-results/backend-unit-reruns.json \
            --output test-results/backend-unit-summary.md
          cat test-results/backend-unit-summary.md >> "$GITHUB_STEP_SUMMARY"

  # API contract + worker UI lane (issue #193): api:check boots create_app to
  # export the OpenAPI schema (Python env + live Postgres) and regenerates
  # the frontend API types from frontend/node_modules, so it used to live in
  # backend-postgres-a and dragged a heavy postgres-test job along on every
  # frontend-only PR. As its own job it runs on the frontend lane too, with
  # no test shard, no bubblewrap, and no coverage bookkeeping. It also hosts
  # the worker UI tests: worker/ui has no build step and its node:test suite
  # needs Node 22, which no other backend-lane job installs.
  api-check:
    name: api-check
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # api:check's create_app connects to AGENT_LEGION_DATABASE_URL; the
          # service only auto-creates POSTGRES_DB (tests create their own).
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # The api:check contract step regenerates frontend API types via
      # openapi-typescript/prettier from frontend/node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: API contract check
        run: FRONTEND_GATE_PHASE=api-contract ./scripts/check-quick-frontend.sh

      # Backend lane only: the worker UI suite is a backend artifact.
      - name: Worker UI tests
        if: needs.changes.outputs.backend == 'true'
        run: node --test worker/ui/app.test.mjs

  # Postgres test tier (test architecture plan, Phase 5C-2/5C-3): the three
  # hash shards (deterministic md5(nodeid) % 3 collection filter,
  # scripts/pytest_gate_shard.py, GATE_SHARD=i/n — the shards partition the
  # tier with no overlap) run as one matrix job, so the service container
  # and setup steps are declared once instead of pasted per shard
  # (issue #193). Shard b additionally runs the velites sandbox integration
  # check and the full-gate (tests/full) evidence layer. Every shard
  # uploads coverage + telemetry as 1-day artifacts; backend-coverage
  # merges them after the needs-DAG guarantees all shards finished — no
  # artifact polling. fail-fast stays off so a failing shard does not
  # cancel its peers' evidence.
  backend-postgres:
    name: backend-postgres-${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            gate_shard: 1/3
          - shard: b
            gate_shard: 2/3
          - shard: c
            gate_shard: 3/3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # velites' Linux filesystem sandbox (EXEC-HARNESS-SANDBOX-001) is
      # fail-closed: the postgres tier's velites sandbox tests need a real
      # bubblewrap binary on the runner. Ubuntu 24.04 restricts unprivileged
      # userns via AppArmor; current bubblewrap no longer supports the legacy
      # setuid mode, so the disposable CI VM must explicitly enable userns.
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Shard b only: run the real namespace + Python-child integration
      # before the long coverage shard. Inside the hash shard the test
      # self-skips so it is not repeated after hundreds of
      # coverage-instrumented tests.
      - name: Velites sandbox integration
        if: matrix.shard == 'b'
        run: >-
          uv run pytest -q
          tests/workers/test_workflow_worker_thread_local.py::test_make_workflow_worker_runs_demo_intake_local_node
        env:
          TMPDIR: /var/tmp

      - name: Backend PostgreSQL tests (shard ${{ matrix.gate_shard }})
        run: |
          mkdir -p coverage-data
          BACKEND_GATE_PHASE=test ./scripts/check-quick-backend.sh
        env:
          AGENT_LEGION_COV: "1"
          AGENT_LEGION_TEST_RESULTS_DIR: test-results
          AGENT_LEGION_TEST_RESULT_NAME: backend-postgres-${{ matrix.shard }}
          COVERAGE_FILE: coverage-data/backend-postgres-${{ matrix.shard }}.coverage
          GATE_TIER: postgres
          GATE_SHARD: ${{ matrix.gate_shard }}

      # Shard b only. Like the tier shards, the full gate writes its own
      # COVERAGE_FILE, so it must not enforce the 85% floor on partial data
      # (--cov-fail-under=0); the combined report in backend-coverage
      # enforces it once.
      - name: Full gate evidence (tests/full)
        if: matrix.shard == 'b'
        run: |
          mkdir -p coverage-data test-results
          uv run pytest -q tests/full -m full_gate \
            --durations=30 \
            --junitxml=test-results/backend-full-junit.xml \
            -p scripts.pytest_telemetry \
            --cov=server --cov-report= --cov-append \
            --cov-fail-under=0
        env:
          AGENT_LEGION_RERUN_REPORT: test-results/backend-full-reruns.json
          COVERAGE_FILE: coverage-data/backend-full.coverage

      # Artifacts carry only data files (coverage data = paths + line counts,
      # no source; JUnit/rerun telemetry), retention 1 day per the repository
      # artifact policy. backend-coverage downloads them for the combined
      # coverage floor and the aggregate summary; a missing upload fails the
      # corresponding download step there, keeping the gate red.
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-${{ matrix.shard }}-coverage
          path: coverage-data/backend-postgres-${{ matrix.shard }}.coverage
          retention-days: 1

      - name: Upload full-gate coverage data
        if: always() && matrix.shard == 'b'
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-coverage
          path: coverage-data/backend-full.coverage
          retention-days: 1

      - name: Upload shard test telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-${{ matrix.shard }}-telemetry
          path: |
            test-results/backend-postgres-${{ matrix.shard }}-junit.xml
            test-results/backend-postgres-${{ matrix.shard }}-reruns.json
          retention-days: 1

      - name: Upload full-gate test telemetry
        if: always() && matrix.shard == 'b'
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-telemetry
          path: |
            test-results/backend-full-junit.xml
            test-results/backend-full-reruns.json
          retention-days: 1

  # Combined coverage floor + aggregate backend evidence (issue #193): the
  # needs-DAG guarantees backend-unit and every backend-postgres shard
  # finished before this job starts, replacing the old 40x15s `gh api`
  # artifact poll (5C-2 race workaround) with an event-driven merge. The
  # floor is only computed on complete data — a failed shard keeps the gate
  # red through its own check — while the summary step always runs and
  # lists any missing evidence files.
  backend-coverage:
    name: backend-coverage
    needs: [changes, backend-unit, backend-postgres]
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # Uploads are `if: always()`, so the artifacts exist even when a shard
      # failed after running pytest; a shard that died before uploading
      # fails its upload step, and the missing artifact fails this download
      # step instead of computing the floor on partial coverage data.
      - name: Download unit shard coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-coverage
          path: coverage-data

      - name: Download postgres shard A coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-a-coverage
          path: coverage-data

      - name: Download postgres shard B coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-b-coverage
          path: coverage-data

      - name: Download postgres shard C coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-c-coverage
          path: coverage-data

      - name: Download full-gate coverage data
        uses: actions/download-artifact@v4
        with:
          name: backend-full-coverage
          path: coverage-data

      - name: Download unit shard test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-unit-telemetry
          path: test-results

      - name: Download postgres shard A test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-a-telemetry
          path: test-results

      - name: Download postgres shard B test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-b-telemetry
          path: test-results

      - name: Download postgres shard C test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-postgres-c-telemetry
          path: test-results

      - name: Download full-gate test telemetry
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: backend-full-telemetry
          path: test-results

      # Merging the shard data files replaces the old single-job
      # AGENT_LEGION_COV_APPEND flow; `coverage report` enforces the 85% floor
      # (pyproject [tool.coverage.report] fail_under) once, against the
      # combined data, exactly as before. Only computed when every producer
      # succeeded — a failed shard keeps the gate red through its own check,
      # and partial data would silently drop lines from the floor.
      - name: Combined coverage report
        if: needs.backend-unit.result == 'success' && needs.backend-postgres.result == 'success'
        run: |
          for shard in coverage-data/*.coverage; do
            cp "$shard" ".coverage.$(basename "$shard" .coverage)"
          done
          uv run coverage combine
          uv run coverage report

      # Only aggregate counts go to the persistent job summary. Raw JUnit and
      # coverage files stay off the persistent record: the unit and shard-B
      # copies are 1-day artifacts, everything else remains ephemeral on the
      # runner. summarize_test_results.py lists missing evidence files
      # instead of failing, so this runs even when a shard failed.
      - name: Backend test summary
        if: always()
        env:
          AGENT_LEGION_COV: "1"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "Backend test evidence" \
            --junit test-results/backend-unit-junit.xml \
            --junit test-results/backend-postgres-a-junit.xml \
            --junit test-results/backend-postgres-b-junit.xml \
            --junit test-results/backend-postgres-c-junit.xml \
            --junit test-results/backend-full-junit.xml \
            --rerun-report test-results/backend-unit-reruns.json \
            --rerun-report test-results/backend-postgres-a-reruns.json \
            --rerun-report test-results/backend-postgres-b-reruns.json \
            --rerun-report test-results/backend-postgres-c-reruns.json \
            --rerun-report test-results/backend-full-reruns.json \
            --output test-results/backend-summary.md
          cat test-results/backend-summary.md >> "$GITHUB_STEP_SUMMARY"

  # Frontend is sharded into the two Vitest projects (test architecture plan,
  # Phase 5B): pure logic tests (node) and component tests (jsdom) run as
  # parallel jobs, each emitting a blob report that embeds raw V8 coverage.
  # frontend-coverage then merges the blobs and enforces the global coverage
  # thresholds + inventory once, against the combined data. The OpenAPI
  # contract check lives in the api-check job (Phase 5A/5C), so these jobs
  # need neither Python nor Postgres.
  frontend-logic:
    name: frontend-logic
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # FRONTEND_API_CHECK=0: the contract check runs in the api-check job.
      - name: Frontend static checks
        run: FRONTEND_GATE_PHASE=static FRONTEND_TEST_MODE=coverage FRONTEND_API_CHECK=0 ./scripts/check-quick-frontend.sh

      - name: Frontend logic tests
        run: >-
          FRONTEND_GATE_PHASE=test FRONTEND_TEST_MODE=coverage
          FRONTEND_TEST_PROJECT=logic
          FRONTEND_COVERAGE_BLOB_DIR="${{ github.workspace }}/coverage-blobs/logic"
          ./scripts/check-quick-frontend.sh
        env:
          AGENT_LEGION_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results/frontend-logic

      - name: Upload logic coverage blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-blob-logic
          path: coverage-blobs/logic/
          retention-days: 1

      - name: Production bundle
        run: npm run build:bundle
        working-directory: frontend

      # summarize_test_results.py is stdlib-only; the runner's system
      # python3 avoids a full uv sync in this job.
      - name: Frontend logic test summary
        if: always()
        env:
          AGENT_LEGION_COV: frontend-v8-blob
        run: |
          python3 scripts/summarize_test_results.py \
            --title "Frontend logic test evidence" \
            --junit test-results/frontend-logic/vitest-junit.xml \
            --output test-results/frontend-logic-summary.md
          cat test-results/frontend-logic-summary.md >> "$GITHUB_STEP_SUMMARY"

  frontend-component:
    name: frontend-component
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Frontend component tests
        run: >-
          FRONTEND_GATE_PHASE=test FRONTEND_TEST_MODE=coverage
          FRONTEND_TEST_PROJECT=component
          FRONTEND_COVERAGE_BLOB_DIR="${{ github.workspace }}/coverage-blobs/component"
          ./scripts/check-quick-frontend.sh
        env:
          AGENT_LEGION_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results/frontend-component

      - name: Upload component coverage blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-blob-component
          path: coverage-blobs/component/
          retention-days: 1

      - name: Frontend component test summary
        if: always()
        env:
          AGENT_LEGION_COV: frontend-v8-blob
        run: |
          python3 scripts/summarize_test_results.py \
            --title "Frontend component test evidence" \
            --junit test-results/frontend-component/vitest-junit.xml \
            --output test-results/frontend-component-summary.md
          cat test-results/frontend-component-summary.md >> "$GITHUB_STEP_SUMMARY"

  frontend-coverage:
    name: frontend-coverage
    needs: [changes, frontend-logic, frontend-component]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download coverage blobs
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-blob-*
          path: coverage-blobs
          merge-multiple: true

      # --merge-reports replays the shard blob reports (tests + embedded V8
      # coverage) and applies vite.config.ts coverage thresholds to the
      # merged data; json-summary feeds the job summary below.
      - name: Merge coverage and enforce thresholds
        run: >-
          npx vitest run
          --merge-reports "${{ github.workspace }}/coverage-blobs"
          --coverage.enabled=true
          --coverage.reporter=text
          --coverage.reporter=json
          --coverage.reporter=json-summary
        working-directory: frontend

      - name: Coverage inventory
        run: npm run test:coverage-inventory
        working-directory: frontend

      - name: Frontend coverage summary
        if: always()
        run: |
          node -e '
            const summary = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "functions", "branches", "statements"]
              .map((key) => `| ${key} | ${summary[key].pct}% |`)
              .join("\n");
            console.log(`## Frontend coverage (merged shards)\n\n| Metric | Total |\n| --- | ---: |\n${rows}\n`);
          ' >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend

  # Deterministic Chromium smoke (test architecture plan, Phase 4): real
  # backend + vite preview + Playwright, offline via the in-process CMS stub,
  # an in-process stub LLM gateway (velites Agent node) and a dedicated E2E
  # database; a standalone Worker process claims the Agent execution. The
  # main-flow spec needs the velites binary (Host code sandbox + Worker
  # runtime), so this job builds it like the rust lane does. Failure evidence
  # (trace/screenshot/backend log) uploads only on failure with a short
  # retention.
  e2e-smoke:
    name: e2e-smoke
    needs: changes
    # rust too: the main-flow spec depends on the velites binary and its
    # models registry schema, so velites-only changes must still run this job
    # (without widening them to the full backend+frontend gate).
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # 25 min: covers a cold velites release build when the shared rust-cache
    # misses (warm runs finish in a few minutes).
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_legion_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync

      - run: npm ci
        working-directory: frontend

      # velites binary: the main-flow spec's Host code sandbox and the
      # standalone Worker's agent runtime are both fail-closed without it
      # (the runner builds it via scripts/ensure-velites.sh --dest data/bin).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velites
          # One shared cache across the rust lane and both e2e jobs: the e2e
          # jobs build the same velites release binary, so they warm-start
          # from the rust lane's cache instead of a ~14min cold build.
          shared-key: velites

      # velites sandbox backend for Host-side code nodes (sandbox wrap). It is
      # fail-closed, and Ubuntu 24.04 restricts unprivileged userns via
      # AppArmor (current bubblewrap has no setuid mode), so the disposable
      # CI VM must explicitly enable userns — same as the other lanes.
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Browser binaries cache: a cold download stalled for 41 minutes once
      # (run 30816362118, FLAKY-004) and ate the whole nightly budget.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser smoke E2E
        run: uv run python scripts/e2e/run_browser_smoke.py
        env:
          AGENT_LEGION_E2E_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: frontend/e2e-results/
          retention-days: 5

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cold build is ~14 min; the cache is mandatory, not optional.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: velites
          # One shared cache across the rust lane and both e2e jobs: the e2e
          # jobs build the same velites release binary, so they warm-start
          # from the rust lane's cache instead of a ~14min cold build.
          shared-key: velites

      # Enables the bwrap-gated sandbox integration tests in cargo test.
      # Ubuntu 24.04 restricts unprivileged userns via AppArmor; enable it on
      # the disposable CI VM (modern bubblewrap has no setuid mode).
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: velites

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: velites

      - name: cargo test
        run: cargo test --locked
        working-directory: velites

  # Image build lane: the Dockerfile is not exercised by any other job, and
  # dependency growth has broken it twice (2026-08: host missing g++ for
  # an sdist-only dependency, worker missing requests). Triggered only by
  # image-relevant path changes (see the changes job filter), so the minute
  # cost stays low; GHA layer cache keeps incremental builds ~5-10 min.
  docker-build:
    name: docker-build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # torch/CUDA 依赖链（funasr）已移除，镜像体积回落；保留 free-disk-space
      # 作为磁盘余量兜底（torch 时代 ubuntu-latest ~14GB 曾在构建中途耗尽，
      # 2026-08-06 run 31108609762 实测），回收 runner 预装的
      # Android/dotnet 等无关负载。
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Build host image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: host
          push: false
          cache-from: type=gha,scope=host
          cache-to: type=gha,mode=max,scope=host

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
