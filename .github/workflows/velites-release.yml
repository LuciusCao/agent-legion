# velites 二进制发布管道（issue #381）：worker 镜像不再内置任何 agent runtime
# 执行器后，velites 以平台匹配的独立二进制分发——docker worker 经 compose
# bind mount 挂到 /app/data/bin/velites，裸机部署经 scripts/ensure-velites.sh
# --dest data/bin 安置。本 workflow 在 velites-v* tag push 时构建三平台产物
# 并创建 GitHub Release。
#
# tag 命名：velites-v<Cargo.toml version>（如 velites-v0.4.0-alpha）。版本线
# 独立于仓库版本（scripts/check_versions.py 强制解耦纪律），所以不能用仓库
# 的 v* tag 蹭发；validate job 会核对 tag 与 velites/Cargo.toml 一致，防手滑。
#
# 平台与 glibc：linux 产物在 rust:1-bookworm 容器内构建（glibc 2.36，与
# worker 镜像的 python:*-slim-bookworm 基础一致），可运行于 Debian 12+ /
# Ubuntu 24.04+；更老的用户态需自行从源码构建。macos 产物在 arm64 runner
# 上原生构建。只发布主二进制 velites；velites-schema 是开发期工具，不进
# Release。
name: velites-release

on:
  push:
    tags:
      - "velites-v*"

permissions:
  contents: write

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match velites/Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#velites-v}"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('velites/Cargo.toml','rb'))['package']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "tag velites-v${tag} 与 velites/Cargo.toml version=${version} 不一致" >&2
            exit 1
          fi

  build-linux:
    name: build ${{ matrix.triple }}
    needs: validate
    runs-on: ${{ matrix.runs-on }}
    container: rust:1-bookworm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # container job 的默认 shell 是 sh（dash，无 pipefail）；脚本步骤统一
      # bash——首次触发即踩坑（sh: Illegal option -o pipefail）。
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --manifest-path velites/Cargo.toml

      # 构建即冒烟：产物必须能在目标平台上跑起来（--version 走 clap 的
      # version 属性，不需要配置与网络）。
      - name: Smoke test
        shell: bash
        run: ./velites/target/release/velites --version

      # 版本号直接取自 tag（validate job 已核对与 Cargo.toml 一致），避免在
      # rust 容器里引入 python3 依赖。
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="velites-${GITHUB_REF_NAME#velites-v}-${{ matrix.triple }}"
          mkdir -p "dist/${name}"
          cp velites/target/release/velites "dist/${name}/velites"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: velites-${{ matrix.triple }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: build aarch64-apple-darwin
    needs: validate
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked --manifest-path velites/Cargo.toml

      - name: Smoke test
        run: ./velites/target/release/velites --version

      - name: Package
        run: |
          set -euo pipefail
          name="velites-${GITHUB_REF_NAME#velites-v}-aarch64-apple-darwin"
          mkdir -p "dist/${name}"
          cp velites/target/release/velites "dist/${name}/velites"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: velites-aarch64-apple-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: create release
    needs: [build-linux, build-macos]
    # fork 防护：公开仓库的 fork 打 tag 也会触发本 workflow，但 fork 没有
    # contents:write 权限写回本仓库——显式限定只在本仓库发版，避免 fork 上
    # 白跑三个构建矩阵。
    if: github.repository == 'LuciusCao/agent-legion'
    runs-on: ubuntu-latest
    # subagent review P3：notes 逐 commit 调 API（实测 ~2-3s/commit，本仓库
    # 历史最差区间 263 commits），串行估算 3-8 分钟；超时发生在三个 40 分钟
    # 构建全部成功之后，代价极高，余量给足。
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # codex P1 on #533：下方 notes 生成要 git ls-remote origin 查上一个
      # velites tag——GitHub-hosted runner 是全新环境，没有 checkout 就没有
      # origin；depth 1 即可（只查 tag 引用，不看历史）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate checksums
        run: cd dist && sha256sum ./*.tar.gz > sha256.txt

      # velites 版本线独立于仓库版本，两个 velites tag 之间整仓会合大量
      # host/worker PR——GitHub 自动生成的 release notes 按整仓 compare
      # 列 PR，与 velites 二进制无关的变更全混进来（v0.5.1 曾带 97 行）。
      # 这里改为按 velites/ 子树过滤：compare 出的每个 commit 单查其变更
      # 文件（compare 响应自带的 per-commit files 在 diff 大时会被截断，
      # 逐 commit 的 commits/{sha} 接口才完整），含 velites/ 文件的进清单。
      # merge commit 的 files 是合并结果全量——宽进（碰过即列）比漏报好，
      # 语义上它也确实把这个 PR 的 velites 改动带进了本版本线。
      - name: Generate velites-scoped release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # subagent review P3-8：注入面显式买断——validate job 已要求 tag ==
          # velites-v + Cargo.toml version（semver 字符集），这里再钉一道，
          # 防将来放宽 validate/needs 时 TAG 展开重开注入面。
          [[ "${TAG}" =~ ^velites-v[0-9][0-9A-Za-z.+~-]*$ ]] || {
            echo "unexpected tag name: ${TAG}" >&2; exit 1; }

          # 上一个 velites-v* tag：版本降序候选里第一个「确为本 tag 祖先」
          # 的（subagent review P2-2：回补旧线发版时版本最大的 tag 可能晚于
          # 当前 tag——compare 反向区间 commits 为空，notes 会静默变空。按
          # compare status==ahead 校验祖先关系，命中即定）。
          PREV=""
          for cand in $(git ls-remote --tags --refs --sort=-v:refname origin 'refs/tags/velites-v*' \
            | awk -v cur="refs/tags/${TAG}" '$2 != cur {print $2}' | sed 's|refs/tags/||'); do
            status="$(gh api "repos/${REPO}/compare/${cand}...${TAG}" --jq '.status')"
            if [ "$status" = "ahead" ]; then PREV="$cand"; break; fi
          done
          RANGE="${PREV:+${PREV}...}${TAG}"
          echo "compare range: ${RANGE:-${TAG}}"

          commits="$(gh api "repos/${REPO}/compare/${RANGE:-${TAG}}" --paginate --jq '.commits[] | .sha')"
          {
            echo "## What's Changed (velites/ only)"
            echo
            for sha in $commits; do
              # codex P2 + subagent review：commits/{sha} 的 files 每页 100 条，
              # 大 merge commit（如 #503 有 182 个文件）必须聚合一页以上的
              # 全量再判断——--paginate 时 jq 按页独立执行，先收集每页计数
              # 再整体求和。awk 求和而非 bc：runner 镜像不预装 bc（macOS 本
              # 地有，正是本地验证漏掉它的原因）。失败不吞（fail-loud）：
              # notes 缺条目比发布失败更难察觉。
              velites_hits="$(gh api "repos/${REPO}/commits/${sha}" --paginate \
                --jq '[.files[].filename] | map(select(startswith("velites/"))) | length' \
                | awk '{s+=$1} END {print s+0}')"
              if [ "${velites_hits:-0}" -gt 0 ]; then
                gh api "repos/${REPO}/commits/${sha}" \
                  --jq '"* \(.commit.message | split("\n")[0]) — \(.html_url)"'
              fi
            done
            echo
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${RANGE:-${TAG}}"
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256.txt
          body_path: release-notes.md
