name: Nightly Gate

# Weekly stress lane, split out of quality-gate.yml (issue #193): these jobs
# never run on PR/push, so a dedicated file removes the schedule special
# case from the quality-gate `changes` job and keeps the weekly run out of
# the quality-gate concurrency group (a scheduled run on a trunk ref could
# cancel an in-flight push gate for the same ref). Weekly, not nightly, to
# fit the Actions minutes budget; manual dispatch runs the same jobs.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: nightly-gate-${{ github.ref }}
  # Never cancel a running stress scenario midway; a dispatch run waits.
  cancel-in-progress: false

env:
  # Same trio as quality-gate.yml — workflow-level env does not cross files.
  UV_CACHE_DIR: /home/runner/.cache/uv
  AGENT_LEGION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_ci
  AGENT_LEGION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_legion_test_ci

jobs:
  # Weekly workspace stress + multi-browser smoke (test architecture plan,
  # Phase 4C). The stress step runs the existing five-minute scenario against
  # a real backend and uploads report.md + frontend-metrics.json for
  # diagnostics; the smoke step re-runs the deterministic browser suite on
  # Firefox/WebKit as well (PR/push stays Chromium-only via E2E_BROWSERS).
  # Stress profile rationale: 50 agents / 2000 jobs / 300s at 200 events/s
  # keeps the page under live SSE traffic long enough for stable click
  # latency / long task / memory samples while the whole job stays well
  # under the 45-minute timeout (local 5-agent/60s validation: ~95s total).
  # The multi-browser suite includes the main-flow spec (#240), so like
  # quality-gate's e2e-smoke this job needs the velites binary (Host code
  # sandbox + Worker agent runtime) and its sandbox backend.
  nightly-e2e:
    name: nightly-e2e
    # #1142: pinned — ubuntu-latest migrates to Ubuntu 26 on 2026-10-19; unpin after validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync

      - run: npm ci
        working-directory: frontend

      # velites binary + sandbox backend: the main-flow spec's Host code
      # sandbox and the standalone Worker's agent runtime are both fail-closed
      # without it (the runner builds it via scripts/ensure-velites.sh --dest
      # data/bin), same as quality-gate's e2e-smoke job.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: velites
          # One shared cache across the rust lane and both e2e jobs: the e2e
          # jobs build the same velites release binary, so they warm-start
          # from the rust lane's cache instead of a ~14min cold build.
          shared-key: velites

      # velites sandbox backend; Ubuntu 24.04 restricts unprivileged userns
      # via AppArmor (current bubblewrap has no setuid mode), so the
      # disposable CI VM must explicitly enable userns.
      - name: Install bubblewrap (velites sandbox backend)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Browser binaries cache: a cold download stalled for 41 minutes once
      # (run 30816362118, FLAKY-004) and ate the whole nightly budget.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: Multi-browser smoke E2E
        run: uv run python scripts/e2e/run_browser_smoke.py
        env:
          AGENT_LEGION_E2E_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          E2E_BROWSERS: chromium,firefox,webkit

      - name: Workspace stress run
        run: >-
          uv run python scripts/stress/run_e2e_stress.py
          --agents 50 --jobs 2000 --duration 300 --event-rate 200
        env:
          # Shared runners hiccup under load: allow occasional probe timeouts
          # while the p95 click-latency assertion still guards regressions.
          STRESS_PROBE_TIMEOUT_MS: "5000"
          STRESS_MAX_PROBE_ERRORS: "3"

      - name: Upload stress report and metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-stress-${{ github.run_id }}
          path: stress-results/
          retention-days: 14

  ci-extended:
    name: ci-extended
    # Repeated stress scenarios; too slow for the PR/push loop. Runs weekly
    # (schedule) and on manual dispatch, replacing the old per-push policy.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Tests create their own databases via the *_TEST_DATABASE_URL.
          POSTGRES_DB: agent_legion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # --reruns 1 matches the tier gates and is what makes the flaky
      # governance below meaningful: registered flakes get one retry and
      # land in the rerun report; without it a flake fails outright and the
      # report is always empty (codex review on PR #25).
      - name: CI extended architecture evidence
        run: |
          mkdir -p test-results
          uv run pytest -q tests/ci -m ci_extended \
            --durations=30 \
            --junitxml=test-results/ci-extended-junit.xml \
            --reruns 1 \
            --reruns-delay 2 \
            -p scripts.pytest_telemetry
        env:
          AGENT_LEGION_RERUN_REPORT: test-results/ci-extended-reruns.json

      - name: CI extended test summary
        if: always()
        env:
          AGENT_LEGION_COV: "0"
        run: |
          uv run python scripts/summarize_test_results.py \
            --title "CI extended test evidence" \
            --junit test-results/ci-extended-junit.xml \
            --rerun-report test-results/ci-extended-reruns.json \
            --output test-results/ci-extended-summary.md
          cat test-results/ci-extended-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Flaky governance (test architecture plan, Phase 5D): reruns are fine
      # only for nodeids registered in tests/flaky_registry.yaml (deadline
      # expiry is the exemption-expiry job's call, #941).
      - name: Fail on unregistered reruns
        if: always()
        run: >-
          uv run python scripts/check_reruns.py
          --rerun-report test-results/ci-extended-reruns.json

  # Weekly exemption expiry governance (issue #270): refresh the tracked
  # issue-state manifest from GitHub (the only networked step of the
  # exemption lifecycle), then run the offline expiry detection that the
  # quick gate also runs. A closed anchor issue fails here so the exemption
  # gets fulfilled or re-anchored before the manifest lands on trunk.
  # #1150: the manifest commit is automated — the stale-manual-ritual gap is
  # what kept this lane (and the whole nightly) red for five weeks. The job
  # commits the refreshed manifest directly to the default branch; the
  # detection still fails the job when an anchor issue closed, so the
  # exemption gets fulfilled or re-anchored before the commit lands.
  exemption-expiry:
    name: exemption-expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      # gh ships on GitHub runners pre-authenticated with GITHUB_TOKEN;
      # scope the token to public read of the exemption anchor issues.
      - name: Refresh issue-state manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m scripts.refresh_issue_states

      # Auto-commit the refreshed manifest (#1150 decision 2a): the manifest
      # is machine-derived state; a manual "make architecture-issue-states"
      # ritual on a single-maintainer repo rots silently (5 weeks of red
      # nightly, #1150). Direct pushes to main are ruleset-blocked for the
      # Actions bot (required quality-gate check; no clean Integration bypass
      # exists on personal repos), so the commit rides a dedicated branch and
      # a PR with auto-merge — the docs-only lane (changes + docs-terms) is
      # exactly the gate this manifest change should pass. Detection below
      # still fails the job on a closed anchor, before anything is proposed.
      - name: Propose refreshed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-legion-nightly-bot"
          git config user.email "actions@github.com"
          if git diff --exit-code config/architecture/issue-states.json; then
            echo "manifest already current"
            exit 0
          fi
          branch="chore/issue-states-sync"
          git checkout -B "$branch"
          git add config/architecture/issue-states.json
          git commit -m "chore(architecture): refresh issue-state manifest (nightly, #1150)"
          # --force (not --force-with-lease): auto-merge deletes the branch
          # after landing, so the runner's remote-tracking cache is stale and
          # a lease check spuriously rejects the next sync. The branch is a
          # single-purpose sync pointer — force is the intended semantics.
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(architecture): issue-state manifest refresh (nightly)" \
            --body "Machine-derived state refresh from the nightly exemption-expiry job (#1150). Auto-merge on green." \
            || echo "PR already open"
          gh pr merge --auto --squash "$branch" \
            || echo "auto-merge not enabled on this PR"

      - name: Detect expired exemptions
        run: uv run python -m scripts.check_invariants

      # #295: the flaky registry had no deadline-expiry equivalent of the
      # exemption lifecycle above — an expired entry surfaced only when the
      # nightly extended suite happened to run (or never). Same cadence,
      # same job: the check is deadline-only here, rerun evidence stays on
      # the ci-extended job. Since #941 this is the only place an expired
      # deadline fails (PR CI and the unit tier stay clock-free); entries
      # due within 7 days surface as ::warning:: annotations on the run.
      - name: Detect expired flaky-registry deadlines
        run: uv run python scripts/check_reruns.py --check-deadlines

      # #1024: the schedule only ever checks out the default branch, so
      # entries living only on an unreleased release/* train had
      # no expiry check at all. Fetch those branch tips (globs: a missing
      # branch matches nothing instead of failing the fetch) and read each
      # maintained branch's registry from git — every
      # release/X.Y.Z above the default branch's pyproject version; shipped
      # trains are covered by the step above. Selection rule and the
      # lenient (pre-#941 schema) parsing live in the script, unit-tested.
      - name: Fetch maintained branch tips
        run: >-
          git fetch --no-tags --depth=1 origin
          '+refs/heads/release/*:refs/remotes/origin/release/*'
          || echo "no release/* branches to fetch (empty glob is fatal
          in newer git)"

      - name: Detect expired flaky-registry deadlines on maintained branches
        run: uv run python -m scripts.quality.flaky_branch_deadlines

  # Dependency vulnerability audit (issue #969): `make audit` =
  # scripts/check-deps-audit.sh — pip-audit over the frozen uv.lock export
  # (PyPI/OSV advisory feed) plus `npm audit --omit=dev --audit-level=high`
  # over frontend/package-lock.json (npm registry advisories). Both query
  # live advisory databases, so the verdict changes with time on an
  # unchanged tree: as a PR/push gate it would turn unrelated PRs red the
  # day an upstream CVE lands. Same reasoning as exemption-expiry above —
  # a networked, clock-dependent check runs on the weekly schedule and
  # fails here as a visible signal; fixes land as ordinary dependency PRs.
  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv: `uv export --frozen` + `uvx --from pip-audit` (no uv sync needed —
      # the audit reads uv.lock, not an installed venv).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      # npm audit reads package-lock.json only; no npm ci needed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Dependency vulnerability audit
        run: make audit

  # #1150 decision 2c: the nightly was red for five straight weeks without
  # anyone noticing — a weekly red has no push notification. Open (or update)
  # exactly one tracking issue per failing lane on every failure; the search
  # by exact title dedups so a persistently red lane keeps one issue, not a
  # new one per week. GitHub emails the repo owner on new issue + comment.
  failure-tracker:
    name: failure-tracker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="nightly gate red: ${{ github.event.schedule != '' && 'weekly run' || 'dispatch' }} (${{ github.run_id }})"
          body="Nightly run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Opened automatically by the failure-tracker job (#1150). Close when the nightly is green again."
          existing=$(gh issue list --state open --search "in:title \"nightly gate red\"" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            num=$(gh issue list --state open --search "in:title \"nightly gate red\"" --json number --jq '.[0].number')
            gh issue comment "$num" --body "Still red: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$title" --body "$body" --label ops
          fi
