name: Worker Resource Measurement

on:
  pull_request:
    paths:
      - ".github/workflows/worker-resource-measurement.yml"
      - "deploy/.env.example"
      - "deploy/compose.host.yaml"
      - "deploy/compose.worker.measurement.yaml"
      - "deploy/compose.worker.standalone.yaml"
      - "deploy/compose.worker.yaml"
      - "Dockerfile"
      - "scripts/install-worker.sh"
      - "scripts/stress/worker_resource_*.py"
      - "tests/scripts/test_install_worker*.py"
      - "tests/stress/test_worker_resource_*.py"
  workflow_dispatch:
    inputs:
      cold_repetitions:
        description: Fresh-volume iterations per measurement envelope
        required: true
        default: "1"
      warm_repetitions:
        description: Reused-volume/image iterations per measurement envelope
        required: true
        default: "2"
      pids_interval_ms:
        description: High-frequency thread-count sampling interval
        required: true
        default: "100"
      memory_interval_ms:
        description: Whole-cgroup memory sampling interval
        required: true
        default: "500"
      mem_limit:
        description: Candidate Worker memory limit (empty keeps unlimited)
        required: false
        default: ""
      pids_limit:
        description: Candidate Worker pids limit (empty keeps unlimited)
        required: false
        default: ""
      fault_mem_limit:
        description: Disposable-container memory fault limit (empty skips)
        required: false
        default: ""
      fault_pids_limit:
        description: Disposable-container pids fault limit (empty skips)
        required: false
        default: ""

permissions:
  contents: read

env:
  UV_CACHE_DIR: /home/runner/.cache/uv

jobs:
  measure:
    name: measure-${{ matrix.envelope }}
    runs-on: ubuntu-24.04
    env:
      MEASUREMENT_NET_ADMIN: NET_ADMIN
      MEASUREMENT_APPARMOR: apparmor:unconfined
      MEASUREMENT_COLD_REPETITIONS: ${{ inputs.cold_repetitions || '1' }}
      MEASUREMENT_WARM_REPETITIONS: ${{ inputs.warm_repetitions || '2' }}
      MEASUREMENT_PIDS_INTERVAL_MS: ${{ inputs.pids_interval_ms || '100' }}
      MEASUREMENT_MEMORY_INTERVAL_MS: ${{ inputs.memory_interval_ms || '500' }}
      MEASUREMENT_MEM_LIMIT: ${{ inputs.mem_limit || '0' }}
      MEASUREMENT_PIDS_LIMIT: ${{ inputs.pids_limit || '-1' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - envelope: single
            agent_concurrency: 1
            code_concurrency: 1
            upload_concurrency: 1
            jobs_per_wave: 2
            artifact_kib: 64
          - envelope: mixed
            agent_concurrency: 2
            code_concurrency: 2
            upload_concurrency: 2
            jobs_per_wave: 4
            artifact_kib: 256
          - envelope: upload-backlog
            agent_concurrency: 2
            code_concurrency: 2
            upload_concurrency: 2
            jobs_per_wave: 8
            artifact_kib: 1024
          - envelope: default
            agent_concurrency: 10
            code_concurrency: 0
            upload_concurrency: 4
            jobs_per_wave: 20
            artifact_kib: 1024
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: velites
          shared-key: worker-resource-measurement

      - name: Build the external velites runtime
        run: ./scripts/ensure-velites.sh --dest data/bin

      - name: Measure the real Worker container
        run: >-
          uv run python scripts/stress/worker_resource_workload.py
          --output-dir worker-resource-results/${{ matrix.envelope }}
          --agent-concurrency ${{ matrix.agent_concurrency }}
          --code-concurrency ${{ matrix.code_concurrency }}
          --upload-concurrency ${{ matrix.upload_concurrency }}
          --jobs-per-wave ${{ matrix.jobs_per_wave }}
          --artifact-kib ${{ matrix.artifact_kib }}
          --cold-repetitions "$MEASUREMENT_COLD_REPETITIONS"
          --warm-repetitions "$MEASUREMENT_WARM_REPETITIONS"
          --pids-interval-ms "$MEASUREMENT_PIDS_INTERVAL_MS"
          --memory-interval-ms "$MEASUREMENT_MEMORY_INTERVAL_MS"

      # Only generated reports, numeric samples and sanitized logs are uploaded.
      # The work dir (models, configs, tokens) is deliberately outside this path.
      - name: Upload raw samples, summaries and sanitized logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-resource-measurement-${{ matrix.envelope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker-resource-results/${{ matrix.envelope }}/
          if-no-files-found: error
          retention-days: 14

      - name: Surface measurement status
        if: always()
        run: >-
          uv run python -c
          "import json,pathlib; p=pathlib.Path('worker-resource-results/${{ matrix.envelope }}/run-report.json');
          d=json.loads(p.read_text()); print(json.dumps(d, indent=2)); raise SystemExit(0 if d['success'] else 1)"

  installer-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENT_LEGION_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync

      - name: Exercise real installer fresh, idempotent, upgrade and rollback paths
        run: uv run pytest -q tests/scripts/test_install_worker.py tests/scripts/test_install_worker_docker.py

      - name: Assert default resource limits in real Compose renders
        run: |
          for file in deploy/compose.worker.yaml deploy/compose.worker.standalone.yaml deploy/compose.host.yaml; do
            env -u AGENT_WORKER_RESOURCE_LIMITS_MODE -u AGENT_WORKER_MEM_LIMIT -u AGENT_WORKER_PIDS_LIMIT \
              docker compose --env-file /dev/null -f "$file" config --format json |
              uv run python -c 'import json,sys; w=json.load(sys.stdin)["services"]["worker"]; assert str(w["mem_limit"]) == "268435456" and w["pids_limit"] == 128; assert w["environment"]["AGENT_WORKER_RESOURCE_LIMITS_MODE"] == "default"; assert w["cap_add"] == ["SYS_ADMIN"]'
          done

      - name: Assert explicit resource limits in a real Compose render
        run: |
          env AGENT_WORKER_RESOURCE_LIMITS_MODE=explicit AGENT_WORKER_MEM_LIMIT=512m AGENT_WORKER_PIDS_LIMIT=128 \
            docker compose -f deploy/compose.worker.standalone.yaml config --format json |
            uv run python -c 'import json,sys; w=json.load(sys.stdin)["services"]["worker"]; assert str(w["mem_limit"]) == "536870912" and w["pids_limit"] == 128; assert w["environment"]["AGENT_WORKER_RESOURCE_LIMITS_MODE"] == "explicit"'

      - name: Assert explicit unlimited values in a real Compose render
        run: |
          env AGENT_WORKER_RESOURCE_LIMITS_MODE=explicit AGENT_WORKER_MEM_LIMIT=0 AGENT_WORKER_PIDS_LIMIT=-1 \
            docker compose -f deploy/compose.worker.standalone.yaml config --format json |
            uv run python -c 'import json,sys; w=json.load(sys.stdin)["services"]["worker"]; assert w.get("mem_limit", 0) == 0 and w["pids_limit"] == -1; assert w["environment"]["AGENT_WORKER_RESOURCE_LIMITS_MODE"] == "explicit"'

  fault-injection:
    runs-on: ubuntu-24.04
    steps:
      - name: Prove a lower memory limit kills a disposable container
        if: ${{ inputs.fault_mem_limit != '' }}
        env:
          FAULT_MEM_LIMIT: ${{ inputs.fault_mem_limit }}
        run: |
          name="worker-resource-memory-fault-$$"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          set +e
          docker run --name "$name" --memory "$FAULT_MEM_LIMIT" --memory-swap "$FAULT_MEM_LIMIT" \
            python:3.13-slim python -c \
            'blocks=[]; exec("while True:\n    blocks.append(bytearray(16 * 1024 * 1024))")'
          status=$?
          set -e
          test "$status" -ne 0
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$name")" = true
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$name")" -gt 0

      - name: Prove a lower pids limit rejects disposable-container threads
        if: ${{ inputs.fault_pids_limit != '' }}
        env:
          FAULT_PIDS_LIMIT: ${{ inputs.fault_pids_limit }}
        run: |
          name="worker-resource-pids-fault-$$"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          set +e
          output="$(docker run --name "$name" --pids-limit "$FAULT_PIDS_LIMIT" \
            python:3.13-slim python -c \
            'import threading,time; [threading.Thread(target=time.sleep,args=(30,)).start() for _ in range(256)]' 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          case "$output" in *"can't start new thread"*) ;; *) exit 1 ;; esac
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$name")" = "$FAULT_PIDS_LIMIT"
