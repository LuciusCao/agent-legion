- id: FLAKY-012
  nodeid: tests/scripts/test_quality_gate_scripts.py::test_quick_gate_backend_test_failure_still_runs_frontend_round
  owner: test-infra
  reason: >-
    Loaded-runner timing flake, observed on 0.7.13 development PRs (#701/#704
    backend-coverage rerun governance; also hit once during local #628 review
    under a full-suite batch run). The test drives the REAL check-quick.sh
    inside a fixture repo and asserts the stub lanes' start/end ordering via
    marker files; under heavy parallel runner load the poll loop's
    marker-file visibility window can race the stub's own writing, so the
    first attempt fails and the --reruns 1 retry passes in isolation. Fix
    direction (deadline item): make the stub lanes fsync their markers or
    add a bounded wait on the marker file instead of relying on immediate
    visibility.
  observed: >-
    PR #701 and #704 backend-coverage lanes, 2026-09-16 (rerun absorbed);
    single-attempt local reproduction under batch load only.
  deadline: 2026-12-31
