# Flaky test governance registry (test architecture plan, Phase 5D).
#
# Every known flaky test or flake scope gets an owner, a reason, and either a
# fix deadline or `recurring: true` for irreducible infrastructure noise.
# Global `--reruns 1` stays, but reruns are no longer silently absorbed:
# scripts/check_reruns.py fails PR CI when a rerun hits a nodeid outside this
# registry or when a non-recurring entry outlives its deadline; nightly also
# checks deadlines without requiring a rerun report.
# Field style follows config/architecture/architecture-exemptions.yaml.
entries:
- id: FLAKY-007
  nodeid: tests/services/test_studio_chat_service_sessions.py::test_session_lifecycle_turn_and_token_revocation
  owner: test-infra
  reason: >-
    FIXED by #525 (0.7.12): the test now takes a bounded _wait_for on the
    tool_call row before asserting (the original failure read tool_calls in
    the window between the text and tool_call persists). Entry kept until a
    scheduled nightly run confirms the fix under load, then delete.
  observed: Local quick gate on review/architecture (c8913a71 + audit fixes),
    2026-08-27; isolated rerun passed.
  deadline: 2026-10-14
- id: FLAKY-004
  scope: ci-infra:docker-hub
  owner: test-infra
  reason: CI infrastructure hiccups outside repository control. A Docker Hub
    pull of postgres:17 timed out once, the artifact API returned 503 once,
    and a cold Playwright browser download stalled for 41 minutes (run
    30816362118, ate the 45-minute nightly budget). Playwright binaries are
    now cached via actions/cache keyed on frontend/package-lock.json;
    retrying the job remains the correct response for the rest.
  observed: CI runs during 2026-07/2026-08 CI topology split (Phase 5A/5B);
    Playwright stall in run 30816362118.
  recurring: true
- id: FLAKY-005
  scope: nightly:stress-probe-timeout
  owner: test-infra
  reason: Single stress probe timeout on the first 4C nightly run; shared
    runners hiccup under load. Mitigated via STRESS_PROBE_TIMEOUT_MS /
    STRESS_MAX_PROBE_ERRORS thresholds in scripts/stress/_validation_stub.py;
    the p95 click-latency assertion stays strict.
  observed: First nightly-e2e stress run after Phase 4C, 2026-08.
  recurring: true
- id: FLAKY-006
  nodeid: tests/workflows/test_sharding.py::test_every_shard_claim_goes_through_leases
  owner: test-infra
  reason: tests/workflows/test_sharding.py::test_every_shard_claim_goes_through_leases
    failed once in a local pre-push quick gate run (pull request 175,
    2026-08-26) and passed on rerun before the same push; it also passed
    twice in isolation and all 17 sharding tests under -n 4 in the same
    session. The test itself is process-free (FakeShardExecutor, sqlite
    leases), so the failure mode is machine-load timing in the _poll_until
    loops' tight timeouts, not the code under test. Retrying the gate is the
    correct response; if it recurs, widen the poll timeouts before
    considering a deeper fix.
  observed: Local pre-push quick gate for 9f479768 (pull request 175),
    2026-08-26; retry run passed in 47s.
  deadline: 2026-09-30
- id: FLAKY-009
  nodeid: tests/routes/test_studio_publish_request_races.py::test_concurrent_creates_leave_exactly_one_pending
  owner: test-infra
  reason: >-
    PARTLY FIXED by #453 (0.7.12): the order-sensitive created_at assertion
    is now order-insensitive (the race's real invariant — exactly one pending
    row, whichever request won). The INSERT/supersede interleaving under
    READ COMMITTED can still transiently exceed the poll window on a loaded
    runner, so rerun absorption stays until a nightly confirms.
    The #429 three-round P1 regression pin: two concurrent request_publish
    calls race on the partial unique index (one pending row per workspace).
    The flake observed in the release-train PR #636 CI (backend-coverage
    lane, run 34762377305, 2026-09-13) was a retry-rerun, not a failure —
    the second attempt passed and the final count was green; the rerun
    governance step failed only because the nodeid was not yet registered.
    Timing family: the two threads' INSERT/supersede interleaving under
    READ COMMITTED can transiently exceed the default poll/lock window on
    a loaded runner. Registered for rerun absorption; the assertion itself
    (exactly one pending row) is the invariant under test and stays.
  observed: PR #636 backend-coverage lane (run 34762377305), 2026-09-13, rerun passed and the lane was green.
  deadline: 2026-10-13
- id: FLAKY-010
  nodeid: tests/services/test_workflow_draft_publish.py::test_publish_creates_active_revision
  owner: test-infra
  reason: >-
    The plain publish path (serialize → freeze node_code pins → create
    revision row) reran once in the release-train PR #636 CI
    (backend-coverage lane, run 34765238572, 2026-09-13) — the retry
    passed and the lane's only failure was the rerun-governance step.
    Same loaded-runner timing family as FLAKY-009 (publish-path lock
    waits): the postgres lane runs three shards plus coverage on a
    2-core runner, and advisory-lock waits can transiently exceed the
    rerun threshold. Registered for rerun absorption; the assertions
    themselves are stable in isolation (42+ consecutive local passes).
  observed: PR #636 backend-coverage lane (run 34765238572), 2026-09-13, rerun passed.
  deadline: 2026-10-13
