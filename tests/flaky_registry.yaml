# Flaky test governance registry (test architecture plan, Phase 5D).
#
# Every known flaky test or flake scope gets an owner, a reason, and either a
# fix deadline or `recurring: true` for irreducible infrastructure noise.
# Global `--reruns 1` stays, but reruns are no longer silently absorbed:
# scripts/check_reruns.py fails nightly CI when a rerun hits a nodeid outside
# this registry or when a non-recurring entry outlives its deadline.
# Field style follows config/architecture/architecture-exemptions.yaml.
entries:
- id: FLAKY-002
  scope: frontend:component-jsdom-timeout
  owner: test-infra
  reason: Frontend component tests hit the 5s jsdom timeout in batches when
    runner load exceeds ~40 parallel workers; isolated reruns pass. The
    historical single offender (InteractionOverlay.test.tsx, 12 options x 12
    clicks, failed in CI runs 30805689114 and 30814709192) was mitigated with
    a per-test 20s timeout and has since been deleted with the video-hive
    player cluster (PR 183 dead-code sweep). Root cause fixed 2026-08-27 —
    the component project now carries a project-level 20s testTimeout
    (frontend/vite.config.ts), so every heavy jsdom render gets the slack
    without per-test overrides. Keeping the entry registered until the next
    scheduled nightly-e2e run confirms the fix under load.
  observed: https://github.com/LuciusCao/agent-legion/actions/runs/30814709192
  deadline: 2026-09-15
- id: FLAKY-007
  scope: backend:studio-chat-turn-tool-call-timing
  owner: test-infra
  reason: tests/services/test_studio_chat_service_sessions.py::test_session_lifecycle_turn_and_token_revocation
    failed once in a local full quick gate (2026-08-27, worktree arch-review;
    the file was since split out of test_studio_chat_service.py, #207)
    while two sibling worktrees ran their own vitest suites in parallel; the
    assertion saw the turn's agent message but not yet its tool_call content
    (async event coalescing), and an isolated rerun passed in 44.7s. Same
    machine-load timing family as FLAKY-006 — the correct response is
    retrying the gate; if it recurs, add a bounded wait for the tool_call
    event instead of relying on immediate visibility.
  observed: Local quick gate on review/architecture (c8913a71 + audit fixes),
    2026-08-27; isolated rerun passed.
  recurring: true
- id: FLAKY-003
  scope: backend:xdist-coverage-combine
  owner: test-infra
  reason: xdist coverage combine dropped one postgres worker's data under high
    load once (first 5B gate round reported 59% lines; rerun recovered to
    93.5%). The 59% in CI run 30805689114 was a separate orchestration bug
    (already fixed) and is NOT this entry.
  observed: Local 5B gate run, 2026-08 (Phase 5B acceptance evidence).
  deadline: 2026-09-01
- id: FLAKY-004
  scope: ci-infra:docker-hub
  owner: test-infra
  reason: CI infrastructure hiccups outside repository control. A Docker Hub
    pull of postgres:17 timed out once, the artifact API returned 503 once,
    and a cold Playwright browser download stalled for 41 minutes (run
    30816362118, ate the 45-minute nightly budget). Playwright binaries are
    now cached via actions/cache keyed on frontend/package-lock.json;
    retrying the job remains the correct response for the rest.
  observed: CI runs during 2026-07/2026-08 CI topology split (Phase 5A/5B);
    Playwright stall in run 30816362118.
  recurring: true
- id: FLAKY-005
  scope: nightly:stress-probe-timeout
  owner: test-infra
  reason: Single stress probe timeout on the first 4C nightly run; shared
    runners hiccup under load. Mitigated via STRESS_PROBE_TIMEOUT_MS /
    STRESS_MAX_PROBE_ERRORS thresholds in scripts/stress/_validation_stub.py;
    the p95 click-latency assertion stays strict.
  observed: First nightly-e2e stress run after Phase 4C, 2026-08.
  recurring: true
- id: FLAKY-006
  scope: backend:sharding-lease-poll-timing
  owner: test-infra
  reason: tests/workflows/test_sharding.py::test_every_shard_claim_goes_through_leases
    failed once in a local pre-push quick gate run (pull request 175,
    2026-08-26) and passed on rerun before the same push; it also passed
    twice in isolation and all 17 sharding tests under -n 4 in the same
    session. The test itself is process-free (FakeShardExecutor, sqlite
    leases), so the failure mode is machine-load timing in the _poll_until
    loops' tight timeouts, not the code under test. Retrying the gate is the
    correct response; if it recurs, widen the poll timeouts before
    considering a deeper fix.
  observed: Local pre-push quick gate for 9f479768 (pull request 175),
    2026-08-26; retry run passed in 47s.
  recurring: true
