exemptions:
- check: architecture.file_budget
  path: server/app/routes/artifacts.py
  reason: Artifact routes authenticate the per-Worker token used by Agent
    execution transport, and the per-file upload path grew past the plain
    baseline with the scoped-token work (#35). Deletion was re-assessed for
    (#287) and rejected with evidence the CAS channel is still live it is
    the degradation path when object storage is optional (AGENT_LEGION_S3_*
    unset leaves JobArtifactObjectStore.enabled false, dispatch manifests
    then carry no artifact_uploads and Workers POST per-file), the Host
    completion accepts mixed sha256 refs, and min_protocol_version defaults
    to 1 so pre-D12 Workers are not fenced at registration. The durable
    resolution stays deleting this router once object storage is a required
    deployment and the retired Worker generation is fenced (re-anchored
    160 then 287 then 300), not splitting deprecated code.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 61
- check: architecture.route_response_model
  path: server/app/routes/studio_chat.py:session_events
  reason: Studio chat session events are a Server-Sent Events stream
    (StreamingResponse, text/event-stream), same shape as the workspace job
    events route; there is no JSON response model to name.
  owner: workspace-executor
  remove_when: docs/architecture/studio-phase3-implementation-plan.md
- check: architecture.route_response_model
  path: server/app/routes/agent_workers.py:result
  reason: Agent Worker result acknowledgement returns an empty 204 response by protocol.
  owner: workspace-executor
  remove_when: docs/architecture/backend.md#agent-worker-protocol-responses
- check: architecture.route_response_model
  path: server/app/routes/agent_workers.py:release_slot
  reason: Agent Worker release-slot acknowledgement returns an empty 204 response by protocol.
  owner: workspace-executor
  remove_when: docs/architecture/backend.md#agent-worker-protocol-responses
- check: architecture.file_budget
  path: server/app/services/agent_service.py
  reason: Schema v27 made this service the only Agent catalog source of truth;
    the short-TTL published-definition cache (hot claim-path reads) lives next
    to the lifecycle methods so publish/archive can invalidate it in one
    place. Split the cache into its own module when it gains more policy —
    the dsn-identity cache-key helper (#187) is one of the call sites the
    ConnectSource retirement (#280) will rework, which is the natural split
    window. The original anchor (#196) closed with the studio_chat split
    without touching this service.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/280
  ceiling: 135
- check: architecture.file_budget
  path: server/app/storage/s3_client.py
  reason: The job-detail artifact preview (issue 11) added open_range (ranged
    GET) to the storage protocol and the S3 client implementation so
    object-store-only media can serve browser Range requests (seekable
    playback without whole-object downloads). The protocol and its S3
    implementation must stay in one file; revisit when the storage layer
    grows a second backend implementation.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/11
  ceiling: 155
- check: architecture.file_budget
  path: frontend/src/components/dag/dagNodeTypes.ts
  reason: The hover-highlight rework (#276) adds the two data-level boolean
    fields (active/dimmed) that make per-node memoization work; the interface
    is a flat field list where each line IS a feature, so the 2-line growth
    is the honest cost of the fix, not splittable structure.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 33
- check: architecture.file_budget
  path: frontend/src/components/dag/DagNode.module.css
  reason: The active-state styling (box-shadow plus outline rules) moved
    onto the node card itself with the hover-highlight rework (#276); the
    two extra rule lines are the visual contract of that rework.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 121
- check: architecture.file_budget
  path: frontend/src/components/dagHighlight.ts
  reason: The chained-comparison rework of hover highlighting (Codex P2
    review on PR 285) grows this pure module by the prev-visual-state
    parameter, the prev/active node lookup maps, and the hover state
    machine -- the atomic prevActiveNode/hoveredNode update via a reducer
    is what prevents a wasted full recompute round between hovers.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 121
- check: architecture.file_budget
  path: frontend/src/components/dag/DagGraph.tsx
  reason: The same Codex P2 batch on PR 285 as dagHighlight -- the chained
    highlight call site plus the reducer wiring grow the composition
    component past the split-era baseline.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 286
- check: architecture.file_budget
  path: server/app/jobs/queries/groups.py
  reason: The JobQueries facade gained two new domain mixins from both
    sides of the PR 285 merge -- GlobalSettingsKVQueriesMixin (KV
    centralization, issue 281 on this branch) and
    ApprovalDecisionQueriesMixin (human-approval node, PR 266 on develop).
    Each is a legitimate one-line composition entry; the combined file is
    one effective line past the stale ceiling.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 78
- check: architecture.file_budget
  path: server/app/routes/workflow_node_codes.py
  reason: The issue-211 Phase 2 URL-segment retirement keeps every historical
    workflow-key path registered as a deprecated alias next to the
    segment-free route (stacked decorators — the architecture doc generator
    only enumerates decorator-registered routes, so add_api_route would
    silently drop eight routes from backend.md). The deprecated aliases are
    the honest cost of the deprecation window; deleting them (Phase 3/4
    removal tracked in issue 211) drops the file back under the baseline
    ceiling and this exemption goes stale automatically. The Codex P2 fix on
    PR 299 adds _resolve_key (query-bound alias must equal the workspace id),
    which is part of the same deprecation-window cost.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 259
- check: architecture.file_budget
  path: server/app/routes/studio_agent_tools.py
  reason: Same issue-211 Phase 2 dual-path deprecation as
    workflow_node_codes.py — the studio-agent node-code tool routes keep
    their historical workflow-key alias registered as deprecated alongside
    the segment-free path. Removing the aliases with the Phase 3/4 URL
    cleanup in issue 211 retires this exemption. The Codex P2 fix on PR 299
    adds _resolve_key (query-bound alias must equal the workspace id), which
    is part of the same deprecation-window cost.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 192
