  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/300
  ceiling: 93
- check: architecture.file_budget
  path: server/app/workflow_worker/mark_scan.py
  reason: The issue-211 Phase 3 read-binding batch rekeys the scan state
    per workspace — the pre-v62 shape where several workspaces shared one
    workflow key collapsed them into a single scan state, and the v62
    binding (key equals the workspace id) makes that shape unreachable. The
    overage is the docstring documenting the per-workspace rekey, and Phase 4
    drops the workflow_key parameter entirely, retiring this exemption.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 97
- check: architecture.file_budget
  path: server/app/db/migrations/jobs_workflow_key_alignment.py
  reason: The issue-211 Phase 3 v68 data migration aligns every stored
    workflow_key with the v62 binding across the live tables plus the
    node_code entity-key prefix. Each composite-unique surface carries its
    collision rule — status-count merge (upsert plus delete), state-table
    twin drop, revision active-archive plus uniform version-shift, and the
    entity-key published-wins twin rules (twin pass precedes the demotion so
    frozen-pin hashes survive; both-published twins resolve to the
    window-era row), state-table multi-generation dedupe, and the re-prefix
    separator guard. The issue-211 M2 batch adds the post-v70 shape guard
    via the shared has_column probe (fresh databases already run the
    terminal shape; each pass skips its table instead of failing the
    replay). The overage is that single transaction's honest cost; M2
    dropped the workflow_key columns, and M3 (retiring the deprecated
    contract fields) collapses these migration bodies and the exemption
    with them.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 242
- check: architecture.file_budget
  path: server/app/db/migration_chain.py
  reason: The issue-211 M2 batch registers v70 (retire_workflow_key_columns) —
    one registry entry plus its comment; the chain only grows one entry per
    schema version. Stale after the M3 cleanup collapses the chain comments.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 108
- check: architecture.file_budget
  path: server/app/db/migrations/runs_sql.py
  reason: The issue-211 M2 batch adds _INSERT_RUNS_SQL_V70 — the
    column-less twin of the job_batches cutover (without it a pre-v53
    database upgraded to v70+ silently drops every historical batch row).
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/211
  ceiling: 145
- check: architecture.file_budget
  path: server/app/db/migrations/workspace_execution_defaults.py
  reason: The issue-211 M2 batch adds the revision-key probe and the
    column-less query twin (pre-v64 databases upgraded to v70+ would
