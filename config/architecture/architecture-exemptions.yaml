exemptions:
- check: architecture.route_response_model
  path: server/app/routes/studio_chat.py:session_events
  reason: Studio chat session events are a Server-Sent Events stream
    (StreamingResponse, text/event-stream), same shape as the workspace job
    events route; there is no JSON response model to name.
  owner: workspace-executor
  remove_when: docs/architecture/studio-phase3-implementation-plan.md
- check: architecture.route_response_model
  path: server/app/routes/agent_workers.py:result
  reason: Agent Worker result acknowledgement returns an empty 204 response by protocol.
  owner: workspace-executor
  remove_when: docs/architecture/backend.md#agent-worker-protocol-responses
- check: architecture.route_response_model
  path: server/app/routes/agent_workers.py:release_slot
  reason: Agent Worker release-slot acknowledgement returns an empty 204 response by protocol.
  owner: workspace-executor
  remove_when: docs/architecture/backend.md#agent-worker-protocol-responses
- check: architecture.file_budget
  path: server/app/routes/artifacts.py
  reason: Artifact routes authenticate the per-Worker token used by Agent
    execution transport, and the per-file upload path grew past the plain
    baseline with the scoped-token work (#35). The routes serve the retired
    CAS transfer channel that only pre-D12 Workers still call; the durable
    resolution is deleting this router when that Worker generation is gone
    (#160), not splitting deprecated code.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/160
  ceiling: 61
- check: architecture.file_budget
  path: server/app/worker_control.py
  reason: Task 8 of the phase2 state-externalization plan persists pause state
    in worker_control_state (upsert on pause/resume, uncached reads on is_paused);
    reset_all_to_paused runs once at control-plane startup because resume state
    must not survive a restart. The single cohesive class outgrows the
    in-memory-era baseline and the budget will be re-ratcheted if the module
    shrinks.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/190
  ceiling: 70
- check: architecture.file_budget
  path: server/app/jobs/queries/workflow_revisions.py
  reason: Task 1 of the workflow-studio-ux-refinement plan adds the get_workflow_revision
    query; Agent Legion atomically materializes Agent routes with revision publication
    (per-node capacities were replaced by workspace-level workspace_agent_capacities),
    pruning rows absent from the new projection. Extract the projection write helper
    after rollout.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/195
  ceiling: 209
- check: architecture.file_budget
  path: server/app/settings.py
  reason: PostgreSQL-only configuration adds a validated database URL and its
    explicit environment override. Agent Worker secret-file configuration is
    resolved at the same trusted boundary. The retired yaml cms
    credential keys are rejected at this boundary with migration guidance
    (config governance G2; CMS credentials themselves moved to instance-level
    external connections, schema v34), as are the retired yaml agents catalog and
    workflows.pi block (agent config governance phase 3, schema v27). The
    AGENT_LEGION_DATABASE_URL
    environment override lives here too (config
    governance G4). Extract database settings into the configuration
    package after rollout.
  owner: config
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/188
  ceiling: 216
- check: architecture.file_budget
  path: server/app/services/workflow_revisions.py
  reason: Active revisions reconcile Agent routes at Host startup (capacity is
    workspace-level via workspace_agent_capacities), warning and skipping revisions
    whose capability mapping is ambiguous, and skipping the reconcile entirely
    when the catalog has zero enabled definitions so routes are never pruned by
    an empty-catalog regression. Publish also snapshots node_code_pins (the
    published custom code versions, EXEC-CODE-002) alongside the definition.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/195
  ceiling: 131
- check: architecture.file_budget
  path: server/app/agent_broker/dispatch.py
  reason: Agent config governance phase 3 moved the strict execution-block
    resolution (node override -> workflow top-level default -> fail fast,
    runtime-pinned command builder; the workspace default retired at schema
    v63) into the dispatch boundary; the manifest builder and the
    resolver share the runtime binary constants, so splitting now would just
    scatter one cohesive rule. The per-run Agent version pin (schema v29,
    EXEC-QUALITY-REPLAY-001) added the pinned_agent_version passthrough. Extract
    the resolver when the agent-broker structure-debt batch (#198) reworks the
    dispatch boundary.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/198
  ceiling: 160
- check: architecture.file_budget
  path: server/app/services/agent_service.py
  reason: Schema v27 made this service the only Agent catalog source of truth;
    the short-TTL published-definition cache (hot claim-path reads) lives next
    to the lifecycle methods so publish/archive can invalidate it in one
    place. Split the cache into its own module when it gains more policy —
    tracked with the wide-service structure batch (#196). The facade-connect
    source aliasing (#187) adds the dsn-identity cache-key helper here.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/196
  ceiling: 135
- check: architecture.file_budget
  path: server/app/storage/s3_client.py
  reason: The job-detail artifact preview (issue 11) added open_range (ranged
    GET) to the storage protocol and the S3 client implementation so
    object-store-only media can serve browser Range requests (seekable
    playback without whole-object downloads). The protocol and its S3
    implementation must stay in one file; revisit when the storage layer
    grows a second backend implementation.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/11
  ceiling: 155
- check: architecture.file_budget
  path: worker/config_store.py
  reason: The ceiling rose past the main-side floor before the only-down
    ratchet existed (#35-era scoped-token work, 2026-08-26); the 0.4.0 release
    merge anchors on main and rejects the historical raise. The baseline
    entry is pinned back at the main floor and the overage is carried here
    as tracked debt — split the store below the floor (#250) and this
    exemption goes stale automatically.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/250
  ceiling: 229
- check: architecture.file_budget
  path: worker/service.py
  reason: Same release-merge grandfathering as worker/config_store.py — the
    pre-ratchet ceiling rise is legitimate develop history that main has not
    caught up with; split the service below the main floor (#250) to retire
    this exemption.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/250
  ceiling: 167
- check: architecture.file_budget
  path: worker/supervisor.py
  reason: Same release-merge grandfathering as worker/config_store.py — the
    pre-ratchet ceiling rise is legitimate develop history that main has not
    caught up with; split the supervisor below the main floor (#250) to
    retire this exemption.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/250
  ceiling: 254
