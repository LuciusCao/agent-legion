exemptions:
- check: architecture.scheduler_threadpool
  path: server/app/workflow_worker_thread.py:self._pools[executor_id]
  reason: WorkflowWorkerThread creates one shared ThreadPoolExecutor per executor
    definition to submit adapter executions; each pool is bounded by the executor's
    global capacity and keyed by executor_id, not workspace.
  owner: workspace-executor
  remove_when: issues/open/032-P2-event-driven-worker.md
- check: architecture.file_budget
  path: server/app/main.py
  reason: Task 9 of the phase1 event-bus plan converges the six route service
    constructions from routes/__init__.py into create_app; extracting an
    AppContainer composition module will bring main.py back under budget.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase1-legacy-retirement-event-bus.md#task-9
  ceiling: 211
- check: architecture.file_budget
  path: server/app/agents.py
  reason: Task 9 of the phase1 event-bus plan routes agent WS broadcasts through
    the EventBus (subscribe/forward in connect, bus publish in _broadcast, public
    broadcast_controller); the WS forwarding block will be extracted into its own
    module once the event-bus migration completes.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase1-legacy-retirement-event-bus.md#task-9
  ceiling: 248
