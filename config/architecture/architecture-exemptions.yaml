    form, console behind an ssh tunnel) the same config surface the UI
    already has: the console path needs a tunnel and hand-editing the
    mounted yaml triggers the supervisor divergence warning without taking
    effect. Five lines of honest cost (one argparse declaration with its
    help text, one payload mapping entry); the file is a flat argv table
    where each line IS a flag — nothing to split without forking the
    parser. Remove together with the supervisor spawn split (#451).
