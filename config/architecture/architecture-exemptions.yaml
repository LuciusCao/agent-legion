  reason: >-
    The writes stage split (#448, reviewed on PR #461) moves into
    evaluate_candidate — the promote-write sequence (node flip, node_runs/
    executor_leases inserts, request claim, jobs promote) is the tail of
    the per-candidate evaluation that must close the "evaluate" stage where
    the writes begin, or the whole claim's write cost folds into evaluate
