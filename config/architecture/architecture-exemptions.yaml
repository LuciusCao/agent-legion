- check: architecture.file_budget
  path: server/app/db/migrations/jobs_workflow_key_alignment.py
  reason: The issue-211 Phase 3 v68 data migration aligns every stored workflow_key with the v62 binding
    across the live tables plus the node_code entity-key prefix. Each composite-unique surface carries
    its collision rule — status-count merge (upsert plus delete), state-table twin drop, revision active-archive
    plus uniform version-shift, and the entity-key published-wins twin rules (twin pass precedes the demotion
    so frozen-pin hashes survive; both-published twins resolve to the window-era row), state-table multi-generation
    dedupe, and the re-prefix separator guard. The issue-211 M2 batch adds the post-v70 shape guard via
    the shared has_column probe (fresh databases already run the terminal shape; each pass skips its table
    instead of failing the replay). The overage is that single transaction's honest cost; M2 dropped the
    workflow_key columns; the bodies stay after M3 because older databases still upgrade directly through
    v68. Re-anchored #211 → #1030 at the #211 M3 close (frozen migration body; see #1030).
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/1030
  ceiling: 208
