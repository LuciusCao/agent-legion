    single executor spawn site — the one place where os.environ is
    snapshotted into the child — so proxy semantics (configured proxy vs
    stripped default) apply to the executor and all agent subprocesses in
    one hop. Moving the Popen call out just to dodge 2 lines would split
    supervision state (_process/_generation) across modules; revisit when
    supervisor grows its next feature, not for this.
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/451
  ceiling: 237
