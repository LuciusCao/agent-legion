- check: architecture.file_budget
  path: worker/runtime/preflight.py
  reason: '#381 moved velites/pi out of the worker image (runtime executors are externally-mounted
    binaries now), which turned "forgot to mount" from a rare deployment accident into a routine
    mistake with a silent failure mode — auto-detection yields an empty set and the worker registers
    with zero capacity. The expect-runtimes guard added here (env parsing, missing-detection
    against the runtime catalog, actionable error text covering the bundled dir and PATH) doubles
    the file past its first ceiling. The module stays a single cohesive concern (startup preconditions
    for the executor); splitting the guard into its own module was rejected because preflight_error
    would reduce to a shell over two helpers. Revisit the split if preflight grows a third guard.
    The staleness reconciliation (the third guard) lives in staleness.py since #835; the residual
    overage is the expect-runtimes error text and the name re-export that keeps the historical
    import path alive. Re-anchored by #926 from #835 (closed) to #998: the overage above is
    the shipped feature itself and the removal condition above stands; #998 tracks at most five
    entries (#917 A-2).'
  owner: workspace-executor
  remove_when: issues/open/github.com/LuciusCao/agent-legion/issues/998
  ceiling: 57
