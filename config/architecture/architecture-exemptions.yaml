    in worker_control_state (upsert on pause/resume, uncached reads on is_paused);
    reset_all_to_paused runs once at control-plane startup because resume state
    must not survive a restart. The single cohesive class outgrows the
    in-memory-era baseline and the budget will be re-ratcheted if the module
    shrinks.
