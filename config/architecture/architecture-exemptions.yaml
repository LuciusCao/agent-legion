  # Route import boundary exemptions ----------------------------------------------------------
  - check: architecture.route_import_boundary
    path: server/app/routes/questions.py:server.app.cms.client
    reason: Question detail route uses CMS token client directly while the CMS resource resolver is being moved out of routes.
    owner: workspace-executor
    remove_when: issues/open/040-P2-question-route-cms-boundary.md

  - check: architecture.route_import_boundary
    path: server/app/routes/questions.py:server.app.cms.question
    reason: Question detail route uses CMS question fetcher directly while the CMS resource resolver is being moved out of routes.
    owner: workspace-executor
    remove_when: issues/open/040-P2-question-route-cms-boundary.md

  # Scheduler threadpool exemption ------------------------------------------------------------
  - check: architecture.scheduler_threadpool
    path: server/app/workflow_worker_thread.py:self._pools[executor_id]
    reason: WorkflowWorkerThread creates one shared ThreadPoolExecutor per executor definition to submit adapter executions; each pool is bounded by the executor's global capacity and keyed by executor_id, not workspace.
    owner: workspace-executor
    remove_when: issues/open/032-P2-event-driven-worker.md

