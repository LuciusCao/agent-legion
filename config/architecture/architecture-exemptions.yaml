    closing the stage from claim_windows around the whole call — cannot see
    the skip paths (a skipped candidate has no writes and must not pollute
    the segment); splitting the promote sequence out to a sibling module
    would fork the one lock-order invariant this module owns. The original
    anchor (#448) closed with phase 2 restructured elsewhere; re-anchored
