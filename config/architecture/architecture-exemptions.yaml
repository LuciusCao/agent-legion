- check: architecture.scheduler_threadpool
  path: server/app/workflow_worker/thread.py:self._pools[executor_id]
  reason: WorkflowWorkerThread creates one shared ThreadPoolExecutor per executor
    definition to submit adapter executions; each pool is bounded by the executor's
    global capacity and keyed by executor_id, not workspace.
  owner: workspace-executor
  remove_when: issues/open/032-P2-event-driven-worker.md
- check: architecture.file_budget
  path: server/app/main.py
  reason: Task 9 of the phase1 event-bus plan (complete) converged the six route
    service constructions from routes/__init__.py into create_app; the remaining
    path under budget is extracting an AppContainer composition module. Agent
    Worker composition wires the PostgreSQL broker, catalog sync, artifact
    store, completion handler, and Host scheduler in one lifecycle. The ceiling
    holds actual + buffer until that extraction lands.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase1-legacy-retirement-event-bus.md#task-9
  ceiling: 226
- check: architecture.file_budget
  path: server/app/worker_control.py
  reason: Task 8 of the phase2 state-externalization plan persists pause state
    in worker_control_state (upsert on pause/resume, uncached reads on is_paused);
    reset_all_to_paused runs once at control-plane startup because resume state
    must not survive a restart. The single cohesive class outgrows the
    in-memory-era baseline and the budget will be re-ratcheted if the module
    shrinks.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase2-state-externalization.md#task-8
  ceiling: 83
- check: architecture.file_budget
  path: server/app/agents.py
  reason: Task 9 of the phase1 event-bus plan (complete) routes agent WS broadcasts
    through the EventBus (subscribe/forward in connect, bus publish in _broadcast,
    public broadcast_controller); the WS forwarding block will be extracted into
    its own module. Task 9 of the phase4 agent-collaboration plan envelopes WS
    messages (snapshot/agent_busy/agent_idle) and buffers per-agent incremental
    events between flushes. The dormant workspace assignment functions were
    removed per issues/closed/050-P3-agents-py-assignment-functions-deferral.md
    and the ceiling was tightened to actual + buffer.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase1-legacy-retirement-event-bus.md#task-9
  ceiling: 302
