exemptions:
- check: architecture.scheduler_threadpool
  path: server/app/workflow_worker_thread.py:self._pools[executor_id]
  reason: WorkflowWorkerThread creates one shared ThreadPoolExecutor per executor
    definition to submit adapter executions; each pool is bounded by the executor's
    global capacity and keyed by executor_id, not workspace.
  owner: workspace-executor
  remove_when: issues/open/032-P2-event-driven-worker.md
- check: architecture.scheduler_threadpool
  path: server/app/workflow_worker_thread.py:self._submit_pool
  reason: Task 6 of the phase3 execution-decoupling plan routes all submit-only
    (remote) claims to one shared ThreadPoolExecutor bounded at 4 workers;
    submission is a quick enqueue and must not scale with executor capacity.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase3-execution-decoupling.md#task-6
- check: architecture.file_budget
  path: server/app/main.py
  reason: Task 9 of the phase1 event-bus plan converges the six route service
    constructions from routes/__init__.py into create_app; extracting an
    AppContainer composition module will bring main.py back under budget.
    Task 6 of the phase3 execution-decoupling plan wires the
    RemoteCompletionHandler callback registration into the lifespan.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase1-legacy-retirement-event-bus.md#task-9
  ceiling: 218
- check: architecture.file_budget
  path: server/app/worker_control.py
  reason: Task 8 of the phase2 state-externalization plan persists pause state
    in worker_control_state (upsert on pause/resume, uncached reads on is_paused);
    the single cohesive class outgrows the in-memory-era baseline and the budget
    will be re-ratcheted if the module shrinks.
  owner: workspace-executor
  remove_when: docs/superpowers/plans/2026-07-18-phase2-state-externalization.md#task-8
  ceiling: 58
- check: architecture.file_budget
  path: server/app/agents.py
  reason: Task 9 of the phase1 event-bus plan routes agent WS broadcasts through
