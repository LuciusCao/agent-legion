  # Rust-side wrap policy (seatbelt/bwrap argv) is covered by
  # velites/tests/sandbox_wrap.rs; registry targets allow only tests//scripts/.
  - id: EXEC-CODE-003
    statement: "All (DB-backed) node code executes only inside the velites OS sandbox (`velites sandbox wrap`: macOS seatbelt / Linux bubblewrap) with deny-by-default policy — read-only filesystem except job_dir and tmp, network denied unless the capability opts in via sandbox_network — and fail-closed: without a sandbox backend node code never runs unsandboxed. This holds on the Host (the bare multiprocessing child retired with the path mechanism in #96) and on a Worker alike (worker/code_runner.py): the Worker verifies code_hash before spawn, and its startup preflight refuses to start when code capacity is declared without a resolvable velites binary (fail-closed). Worker-side binary resolution is shared between preflight, code_runner and execution_prepare (worker/binary_resolution.py resolve_binary): the bundled copy `data/bin/velites` (installed per-platform via `scripts/ensure-velites.sh --dest data/bin`) takes precedence over PATH, so a Worker machine needs no preinstalled velites."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_code_executor.py::test_node_code_fails_closed_without_sandbox
        gate: quick
      - kind: integration
        target: tests/executors/test_code_executor.py::test_custom_sandbox_denies_network_by_default
        gate: quick
      - kind: integration
        target: tests/executors/test_code_executor.py::test_custom_sandbox_denies_writes_outside_job_dir
        gate: quick
      - kind: integration
        target: tests/workers/test_code_runner.py::test_build_sandbox_argv_structure
        gate: quick
      - kind: integration
        target: tests/workers/test_runtime_preflight.py::test_preflight_code_capacity_requires_velites
        gate: quick
      - kind: integration
        target: tests/workers/test_runtime_preflight.py::test_resolve_binary_prefers_bundled_over_path
        gate: quick
      - kind: integration
        target: tests/workers/test_code_runner.py::test_execute_code_uses_bundled_velites_when_path_missing
        gate: quick
      - kind: integration
        target: tests/workers/test_code_runner.py::test_execute_code_fails_closed_without_any_velites
        gate: quick

  - id: EXEC-CODE-004
    statement: "Code node runtimes never carry a database handle or DSN: builtin and sandboxed children share one runtime key set, and every DB-derived input (job_batch, skill_versions) is prefetched by the parent executor (server/app/executors/_code_runtime.py). Privileged actions stay in the parent: nodes report upstream auth failures only by dropping a marker file under job_dir (NodeContext.report_auth_failure, workspace_libs/node_sdk.py); the parent re-validates the connection key and performs the token invalidation after the child exits. Design: docs/architecture/node-sdk-and-worker-execution-design.md."
    owner: workspace-executor
    risk: high
    evidence:
