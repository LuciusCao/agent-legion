  - id: MATERIAL-ACCESS-001
    statement: "Node code accesses materials only through the materialization cache: the dispatching parent (Host build_runtime / Worker code_runner) downloads the object into a content-addressed local cache (shared/material_cache.py, atomic tmp+rename, oldest-mtime eviction towards a byte budget) and both sandbox argv builders grant a single STATIC allow-read root for that cache directory (server/app/executors/_code_sandbox.py, worker/code_runner.py — kept in sync); dynamically allow-reading arbitrary host paths (per-material grants, user-supplied roots) is forbidden, and the node SDK exposes only the materialized local path (ctx.material)."
