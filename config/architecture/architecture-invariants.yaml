  - id: DB-SCAN-INCREMENTAL-001
    statement: "jobs.updated_at is the workflow worker's change signal: every jobs-row mutation that can alter scheduling evaluation (status, execution_paused, execution_mode, target_node_key, workflow_definition_hash) must bump updated_at in the same transaction. The poll pass refreshes its per-workflow mark cache via a watermark delta query (list_changed_job_marks) instead of re-fetching all active marks; the delta lower bound slides with the database clock minus a fixed overlap window (covering rows that commit slightly out of timestamp order without pinning the bound to a past bulk-enqueue burst), and a periodic full rescan (MarkStore.FULL_RESCAN_SECONDS) reconciles deletions, missed bumps, and transactions open longer than the overlap. Node completions inside a still-running job do not bump updated_at; running jobs are therefore always re-evaluated every pass (also covering pending shards)."
    owner: workflow-worker
    risk: high
    evidence:
      - kind: integration
        target: tests/workers/test_workflow_worker_mark_scan.py
        gate: quick
      - kind: integration
        target: tests/workers/test_workflow_worker_ready_queue.py
        gate: quick

  - id: DB-JOB-STATUS-COUNTS-001
    statement: "workspace_job_status_counts is the read source for count_jobs_by_status (event aggregator flush, job list snapshot, intake/deletion broadcasts); a group-by over the workspace's whole jobs slice is O(workspace jobs) per call and does not scale to 200k-job workspaces. Row triggers on jobs (insert/delete/update of status, workspace_id) keep the counter table transactionally in sync with every write path regardless of caller; the v36 backfill rebuilds it from jobs and is idempotent. The read path preserves the legacy queued → pending merge and omits zero-count statuses, so results are identical to the group-by it replaced."
    owner: jobs
    risk: high
    evidence:
      - kind: integration
        target: tests/db/test_job_status_counts_migration.py
        gate: quick

  - id: DB-WORKFLOW-CATALOG-001
    statement: "The global workflow catalog (workflow_catalog table, schema v40) is retired at schema v50 (issue #112): a workflow is the DAG inside one workspace, so workspaces.default_workflow_key is a plain text identifier (old job rows keep their workflow_key as text) and the workspace's ACTIVE workflow_revision is the only runtime definition source — node override validation and settings schemas (workspace_node_config / workspace_settings_schemas), snapshot-less job fallbacks (job detail, run-to, rerun, preview), package artifact curation, and the worker scan list all resolve it; the catalog list/register HTTP APIs and the studio-agent register/list tools are gone, and the built-in demo definition stays in the repo (server/app/workflows/builtin.py) as the optional sample-template seed at workspace creation. Creating a workspace no longer selects or validates a workflow: demo mode seeds the sample template (defaulting to it when no key is given), blank mode leaves the key slot empty and the first successful draft publish adopts the draft's key; the v50 migration drops the table after warning about registered keys no workspace references."
