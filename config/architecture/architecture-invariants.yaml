invariants:
  - id: API-CONTRACT-001
    statement: Generated frontend API types remain in sync with the backend OpenAPI schema.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/generate-api-types.sh
        gate: quick

  - id: BOUNDARY-LAYER-001
    statement: Architecture contract checks enforce layer boundaries between routes, services, and pipeline phases.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick

  - id: SECURITY-PATH-001
    statement: Video and job filesystem operations stay inside managed roots and reject symlink escapes.
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_storage_paths.py
        gate: quick
      - kind: integration
        target: tests/full/test_storage_path_corruption.py
        gate: full

  - id: DB-MUTATION-001
    statement: "Job deletion rollback is conflict-safe: it restores only when the destination is absent, uses atomic same-filesystem rename, and preserves the staged recovery path when a concurrent recreation exists."
    owner: jobs
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_job_deletion_service.py
        gate: quick
      - kind: integration
        target: tests/full/test_job_deletion_races.py
        gate: full

  - id: EXEC-STATE-001
    statement: "Continue/resume operations for workspace jobs reject terminal states (completed, failed, cancelled) and only transition explicitly paused jobs, validating state inside the same transaction."
    owner: jobs
    risk: high
    evidence:
      - kind: integration
        target: tests/test_workspace_job_control_flow.py
        gate: quick
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick

  - id: BOUNDARY-READ-001
    statement: "Video detail GET is read-only; cache persistence occurs only on explicit write/event paths such as producing-phase completion or an explicit cache refresh."
    owner: video-hive
    risk: high
    evidence:
      - kind: integration
        target: tests/routes/test_video_intake.py::test_video_detail_read_only_does_not_update_video
        gate: quick
      - kind: integration
        target: tests/test_video_read_service.py
        gate: quick

  - id: EXEC-STATS-001
    statement: "Workspace runtime stats derive from executor allocations, bindings, active leases, and configured capacities without consulting AgentStatusManager."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/test_workspace_configuration_service.py::test_executor_stats_report_configured_capacity_and_leases
        gate: quick
      - kind: integration
        target: tests/test_workspace_configuration_service.py::test_executor_stats_does_not_consult_agent_status_manager
        gate: quick
      - kind: integration
        target: tests/routes/jobs/test_workspace_stats.py::test_workspace_stats_executor_status_reflects_allocations_and_leases
        gate: quick

  - id: DB-LIFECYCLE-001
    statement: "SQLite connections opened by application and tests are deterministically closed."
    owner: database
    risk: high
    evidence:
      - kind: integration
        target: tests/test_sqlite_connection_lifecycle.py
        gate: quick

  - id: EXEC-CAPACITY-001
    statement: "Executor global capacity is shared across workspaces and never exceeded."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_workflow_worker_concurrency.py::test_global_capacity_enforced_by_lease_transaction
        gate: quick
      - kind: integration
        target: tests/full/test_executor_worker_fairness.py::test_shared_capacity_and_bounded_fairness
        gate: full

  - id: EXEC-FAIRNESS-001
    statement: "Runnable workspaces receive bounded scheduling opportunity under contention."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_workflow_worker_concurrency.py::test_round_robin_allows_small_workspace_to_claim
        gate: quick
      - kind: integration
        target: tests/full/test_executor_worker_fairness.py::test_shared_capacity_and_bounded_fairness
        gate: full
      - kind: failure_injection
        target: tests/ci/test_executor_worker_stress.py::test_fairness_under_randomized_insertion_order
        gate: ci_extended

  - id: EXEC-CANCEL-001
    statement: "Adapter-specific cancellation terminates active Pi/OpenClaw subprocess groups and isolated local handlers within a bounded grace period; worker shutdown waits only the grace period and releases capacity after child exit."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_executor_cancellation.py
        gate: quick
      - kind: integration
        target: tests/full/test_executor_cancellation_recovery.py
        gate: full

  - id: RECOVERY-MIGRATION-001
    statement: "Interrupted migration is atomic or reopens into a recoverable pre-migration state with valid foreign keys and integrity."
    owner: database
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_workspace_dag_fk_migration.py::test_v004_interruption_after_copy_recovers_on_reopen
        gate: quick
      - kind: integration
        target: tests/full/test_migration_interruption_recovery.py
        gate: full

  - id: RECOVERY-BACKUP-001
    statement: "A created SQLite backup can be restored atomically without losing the current database and reopened with invariant-preserving data."
    owner: database
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_executor_backup_restore.py::test_restore_preserves_current_database_and_returns_rows
        gate: quick
      - kind: integration
        target: tests/full/test_backup_restore_drill.py
        gate: full

  - id: CONFIG-STARTUP-001
    statement: "Secrets use environment overrides and enabled runtime dependencies fail validation at startup."
    owner: config
    risk: high
    evidence:
      - kind: integration
        target: tests/test_settings.py
        gate: quick
      - kind: integration
        target: tests/test_startup_validation.py
        gate: quick

  - id: EXEC-EVENT-001
    statement: |
      Workspace job lifecycle SSE events are broadcast to JobEventManager only
      after the underlying SQLite transaction has been committed. Broadcasting
      inside a transaction is forbidden because clients may react by querying
      the database and seeing pre-transaction state.
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/test_job_events.py
        gate: quick
      - kind: integration
        target: tests/full/test_workspace_sse.py
        gate: full

  - id: REPOSITORY-SIZE-001
    statement: |
      Source file line budgets are enforced by scripts/check_architecture.py.
      Temporary overruns must be recorded as architecture.file_budget exemptions
      in config/architecture/architecture-exemptions.yaml with a tracked removal
      condition, and the affected module must be split rather than indefinitely
      exempted.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: config/architecture/architecture-exemptions.yaml
        gate: quick
