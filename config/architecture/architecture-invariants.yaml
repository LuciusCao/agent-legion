  - id: EXEC-HARNESS-GUARD-001
    statement: "The velites bash tool rejects full-disk scan commands (recursive traversal from broad roots: find/rg/tree/du always, grep/ls with -r/-R — over /, /System, /Library, /Users, /home, /private, /Volumes, /Applications, and ~/$HOME including its expanded absolute form) before spawn, with or without the OS sandbox. Evasion handling: shell cwd tracking (`cd / && find .`, including relative paths under the tracked cwd), subshell groups `( … )`, quote/backslash concatenation ('$HOME'/, \\/), find leading global options (`find -L /`, BSD `-f`), pattern-via-option forms (`rg --files /`, `grep --regexp=x /`), wrapper commands with their options (sudo/env/nice/timeout/nohup/setsid/stdbuf/xargs), nested shells and eval (`bash -c '…'` recursed), shell variable indirection (`D=/; find $D`), and broad glob prefixes (`find /*`). The rejection is a tool error carrying remediation guidance (scoped search / command -v) back to the model. Scoped searches still execute. Rationale: under parallel agent load, per-job full-disk scans flood host fs indexing (fseventsd/Spotlight) and stall the machine."
    owner: workspace-executor
    risk: high
    evidence:
