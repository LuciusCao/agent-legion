  - id: EXEC-CODE-WORKER-001
    statement: "Code node executions reach a Worker only through the kind='code' lane of the Agent Worker protocol (protocol v2): agent_execution_requests carries kind ('agent'|'code', schema v39), Workers declare a separate max_code_concurrency pool that the Host accounts and enforces independently of the agent pool, and the code manifest ships the node code text plus its sha256 code_hash (resolved in resolve_dispatch_node_code order; the Worker refuses to run on hash mismatch) with a workspace_libs snapshot in the bundle. Worker-eligibility is a static import-closure scan (server/app/agent_broker/code_eligibility.py: closure ⊆ workspace_libs + stdlib + requests, dynamic imports forbidden, cached by code_hash); any node whose closure escapes the allowlist stays Host-local (no in-repo node does — the legacy video pipeline nodes that required server.app.pipeline.* were extracted from the repo with the business workflows). Dispatch probes for an online code-capable Worker declaring the node's capability (or '*') and falls back to the local Host executor when none matches — code requests never rot in queued waiting for a Worker; the probe mirrors the claim-side filters exactly (protocol v2 and the workspace's allowed_workspaces admission in addition to capability and code capacity), so a Worker that could never claim the request does not count as online. Code capacity requires protocol v2 (v1 heartbeats carry no cancel body): registration rejects max_code_concurrency>0 below v2, and claim evaluation re-checks the stored protocol version as defense in depth. The claim scan windows per kind (issue #125, schema v51 index (workspace_id, kind, queued_at)): each needed kind walks its own queued-head window ladder with its own attempt budget and the leading kind alternates per claim pass, so a queued flood of one kind never starves claims of the other. Code enqueue is throttled by the stockpile gate (executor_runtime.code_stock): global queued kind='code' stock stays below the online code-fleet capacity times a factor (floored by min_stock, capped at max_stock), and over-target nodes stay pending for the local pool instead of flooding the broker queue."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/services/test_code_claim.py
        gate: quick
      - kind: integration
        target: tests/services/test_agent_broker_claim_windows.py
        gate: quick
      - kind: integration
        target: tests/workers/test_code_stock_gate.py
        gate: quick
      - kind: integration
        target: tests/services/test_code_dispatch.py
        gate: quick
      - kind: contract
        target: tests/workflow_nodes/test_node_self_containment.py
        gate: quick
      - kind: integration
        target: tests/workers/test_code_runner.py::test_execute_code_hash_mismatch_refuses_before_spawn
        gate: quick
      - kind: integration
        target: tests/db/test_agent_request_kind_schema.py
