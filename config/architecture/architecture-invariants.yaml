  - id: EXEC-CODE-MANIFEST-001
    statement: "The queued kind='code' manifest never embeds the heavy runtime_context payloads (issue #142): agent_execution_requests.manifest_json persists only a lightweight audit stub (job_id, workspace_id, batch_id, batch_hash — server/app/agent_broker/code_manifest.py::runtime_context_stub), and the claim-response path rebuilds the full runtime_context (job, workspace, settings_config, job_batch, skill_versions) in memory from the database before shipping the manifest to the Worker (code_manifest.py::resolve_code_runtime_context, invoked from routes/agent_worker_claims.py) — never persisted. Code rows reaching a terminal state are slimmed back to the stub in the same transition (CODE_MANIFEST_TRIM, applied by every terminal write path: broker mark_done, cancel_request, requeue-limit-exceeded, zombie-claim close, agent-disabled and unclaimable sweeps, rerun cancellation in jobs/atomic_mutations.py), so legacy pre-fix rows drain automatically. Design: docs/architecture/node-sdk-and-worker-execution-design.md."
    owner: workspace-executor
    risk: high
