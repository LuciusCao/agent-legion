  - id: EXEC-QUALITY-REPLAY-001
    statement: "A quality replay never touches the original job: it builds an isolated copy job from the original's frozen workflow snapshot, file-copies the target node's frozen inputs, marks upstream nodes completed and downstream nodes not_applicable (only the replayed node is ever scheduled, and the copy converges to completed), and dispatches the pinned immutable Agent version (draft/published/archived) via the frozen batch payload pin — the broker enqueue check, claim candidate join, and definition sweepers match the pinned version row instead of the currently published one. Replay status is derived lazily from the copy job's node row; at most one replay per sample item may be in flight."
