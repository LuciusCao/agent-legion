        gate: quick
      - kind: integration
        target: tests/test_workflow_revisions.py::test_publish_revision_records_node_code_pins
        gate: quick
      - kind: integration
        target: tests/test_workflow_revisions.py::test_runtime_only_update_preserves_node_code_pins
        gate: quick

  # Rust-side wrap policy (seatbelt/bwrap argv) is covered by
  # velites/tests/sandbox_wrap.rs; registry targets allow only tests//scripts/.
  - id: EXEC-CODE-003
    statement: "Custom (DB-backed) node code executes only inside the velites OS sandbox (`velites sandbox wrap`: macOS seatbelt / Linux bubblewrap) with deny-by-default policy — read-only filesystem except job_dir and tmp, network denied unless the capability opts in via sandbox_network — and fail-closed: without a sandbox backend custom code never runs unsandboxed. Builtin repo-tracked nodes keep the bare multiprocessing child (EXEC-CODE-001)."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_code_executor.py::test_custom_node_code_fails_closed_without_sandbox
        gate: quick
      - kind: integration
        target: tests/executors/test_code_executor.py::test_custom_sandbox_denies_network_by_default
        gate: quick
      - kind: integration
        target: tests/executors/test_code_executor.py::test_custom_sandbox_denies_writes_outside_job_dir
        gate: quick

  - id: SECURITY-WORKER-001
    statement: "Agent Worker credentials are per-worker and revocable, persisted only as sha256 hashes; registration alone accepts the management token and execution endpoints require the per-worker token."
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/routes/test_agent_workers.py
        gate: quick
      - kind: integration
        target: tests/test_agent_broker.py::test_worker_registration_declares_runtime_and_machine_capacity
        gate: quick
      - kind: integration
        target: tests/full/test_agent_worker_control_plane.py::test_worker_token_is_hashed_and_revocable
        gate: full

  - id: DB-FAILURE-001
    statement: "node_runs/job_nodes failure_category is restricted to {'', 'technical', 'business', 'unknown'} (empty for non-failures); unrecognized failures classify as unknown and never default to technical; orphan recovery assigns (technical, worker_orphaned) and the stale-definition sweep assigns (technical, stale_definition) directly at their write paths."
    owner: jobs
    risk: high
    evidence:
      - kind: contract
        target: tests/services/test_failure_classification.py
        gate: quick
      - kind: integration
        target: tests/executors/leases/test_failure_classification_persistence.py
        gate: quick
      - kind: integration
        target: tests/test_agent_broker_concurrency.py::test_stale_definition_requests_are_failed_by_sweeper
        gate: quick

  - id: DB-FAILURE-002
    statement: "Transient failures (failure_detail in TRANSIENT_RETRY_DETAILS, currently only db_pool_timeout) return the job_node to 'pending' at the lease finish path for up to 3 total attempts instead of failing the job; every attempt stays recorded as its own failed node_run, and the final attempt fails node and job permanently."
    owner: jobs
    risk: high
    evidence:
      - kind: contract
        target: tests/services/test_failure_classification.py
        gate: quick
      - kind: integration
        target: tests/executors/leases/test_failure_classification_persistence.py
        gate: quick

  - id: EXEC-SHARD-001
    statement: "Shard executions must go through ExecutorLeaseRepository.try_claim with one lease per shard; fan-out paths that bypass the capacity system are forbidden."
    owner: architecture
    risk: critical
    evidence:
      - kind: integration
        target: tests/workflows/test_sharding.py
        gate: quick
      - kind: integration
        target: tests/full/test_shard_fanout_e2e.py
        gate: full

  - id: SECURITY-AUTH-001
    statement: "User sessions are revocable bearer tokens persisted only as sha256 digests with sliding expiry; management endpoints require the admin role; business routes require an authenticated user (anonymous gets 401); workspace membership gates reads (viewer) and writes (editor); repeated login failures lock the account temporarily."
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/routes/test_auth_routes.py
        gate: quick
      - kind: integration
        target: tests/routes/test_auth_matrix.py
        gate: quick
      - kind: integration
        target: tests/test_auth_queries.py
        gate: quick
      - kind: integration
        target: tests/full/test_auth_control_plane.py
        gate: full

  - id: CONFIG-MANIFEST-001
    statement: "Agent manifests carry only config_schema-whitelisted, non-secret config keys (keys marked `secret` never leave the server); effective node config resolves schema defaults → workflow node config → workspace override, each layer validated against the typed schema subset, and is frozen into the intake batch payload."
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_config_schema.py
        gate: quick
      - kind: integration
        target: tests/services/test_node_config.py
        gate: quick
      - kind: integration
        target: tests/full/test_node_config_manifest.py
        gate: full

  - id: VAULT-SECRET-001
    statement: "Workspace secret values are Fernet-encrypted at rest in workspace_secrets, never persisted as plaintext in node configs or intake batch snapshots (only `secret_ref` markers are stored), never returned by any API (secrets endpoints are write-only and the settings payload exposes only `secret_set` markers), and are resolved to plaintext in memory only at the server-side consumption points, with vault-resolved values covered by log redaction."
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/services/test_vault.py
        gate: quick
      - kind: integration
        target: tests/routes/test_workspace_secrets.py
        gate: quick
      - kind: integration
        target: tests/full/test_vault_secret_freeze.py
        gate: full

  - id: CONFIG-YAML-001
    statement: "Tracked split config yaml files carry no secret values: the global `cms:` section is retired from split yaml (CMS selector defaults live in the capability config_schema; base_url/token arrive via env CMS_BASE_URL / CMS_TOKEN or workspace node config), so a `cms` key in any split file fails the owned-key check, while single-file explicit configs still reject the retired `cms.token` / `cms.token_gen` keys at startup (G2); the `openclaw` section is retired from split yaml into the DB instance settings document (a split-file `openclaw` key fails the owned-key check; the admin API contract rejects extra keys), and `openclaw.skill_safety` refs (G3, pinned by the DB `skill_lock` document in `global_settings`) are rejected at startup validation and by the instance-settings admin API (422), and the env-only sections `vault` / `auth` are rejected by the owned-key check when written into any split file. Secrets reach the runtime only via env overrides or the vault."
    owner: config
    risk: high
    evidence:
      - kind: contract
        target: tests/test_config_yaml_hygiene.py
        gate: quick
      - kind: integration
        target: tests/test_settings.py
        gate: quick
      - kind: integration
        target: tests/test_configuration_loader.py
        gate: quick

  - id: EXEC-EVENT-SCHEMA-001
    statement: "The velites event stream schema (velites/schema/events.schema.json, exported from velites/src/events.rs) stays wire-compatible with the Host consumers: every shared/pi_events allowlisted type exists in the schema and the consumed fields (usage/provider/model/stopReason/errorMessage/tool metadata, retry and outputs_validation payloads) keep their names and types; delta events (message_update/tool_execution_update) never appear."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: contract
        target: tests/executors/test_velites_event_contract.py
        gate: quick

  - id: EXEC-HARNESS-ISOLATION-001
    statement: "velites has zero auto-discovery: agent context comes only from --system-prompt, explicit --skill directories, and the @prompt instruction — an AGENTS.md (or any other file) in the working directory is never read into provider requests or the event stream. The absence is structural (no discovery code exists), not a disabled feature."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_velites_controllability.py::test_no_auto_discovery
        gate: quick

  - id: EXEC-HARNESS-BUDGET-001
    statement: "velites run budgets (--max-turns, --max-tokens, wall-clock deadline) are enforced inside the agent loop: exhaustion injects exactly one wrap-up turn and the run always terminates with agent_end carrying reason=budget_exceeded, never by silent truncation or outer hard-kill alone."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_velites_controllability.py::test_budget_exhaustion_marks_agent_end
        gate: quick

  - id: EXEC-HARNESS-OUTPUTS-001
    statement: "velites enforces the declared output contract at exit: when --require-output artifacts are declared and any is still missing when a non-cancelled run ends (normal stop, budget exhaustion, or unrecovered model error), the harness exits 1 — an exit-0 run with missing declared outputs never reaches the caller. Cancellation (SIGTERM) is exempt as a deliberate Host action; the outputs_validation{missing:[...]} event is still emitted on normal/budget endings for Host-side observability."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_velites_controllability.py::test_require_output_still_missing_reports_validation
        gate: quick

  - id: EXEC-SKILL-HERMETIC-001
    statement: "The skills base dir is a read-only runtime input: cache lock files live under runs_dir (never next to the skill cache), and resolving a skill whose cache already sits clean at the pinned commit performs no writes (no checkout/clean) — a read-only skills mount (container deployment) works for every steady-state execution and validation. Writes (clone/fetch/checkout/clean) happen only on cache misses or version changes."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/test_skill_manager.py::test_get_skill_dir_works_with_read_only_skills_base
        gate: quick
      - kind: integration
        target: tests/test_skill_manager.py::test_cache_lock_files_live_under_runs_dir
        gate: quick

  - id: EXEC-HARNESS-SANDBOX-001
    statement: "velites confines the bash tool in a default-on OS-level filesystem sandbox (macOS seatbelt via sandbox-exec, Linux bubblewrap): reads are limited to the working directory, the session dir, explicit --skill dirs and system paths; writes are limited to the working directory, the session dir and $TMPDIR//tmp — escapes surface as tool_execution_end{isError: true}. When the sandbox backend is unavailable the harness fails closed (non-zero exit before the agent loop) and never degrades to an unsandboxed run; --no-sandbox is the only escape hatch."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_velites_sandbox.py::test_sandbox_unavailable_fails_closed
        gate: quick
