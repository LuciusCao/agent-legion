  - id: EXEC-CODE-002
    statement: "Workflow node code lives only in the DB (versioned_entities, entity_type 'node_code'), takes effect exclusively through the publish flow (draft → published → archived), versions are immutable, and no runtime path may write repo workflow_nodes/ files. All active node code is workspace-scoped; legacy global (workspace-NULL) rows are migration input and historical replay data only. Since #115 ordinary jobs no longer freeze the code version they started with: dispatch resolves only the workspace's currently published code, so a republish takes effect on the next node execution of an in-flight job — same for Agent definitions, which ordinary jobs never pinned (dispatch always resolved the workspace's currently published definition). The intake batch's node_code_versions and the revision snapshot's node_code_pins survive as audit records and as the pin source for quality replays: only a batch carrying the quality_replay marker dispatches its frozen pin (snapshot pins first, batch pins as the legacy fallback), failing closed on hash drift; historical replays may resolve an archived legacy-global pin by exact version and hash. A capability with no published workspace code fails the node with a config error. The feature is gated by workflows.custom_nodes_enabled."
