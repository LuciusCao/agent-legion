invariants:
  - id: API-CONTRACT-001
    statement: Generated frontend API types remain in sync with the backend OpenAPI schema.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/generate-api-types.sh
        gate: quick

  - id: BOUNDARY-LAYER-001
    statement: Architecture contract checks enforce layer boundaries between routes, services, and pipeline phases, and configuration file ownership is enforced by the split-layout architecture check.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_configuration.py
        gate: quick

  - id: SECURITY-PATH-001
    statement: Video and job filesystem operations stay inside managed roots and reject symlink escapes.
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_storage_paths.py
        gate: quick
      - kind: integration
        target: tests/full/test_storage_path_corruption.py
        gate: full

  - id: DB-MUTATION-001
    statement: "Job deletion rollback is conflict-safe: it restores only when the destination is absent, uses atomic same-filesystem rename, and preserves the staged recovery path when a concurrent recreation exists."
    owner: jobs
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_job_deletion_service.py
        gate: quick
      - kind: integration
        target: tests/full/test_job_deletion_races.py
        gate: full

  - id: EXEC-STATE-001
    statement: "Continue/resume operations for workspace jobs reject terminal states (completed, failed, cancelled) and only transition explicitly paused jobs, validating state inside the same transaction."
    owner: jobs
    risk: high
    evidence:
      - kind: integration
        target: tests/test_workspace_job_control_flow.py
        gate: quick
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick

  - id: BOUNDARY-READ-001
    statement: "Video detail GET is read-only; cache persistence occurs only on explicit write/event paths such as producing-phase completion or an explicit cache refresh."
    owner: video-hive
    risk: high
    evidence:
      - kind: integration
        target: tests/test_video_read_service.py
        gate: quick

  - id: EXEC-STATS-001
    statement: "Workspace runtime stats derive from executor allocations, bindings, active leases, and configured capacities without consulting AgentStatusManager."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/test_workspace_configuration_service.py::test_executor_stats_report_configured_capacity_and_leases
        gate: quick
      - kind: integration
        target: tests/test_workspace_configuration_service.py::test_executor_stats_does_not_consult_agent_status_manager
        gate: quick
      - kind: integration
        target: tests/routes/jobs/test_workspace_stats.py::test_workspace_stats_executor_status_reflects_allocations_and_leases
        gate: quick

  - id: DB-LIFECYCLE-001
    statement: "PostgreSQL connections are bounded by a shared pool and deterministically returned after each transaction."
    owner: database
    risk: high
    evidence:
      - kind: integration
        target: tests/db/test_postgres_runtime.py
        gate: quick

  - id: EXEC-CAPACITY-001
    statement: "Executor global capacity is shared across workspaces and never exceeded."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_workflow_worker_concurrency.py::test_global_capacity_enforced_by_lease_transaction
        gate: quick
      - kind: integration
        target: tests/full/test_executor_worker_fairness.py::test_shared_capacity_and_bounded_fairness
        gate: full

  - id: EXEC-FAIRNESS-001
    statement: "Runnable workspaces receive bounded scheduling opportunity under contention."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_workflow_worker_concurrency.py::test_round_robin_allows_small_workspace_to_claim
        gate: quick
      - kind: integration
        target: tests/full/test_executor_worker_fairness.py::test_shared_capacity_and_bounded_fairness
        gate: full
      - kind: failure_injection
        target: tests/ci/test_executor_worker_stress.py::test_fairness_under_randomized_insertion_order
        gate: ci_extended

  - id: EXEC-CANCEL-001
    statement: "Adapter-specific cancellation terminates active Pi/OpenClaw subprocess groups and isolated local handlers within a bounded grace period; worker shutdown waits only the grace period and releases capacity after child exit."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/test_executor_cancellation.py
        gate: quick
      - kind: integration
        target: tests/full/test_executor_cancellation_recovery.py
        gate: full

  - id: RECOVERY-MIGRATION-001
    statement: "PostgreSQL schema initialization is transactional, advisory-locked, and idempotent."
    owner: database
    risk: critical
    evidence:
      - kind: integration
        target: tests/db/test_postgres_runtime.py::test_schema_initialization_is_idempotent
        gate: quick
      - kind: integration
        target: tests/full/test_postgres_agent_concurrency.py
        gate: full

  - id: RECOVERY-BACKUP-001
    statement: "The offline SQLite importer refuses populated targets and preserves source IDs in PostgreSQL."
    owner: database
    risk: critical
    evidence:
      - kind: integration
        target: tests/db/test_sqlite_import.py
        gate: quick
      - kind: integration
        target: tests/full/test_sqlite_import_recovery.py
        gate: full

  - id: CONFIG-STARTUP-001
    statement: "Secrets use environment overrides, enabled runtime dependencies fail validation at startup, and the split configuration layout is detected, validated for owned keys, and composed before settings are built."
    owner: config
    risk: high
    evidence:
      - kind: integration
        target: tests/test_settings.py
        gate: quick
      - kind: integration
        target: tests/test_startup_validation.py
        gate: quick
      - kind: integration
        target: tests/test_configuration_loader.py
        gate: quick
      - kind: integration
        target: tests/full/test_split_config_startup.py
        gate: full

  - id: EXEC-EVENT-001
    statement: |
      Workspace job lifecycle SSE events are broadcast to JobEventManager only
      after the underlying PostgreSQL transaction has been committed. Broadcasting
      inside a transaction is forbidden because clients may react by querying
      the database and seeing pre-transaction state.
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/test_job_events.py
        gate: quick
      - kind: integration
        target: tests/full/test_workspace_sse.py
        gate: full

  - id: CONFIG-ARCH-001
    statement: |
      Source file line budgets are governed by a closed-world ceiling model.
      Every governed production file has a ceiling no more than ten lines above
      its current size. New, removed, or unclassified files, stale ceilings, test
      files over 1000 lines, and growth above the ceiling fail the quick gate.
      Budget exemptions freeze an explicit ceiling and must include a tracked
      removal condition; affected modules must be split rather than indefinitely
      exempted.
    owner: architecture
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_file_budgets.py
        gate: quick
      - kind: contract
        target: tests/test_ratchet_architecture_budgets.py
        gate: quick

  - id: BOUNDARY-VIDEO-001
    statement: "video_capabilities modules must not import orchestration or runtime modules such as server.app.db, server.app.jobs, server.app.routes, server.app.worker, or server.app.worker_thread."
    owner: video-hive
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_video_legacy.py
        gate: quick

  - id: BOUNDARY-VIDEO-002
    statement: "Production app and router code must not reintroduce legacy Video Hive route modules (e.g., server.app.routes.videos) after migration; Workspace job routes must be used instead."
    owner: video-hive
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_video_legacy.py
        gate: quick

  - id: BOUNDARY-VIDEO-003
    statement: "New Workspace code must not import server.app.pipeline.phases or legacy phase executor modules; workflow capabilities must be used instead."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: contract
        target: scripts/check_architecture.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_phase6.py
        gate: quick
      - kind: contract
        target: tests/test_architecture_video_legacy.py
        gate: quick

  - id: DB-STATE-001
    statement: "Runtime queues and job event sequence numbers are persisted in PostgreSQL; introducing new in-process authoritative runtime state is forbidden."
    owner: database
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_remote_broker_persistence.py
        gate: quick
      - kind: integration
        target: tests/test_job_event_buffer_db.py
        gate: quick
      - kind: contract
        target: tests/ci/test_postgres_only_runtime.py
        gate: ci_extended

  - id: EXEC-REMOTE-001
    statement: "Remote execution completion must be driven by broker completion callbacks; blocking a local thread waiting for a remote result (e.g. wait_result polling) is forbidden on the executor path."
    owner: workspace-executor
    risk: critical
    evidence:
      - kind: integration
        target: tests/executors/test_remote_nonblocking.py::test_execute_returns_immediately_without_waiting
        gate: quick
      - kind: integration
        target: tests/executors/test_remote_nonblocking.py::test_completion_callback_finishes_lease_and_backfills
        gate: quick
      - kind: contract
        target: tests/test_architecture_execution_decoupling.py
        gate: quick
      - kind: integration
        target: tests/full/test_remote_completion_e2e.py
        gate: full

  - id: EXEC-KIND-001
    statement: "Executor kinds must resolve through the kinds registry (register_kind/build_executor); isinstance dispatch chains over executor config types are forbidden in registry.py."
    owner: workspace-executor
    risk: high
    evidence:
      - kind: integration
        target: tests/executors/test_executor_kind_registration.py::test_unknown_kind_rejected_at_config_load
        gate: quick
      - kind: contract
        target: tests/test_architecture_execution_decoupling.py
        gate: quick

  - id: SECURITY-WORKER-001
    statement: "Remote worker credentials must be per-worker and revocable: per-worker tokens are persisted only as sha256 hashes of the secret part, revocation takes effect immediately (and beats the static-token fallback window), and management endpoints accept only the global management token. New shared-credential paths on worker-facing endpoints are forbidden."
    owner: security
    risk: critical
    evidence:
      - kind: integration
        target: tests/remote/test_worker_tokens.py
        gate: quick
      - kind: integration
        target: tests/full/test_worker_token_security.py
        gate: full

  - id: EXEC-SHARD-001
    statement: "Shard executions must go through ExecutorLeaseRepository.try_claim with one lease per shard; fan-out paths that bypass the capacity system are forbidden."
    owner: architecture
    risk: critical
    evidence:
      - kind: integration
        target: tests/workflows/test_sharding.py
        gate: quick
      - kind: integration
        target: tests/full/test_shard_fanout_e2e.py
        gate: full
