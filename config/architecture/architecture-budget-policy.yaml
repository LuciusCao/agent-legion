version: 1
production:
  roots:
    - path: server/app
      extensions: [.py]
    - path: frontend/src
      extensions: [.ts, .tsx, .css]
    - path: scripts
      extensions: [.py]
    - path: worker
      extensions: [.py]
    # #293：worker 控制台是原生 JS/CSS 单文件面（无构建链，拆分受限于零依赖
    # 部署形态），与 worker 的 Python 同受预算治理；绝对上限放宽到 1000 防
    # 单文件失控，ceiling 按有效行数单调棘轮；vendor/ 第三方最小化产物不属
    # 于我们维护的源码，排除。
    - path: worker/ui
      extensions: [.js, .css]
      max_lines: 1000
    - path: shared
      extensions: [.py]
    - path: workspace_libs
      extensions: [.py]
    # #202：velites 主 crate 纳入预算治理（tests/ 集成测试不纳入——Rust 内联
    # #[cfg(test)] 单测与实现同居是其惯例，不套 Python 的测试目录模型）。
    - path: velites/src
      extensions: [.rs]
    # #293：postgres_schema.sql（全量 replay schema）纳入治理。单文件是刻意设计
    # （幂等 replay 是迁移架构的地基），但登记绝对上限防无意识膨胀：ceiling 按
    # 有效行数（-- 注释行排除）单调棘轮，max_lines 覆盖到 1200 raw 行。
    - path: server/app/db
      extensions: [.sql]
      max_lines: 1200
  exclude:
    - frontend/src/generated/**
    - worker/ui/vendor/**
  buffer_lines: 10
  # #641 增长容忍带：有效行可超过注册表 ceiling 15 行而不报错，超出部分
  # 永不被 ratchet 吸收（与 buffer 的本质区别：buffer 是每次 ratchet 以
  # actual+buffer 重新灌满的可再生余量；allowance 是相对冻结天花板的一次
  # 性额度，文件收缩后由 staleness 检查自动回收）。#209 baseline 只降不升
  # 不变；prettier 80 列重排（实测 +5）与小型功能增长（#633 那次 +11）预期
  # 落在带内。豁免重签超过 floor+15 须带 expires（到期硬失败）。
  growth_allowance: 15
  max_lines: 800
tests:
  roots:
    - path: tests
      patterns: ["**/*.py"]
    - path: frontend/src
      patterns: ["**/*.test.ts", "**/*.test.tsx"]
  max_lines: 1000
