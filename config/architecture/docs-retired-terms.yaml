# 现行文档禁用的退役术语表（docs_retired_terms 检查的数据文件）。
#
# 维护纪律（AGENTS.md §5 / docs/architecture/docs-governance-proposal.md §4）：
# - 概念退役 PR 必须同步追加条目并清零现行文档命中。
# - pattern 只增不删；确需删除（概念复活）须在注释里记录 issue 依据。
# - 误伤走 exemptions（带 remove_when），不许删 pattern。
# - pattern 必须瞄准概念性表述，禁止匹配活代码路径（executors/ 包、
#   worker/executor.py 是活代码；"executor" 单词本身不可入表）。
#
# 命中行的上下文（前后各 1 行）含退役表述词（已退役/不再/retired/…）
# 视为合法历史引用，放行。

terms:
  - pattern: 'server/app/pipeline'
    retired_in: '5dac451b (legacy video-hive dead code retirement)'
    note: 视频流水线模块已删除；非 agent 节点是 workflow code nodes
  - pattern: '\bpipeline nodes?\b'
    retired_in: '5dac451b / #360 文档 review'
    note: 促成本检查的实际漂移表述（总览图曾写 pipeline nodes）；
      现行说法是 workflow code nodes
  - pattern: '\bexternal skills?\b'
    retired_in: '#322'
    note: skill 是 skill root 下的本地 in-place git 仓库；写 skills (local in-place git)
  - pattern: '外部 skill'
    retired_in: '#322 / #360 文档 review'
    note: 中文语境的同类漂移表述（README 曾写「外部 skill 仓库 +
      锁定 commit」）；skill 是 skill root 下的本地仓库
  - pattern: '\bexecutor (definition|binding|allocation)s?\b'
    retired_in: 'schema v47 (#284)'
    note: executor 概念退役；executors/ 包与 worker/executor.py 模块名合法保留
  - pattern: '\bopenclaw\b'
    retired_in: '#75'
    note: openclaw runtime 整体退役；agent runtime 只剩 pi / velites
  - pattern: 'config/(app|workflow|agent_legion)\.yaml'
    retired_in: 'split yaml 退役'
    note: 文件存在即启动报错；有效配置 = 代码默认值 + env 覆盖 + DB 实例设置
  - pattern: 'config/skills\.(yaml|lock)'
    retired_in: '#322'
    note: skill pin 锁在 DB global_settings 的 skill_lock 文档
  - pattern: 'agent-worker\.example\.yaml'
    retired_in: '#323'
    note: worker 唯一生效配置是状态副本 data/agent-worker-service/worker.yaml
  - pattern: 'AGENT_LEGION_WORKER_REGISTER_TOKEN'
    retired_in: '#35'
    note: 全局 register token 退役，改 workspace-scoped token
  - pattern: 'workflows\.enabled'
    retired_in: '#385/#389'
    note: 灰度开关退役；部署形态由 code_capacity 表达（0 = 纯控制面），
      存量 DB 文档读时键级剥离
  - pattern: '\.velites/config\.json 作为配置入口'
    retired_in: '#602（deprecation 阶段，下一版本周期移除）'
    note: config.json 是仅供直调 CLI 的迁移桥，结构上进不了 Worker 模型
      发现；配置入口是 ~/.velites/models.json。迁移历史上下文（velites-
      model-registry.md 的 0.1.x 迁移节与 deprecation 公告）豁免
  - pattern: 'upstream chain'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: inherit 判定的上游一致性不再由 per-node 哈希链间接证明；现行
      说法是变更种子集 + 下游传播闭包（严格传播）
  - pattern: '上游集哈希'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: 中文语境的同义表述；旧实现的「对上游 (key, hash) 列表整体取
      摘要」已删除，上游维度由闭包直接定义
  - pattern: '上游哈希链'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: 「上游哈希链式传播」的简称变体，同 upstream chain

exemptions: []
