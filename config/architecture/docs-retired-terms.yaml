# 现行文档禁用的退役术语表（docs_retired_terms 检查的数据文件）。
#
# 维护纪律（AGENTS.md §5 / docs/architecture/docs-governance.md §3）：
# - 概念退役 PR 必须同步追加条目并清零现行文档命中。
# - pattern 只增不删；确需删除（概念复活）须在注释里记录 issue 依据。
# - 误伤走 exemptions（带 remove_when），不许删 pattern。
# - pattern 必须瞄准概念性表述，禁止匹配活代码路径（executors/ 包、
#   worker/executor.py 是活代码；"executor" 单词本身不可入表）。
#
# 命中行的上下文（前后各 1 行）含退役表述词（已退役/不再/retired/…）
# 视为合法历史引用，放行。

terms:
  - pattern: 'server/app/pipeline'
    retired_in: '5dac451b (legacy video-hive dead code retirement)'
    note: 视频流水线模块已删除；非 agent 节点是 workflow code nodes
  - pattern: '\bpipeline nodes?\b'
    retired_in: '5dac451b / #360 文档 review'
    note: 促成本检查的实际漂移表述（总览图曾写 pipeline nodes）；
      现行说法是 workflow code nodes
  - pattern: '\bexternal skills?\b'
    retired_in: '#322'
    note: skill 是 skill root 下的本地 in-place git 仓库；写 skills (local in-place git)
  - pattern: '外部 skill'
    retired_in: '#322 / #360 文档 review'
    note: 中文语境的同类漂移表述（README 曾写「外部 skill 仓库 +
      锁定 commit」）；skill 是 skill root 下的本地仓库
  - pattern: '\bexecutor (definition|binding|allocation)s?\b'
    retired_in: 'schema v47 (#284)'
    note: executor 概念退役；executors/ 包与 worker/executor.py 模块名合法保留
  - pattern: '\bopenclaw\b'
    retired_in: '#75'
    note: openclaw runtime 整体退役；agent runtime 只剩 pi / velites
  - pattern: 'config/(app|workflow|agent_legion)\.yaml'
    retired_in: 'split yaml 退役'
    note: 文件存在即启动报错；有效配置 = 代码默认值 + env 覆盖 + DB 实例设置
  - pattern: 'config/skills\.(yaml|lock)'
    retired_in: '#322'
    note: skill pin 锁在 DB global_settings 的 skill_lock 文档
  - pattern: 'agent-worker\.example\.yaml'
    retired_in: '#323'
    note: worker 唯一生效配置是状态副本 data/agent-worker-service/worker.yaml
  - pattern: 'AGENT_LEGION_WORKER_REGISTER_TOKEN'
    retired_in: '#35'
    note: 全局 register token 退役，改 workspace-scoped token
  - pattern: 'workflows\.enabled'
    retired_in: '#385/#389'
    note: 灰度开关退役；部署形态由 code_capacity 表达（0 = 纯控制面），
      存量 DB 文档读时键级剥离
  - pattern: '\.velites/config\.json 作为配置入口'
    retired_in: '#602（deprecation 阶段，下一版本周期移除）'
    note: config.json 是仅供直调 CLI 的迁移桥，结构上进不了 Worker 模型
      发现；配置入口是 ~/.velites/models.json。迁移历史上下文（velites-
      model-registry.md 的 0.1.x 迁移节与 deprecation 公告）豁免
  - pattern: 'upstream chain'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: inherit 判定的上游一致性不再由 per-node 哈希链间接证明；现行
      说法是变更种子集 + 下游传播闭包（严格传播）
  - pattern: '上游集哈希'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: 中文语境的同义表述；旧实现的「对上游 (key, hash) 列表整体取
      摘要」已删除，上游维度由闭包直接定义
  - pattern: '上游哈希链'
    retired_in: '#645/#702（inherit 传播闭包重构）'
    note: 「上游哈希链式传播」的简称变体，同 upstream chain
  - pattern: '折叠小条'
    retired_in: '#795 收尾（Dock 三态收敛开/关两态）'
    note: AgentPanelDock 的右下角折叠 chip 已移除；有唤起按钮后开关经各
      surface 入口，Esc = 关闭。锚定 Dock 语境，不误伤 DAG 节点/消息等
      无关折叠语义
  - pattern: '已折叠，点击展开'
    retired_in: '#795 收尾（Dock 三态收敛开/关两态）'
    note: 折叠 chip 的按钮文案字面量；Dock 面板开/关两态后不再存在
  - pattern: '\blegacy validators?\b'
    retired_in: '#834（术语收敛，纯改名零行为变化）'
    note: scripts/validate_output.py 是 Host 两层输出校验的业务规则层（#443），
      承载契约引擎刻意不表达的跨文件/事实回引规则，不是待淘汰旧物；现行说法
      是 business-rule validator / 业务规则层
  - pattern: 'validate_output\.py`*,? (stays |is |as |remains )?(?:(?:the|an?)\s+)?(Host-side )?legacy'
    retired_in: '#834（术语收敛）'
    note: 同上，「validate_output.py 为 legacy fallback」类表述；锚定脚本名，
      不误伤 legacy manifest / AgentDefinition.skill legacy fallback 等无关概念
  - pattern: 'legacy (脚本|回落通道)'
    retired_in: '#834（术语收敛）'
    note: 中文语境的同类表述；现行说法是业务规则层 / 业务规则脚本
  - pattern: '`capabilities:?`\s*(键|key|config key)'
    retired_in: '#452（worker.yaml capabilities 兼容键移除；机制自 #284 起即 no-op）'
    note: Worker 配置不再有 capabilities 键（存量残留读取即剥离并告警）；锚定
      「键/key」表述，不误伤 Host 注册契约的 capabilities 字段与节点 capability
  - pattern: '\bdefault_workflow_key\b'
    retired_in: '#211 M3（schema v91 删列；契约字段同批移除）'
    note: workspace id 即 workflow key（schema v62 绑定），独立的 key 列与
      WorkspaceRecord 字段已删除；现行说法是 workspace id
  - pattern: 'workflows/\{workflow_key\}'
    retired_in: '#211 M3（deprecated URL 别名移除）'
    note: 节点代码路由只挂 /workspaces/{workspace_id}/nodes/{node_key}/code*
      （studio-agent 工具同形），旧 workflows/{workflow_key} 段别名已删除
  - pattern: 'reject_mismatched_workflow_key'
    retired_in: '#211 M3（deprecated 请求字段移除后守卫一并删除）'
    note: 请求体/查询参数不再携带 workflow_key，key 不匹配守卫无对象可守
  - pattern: 'Agent 管理'
    retired_in: '#935（#440 P3 Agent 定义退役：门禁翻转、写面 deprecated）'
    note: Agent 定义不再充当节点执行档案，执行配置写在 agent 节点上（执行档案，
      EXEC-AGENT-PROFILE-001）；设置页目录在 P3b 改为只读「历史 Agent 定义」
  - pattern: '(必须恰好解析到一个|resolve to exactly one) published Agent'
    retired_in: '#935（#440 P3 门禁翻转）'
    note: 发布门禁要求 agent 节点自含 execution.runtime，不再按 capability 解析
      published Agent；legacy 解析只服务 v93 内联前冻结的旧快照，以及 active
      revision 中 v93 未能内联的节点（新 job 仍按 capability 解析，直到节点补
      runtime 并发布新 revision）
  - pattern: 'agent_version_pins'
    retired_in: '#1079（#440 P3b，D6：quality replay pin 改按 revision）'
    note: 回放的执行档案按 workflow revision（或当前草稿）选，副本 run 冻结
      node_profiles pin {revision_id, node_key, profile_hash}（EXEC-QUALITY-REPLAY-001）；
      旧 agent_versions pin 只读兼容存量 run，不再为新回放写入

exemptions: []
