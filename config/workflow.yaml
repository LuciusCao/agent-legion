executors:
  local-default:
    kind: local
    global_capacity: 128
    capabilities:
      fetch_questions:
        handler: question_comprehension_info.fetch_questions
      clean_and_parse:
        handler: question_comprehension_info.clean_and_parse
      classify_comprehension_eligibility:
        handler: question_comprehension_info.classify_comprehension_eligibility
      finalize_non_uploadable:
        handler: question_comprehension_info.finalize_non_uploadable
      assemble_comprehension_info:
        handler: question_comprehension_info.assemble_comprehension_info
      download_video:
        handler: video_knowledge.download_video
      transcribe_video:
        handler: video_knowledge.transcribe_video
      assemble_video_metadata:
        handler: video_knowledge.assemble_video_metadata
      package_video_job:
        handler: video_knowledge.package_video_job
  pi:
    kind: pi
    global_capacity: 128
    capabilities:
      generate_key_info:
        skill: question_comprehension_info/generate_key_info
        tools:
        - read
        - write
        - bash
      review_key_info:
        skill: question_comprehension_info/review_key_info
        tools:
        - read
        - write
        - bash
      generate_possible_errors:
        skill: question_comprehension_info/generate_possible_errors
        tools:
        - read
        - write
        - bash
      review_possible_errors:
        skill: question_comprehension_info/review_possible_errors
        tools:
        - read
        - write
        - bash
      assess_comprehension_difficulty:
        skill: question_comprehension_info/assess_comprehension_difficulty
        tools:
        - read
        - write
        - bash
      review_subtitles:
        skill: video_knowledge/review_subtitles
        tools:
        - read
        - write
        - bash
      generate_chapters:
        skill: video_knowledge/generate_chapters
        tools:
        - read
        - write
        - bash
      generate_interactions:
        skill: video_knowledge/generate_interactions
        tools:
        - read
        - write
        - bash
      review_video_content:
        skill: video_knowledge/review_video_content
        tools:
        - read
        - write
        - bash
  # Remote executors may constrain which workers a capability is routed to via
  # `requires_labels` (worker labels arrive at register/claim time). Values are
  # either ">=<int>" (numeric) or a literal (exact match); all must hold:
  #   remote-gpu:
  #     kind: remote
  #     global_capacity: 4
  #     capabilities:
  #       transcribe_video:
  #         skill: video_knowledge/transcribe_video
  #         requires_labels:
  #           mem_gb: ">=16"
  #           device: mac-mini
heartbeat_interval_seconds: 10
lease_ttl_seconds: 90
heartbeat_failure_threshold: 3
workflows:
  enabled: true
  pi:
    binary: pi
    provider: deepseek
    model: your-model-b
    thinking: low
    timeout_seconds: 900
    environment:
      PI_SKIP_VERSION_CHECK: '1'
      PI_TELEMETRY: '0'
