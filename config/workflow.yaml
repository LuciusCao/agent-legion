    runtime: velites
    skill: question_comprehension_info/generate_key_info
    tools: [read, write, bash]
  question-key-info-review-v1:
    capability: review_key_info
    runtime: velites
    skill: question_comprehension_info/review_key_info
    tools: [read, write, bash]
  question-possible-errors-v1:
    capability: generate_possible_errors
    runtime: velites
    skill: question_comprehension_info/generate_possible_errors
    tools: [read, write, bash]
  question-possible-errors-review-v1:
    capability: review_possible_errors
    runtime: velites
    skill: question_comprehension_info/review_possible_errors
    tools: [read, write, bash]
  question-difficulty-v1:
    capability: assess_comprehension_difficulty
    runtime: velites
    skill: question_comprehension_info/assess_comprehension_difficulty
    tools: [read, write, bash]
  video-subtitle-review-v1:
    capability: review_subtitles
    runtime: pi
    skill: video_knowledge/review_subtitles
    tools: [read, write, bash]
  video-chapter-generation-v1:
    capability: generate_chapters
    runtime: pi
    skill: video_knowledge/generate_chapters
    tools: [read, write, bash]
  video-interaction-generation-v1:
    capability: generate_interactions
    runtime: pi
    skill: video_knowledge/generate_interactions
    tools: [read, write, bash]
  video-content-review-v1:
    capability: review_video_content
    runtime: pi
    skill: video_knowledge/review_video_content
    tools: [read, write, bash]
agent_workers:
  register_token: ""
  register_token_file: "deploy/secrets/agent_worker_register_token"
  max_archive_bytes: 67108864
  min_protocol_version: 1
executors:
  code-default:
    kind: code
    global_capacity: 16
    capabilities:
      fetch_questions:
        path: workflow_nodes/question_intake.py
        # Custom forks call the CMS: allow network inside the sandbox (EXEC-CODE-003).
        sandbox_network: true
        # CMS connection for this node: non-secret selectors plus the
        # vault-backed token (secret: true). Values resolve along schema
        # defaults → node config → workspace override and win over the global
        # cms: defaults; the token is stored Fernet-encrypted in the
        # workspace vault and injected in memory at dispatch (VAULT-SECRET-001).
        config_schema:
          type: object
          properties:
            base_url:
              type: string
              description: CMS 服务根地址（覆盖全局 cms.base_url，用于派生各端点 URL）
            api_url:
              type: string
              description: 题目详情端点完整 URL（优先于 base_url 派生）
            question_list_url:
              type: string
              description: 知识点题目列表端点完整 URL（优先于 base_url 派生）
            token:
              type: string
              secret: true
              description: CMS 访问 token（存入 workspace vault，只写不读）
            bank_version:
              type: string
              description: CMS 题库版本（覆盖全局 cms 默认值）
            country_id:
              type: string
              description: CMS 国家/地区 ID（覆盖全局 cms 默认值）
            subject_id:
              type: string
              description: CMS 学科 ID（覆盖全局 cms 默认值）
            page_size:
              type: integer
              minimum: 1
              maximum: 500
              description: 知识点题目列表分页大小（覆盖全局 cms 默认值）
      download_video:
        path: workflow_nodes/video_download.py
        # Custom forks call the CMS / video source: allow network in the sandbox.
        sandbox_network: true
        # CMS connection for resolving knowledge codes at execution time;
        # same vault-backed token semantics as fetch_questions.
        config_schema:
          type: object
          properties:
            base_url:
              type: string
              description: CMS 服务根地址（覆盖全局 cms.base_url，用于派生端点 URL）
            api_url:
              type: string
              description: 知识点详情端点完整 URL（优先于 base_url 派生）
            token:
              type: string
              secret: true
              description: CMS 访问 token（存入 workspace vault，只写不读）
            bank_version:
              type: string
              description: CMS 题库版本（覆盖全局 cms 默认值）
            country_id:
              type: string
              description: CMS 国家/地区 ID（覆盖全局 cms 默认值）
            subject_id:
              type: string
              description: CMS 学科 ID（覆盖全局 cms 默认值）
      clean_and_parse:
        path: workflow_nodes/question_clean_parse.py
      classify_comprehension_eligibility:
        path: workflow_nodes/comprehension_classify.py
      finalize_non_uploadable:
        path: workflow_nodes/comprehension_finalize.py
      assemble_comprehension_info:
        path: workflow_nodes/comprehension_assemble.py
      transcribe_video:
        path: workflow_nodes/video_transcribe.py
        # ASR providers are remote APIs: allow network in the sandbox.
        sandbox_network: true
      assemble_video_metadata:
        path: workflow_nodes/video_assemble.py
      package_video_job:
        path: workflow_nodes/video_package.py
heartbeat_interval_seconds: 10
lease_ttl_seconds: 90
heartbeat_failure_threshold: 3
workflows:
  enabled: true
  pi:
    # `runtime: pi` agent 的遗留实现选择层：pi（Node Pi CLI）| velites（自研 Rust
    # harness，见 docs/architecture/velites-harness.md §9）。仅作用于 runtime: pi
    # 的 agent；runtime: velites 由定义钉死、忽略本项。生产默认 velites；非法值
    # 启动即报错（fail-fast）。新增 agent 应直接声明 runtime，勿依赖本开关。
    # 切到 velites 时 binary 未显式覆盖则自动用 velites 二进制；`flavor: pi` 单字段即回退。
    flavor: velites
    # velites 逃生门：true 时 velites 命令追加 --no-sandbox（生产沙箱异常时
    # 免发版降级为无沙箱运行，仍保留事件契约/预算/取消等全部可控性）。
    velites_no_sandbox: false
    binary: pi
    provider: gateway
    # 默认 model 必须为空：占位符（如历史上的 your-model）会在 intake 冻结进
    # manifest，导致请求永远无法被任何 worker claim 并堵死队首（issue #13）。
    # broker 在 enqueue 时拒绝空/占位符 model，节点必须经节点或 Agent revision
    # 的 execution.model 显式声明。
    model: ""
    thinking: low
    timeout_seconds: 1800
    environment:
      PI_SKIP_VERSION_CHECK: '1'
      PI_TELEMETRY: '0'
