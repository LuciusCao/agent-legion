executors:
  code-default:
    kind: code
    global_capacity: 16
    capabilities:
      fetch_questions:
        path: workflow_nodes/question_intake.py
        # Custom forks call the CMS: allow network inside the sandbox (EXEC-CODE-003).
        sandbox_network: true
        # CMS connection for this node: non-secret selectors plus the
        # vault-backed token (secret: true). Values resolve along schema
        # defaults → node config → workspace override; the schema defaults
        # are the product factory values (the global yaml cms: section was
        # retired), and base_url comes from node/workspace config or env
        # CMS_BASE_URL. The token is stored Fernet-encrypted in the
        # workspace vault and injected in memory at dispatch (VAULT-SECRET-001).
        config_schema:
          type: object
          properties:
            base_url:
              type: string
              description: CMS 服务根地址（用于派生各端点 URL；缺省由 env CMS_BASE_URL 提供）
            api_url:
              type: string
              description: 题目详情端点完整 URL（优先于 base_url 派生）
            question_list_url:
              type: string
              description: 知识点题目列表端点完整 URL（优先于 base_url 派生）
            token:
              type: string
              secret: true
              description: CMS 访问 token（存入 workspace vault，只写不读）
            env:
              type: string
              default: prod
              description: CMS 环境标识（prod 时启用服务端 token 生成）
            bank_version:
              type: string
              default: v5
              description: CMS 题库版本（出厂默认值，可被节点/workspace 覆盖）
            country_id:
              type: string
              default: '1'
              description: CMS 国家/地区 ID（出厂默认值，可被节点/workspace 覆盖）
            subject_id:
              type: string
              default: '2'
              description: CMS 学科 ID（出厂默认值，可被节点/workspace 覆盖）
            page_size:
              type: integer
              default: 50
              minimum: 1
              maximum: 500
              description: 知识点题目列表分页大小（出厂默认值，可被节点/workspace 覆盖）
      download_video:
        path: workflow_nodes/video_download.py
        # Custom forks call the CMS / video source: allow network in the sandbox.
        sandbox_network: true
        # CMS connection for resolving knowledge codes at execution time;
        # same vault-backed token semantics and factory defaults as
        # fetch_questions (page_size is not used by this node).
        config_schema:
          type: object
          properties:
            base_url:
              type: string
              description: CMS 服务根地址（用于派生端点 URL；缺省由 env CMS_BASE_URL 提供）
            api_url:
              type: string
              description: 知识点详情端点完整 URL（优先于 base_url 派生）
            token:
              type: string
              secret: true
              description: CMS 访问 token（存入 workspace vault，只写不读）
            env:
              type: string
              default: prod
              description: CMS 环境标识（prod 时启用服务端 token 生成）
            bank_version:
              type: string
              default: v5
              description: CMS 题库版本（出厂默认值，可被节点/workspace 覆盖）
            country_id:
              type: string
              default: '1'
              description: CMS 国家/地区 ID（出厂默认值，可被节点/workspace 覆盖）
            subject_id:
              type: string
              default: '2'
              description: CMS 学科 ID（出厂默认值，可被节点/workspace 覆盖）
      clean_and_parse:
        path: workflow_nodes/question_clean_parse.py
      classify_comprehension_eligibility:
        path: workflow_nodes/comprehension_classify.py
      finalize_non_uploadable:
        path: workflow_nodes/comprehension_finalize.py
      assemble_comprehension_info:
        path: workflow_nodes/comprehension_assemble.py
      transcribe_video:
        path: workflow_nodes/video_transcribe.py
        # ASR providers are remote APIs: allow network in the sandbox.
        sandbox_network: true
      assemble_video_metadata:
        path: workflow_nodes/video_assemble.py
      package_video_job:
        path: workflow_nodes/video_package.py
