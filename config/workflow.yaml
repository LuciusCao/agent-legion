agents:
  question-key-info-v1:
    capability: generate_key_info
    runtime: pi
    skill: question_comprehension_info/generate_key_info
    tools: [read, write, bash]
  question-key-info-review-v1:
    capability: review_key_info
    runtime: pi
    skill: question_comprehension_info/review_key_info
    tools: [read, write, bash]
  question-possible-errors-v1:
    capability: generate_possible_errors
    runtime: pi
    skill: question_comprehension_info/generate_possible_errors
    tools: [read, write, bash]
  question-possible-errors-review-v1:
    capability: review_possible_errors
    runtime: pi
    skill: question_comprehension_info/review_possible_errors
    tools: [read, write, bash]
  question-difficulty-v1:
    capability: assess_comprehension_difficulty
    runtime: pi
    skill: question_comprehension_info/assess_comprehension_difficulty
    tools: [read, write, bash]
  video-subtitle-review-v1:
    capability: review_subtitles
    runtime: pi
    skill: video_knowledge/review_subtitles
    tools: [read, write, bash]
  video-chapter-generation-v1:
    capability: generate_chapters
    runtime: pi
    skill: video_knowledge/generate_chapters
    tools: [read, write, bash]
  video-interaction-generation-v1:
    capability: generate_interactions
    runtime: pi
    skill: video_knowledge/generate_interactions
    tools: [read, write, bash]
  video-content-review-v1:
    capability: review_video_content
    runtime: pi
    skill: video_knowledge/review_video_content
    tools: [read, write, bash]
agent_workers:
  register_token: ""
  register_token_file: "deploy/secrets/agent_worker_register_token"
  max_archive_bytes: 67108864
  min_protocol_version: 1
executors:
  local-default:
    kind: local
    global_capacity: 128
    # 每个 capability 可设 timeout_seconds（单次隔离执行的墙钟上限，超时判
    # failed/timeout 并强杀子进程）；缺省回退 executor 默认值 3600s。
    capabilities:
      fetch_questions:
        handler: question_comprehension_info.fetch_questions
        # Non-secret CMS query selectors the node may tune (spec D15). Values
        # resolve along node config → workspace override → intake freeze and
        # win over resource bindings / global cms defaults; the token stays in
        # the resource binding + vault chain (spec D16).
        config_schema:
          type: object
          properties:
            bank_version:
              type: string
              description: CMS 题库版本（覆盖 resource binding 与全局 cms 默认值）
            country_id:
              type: string
              description: CMS 国家/地区 ID（覆盖 resource binding 与全局 cms 默认值）
            subject_id:
              type: string
              description: CMS 学科 ID（覆盖 resource binding 与全局 cms 默认值）
      clean_and_parse:
        handler: question_comprehension_info.clean_and_parse
      classify_comprehension_eligibility:
        handler: question_comprehension_info.classify_comprehension_eligibility
      finalize_non_uploadable:
        handler: question_comprehension_info.finalize_non_uploadable
      assemble_comprehension_info:
        handler: question_comprehension_info.assemble_comprehension_info
      download_video:
        handler: video_knowledge.download_video
        # Non-secret CMS query selectors the node may tune (spec D15), used
        # when resolving knowledge codes against the CMS at execution time;
        # the token stays in the resource binding + vault chain (spec D16).
        config_schema:
          type: object
          properties:
            bank_version:
              type: string
              description: CMS 题库版本（覆盖 resource binding 与全局 cms 默认值）
            country_id:
              type: string
              description: CMS 国家/地区 ID（覆盖 resource binding 与全局 cms 默认值）
            subject_id:
              type: string
              description: CMS 学科 ID（覆盖 resource binding 与全局 cms 默认值）
      transcribe_video:
        handler: video_knowledge.transcribe_video
      assemble_video_metadata:
        handler: video_knowledge.assemble_video_metadata
      package_video_job:
        handler: video_knowledge.package_video_job
heartbeat_interval_seconds: 10
lease_ttl_seconds: 90
heartbeat_failure_threshold: 3
workflows:
  enabled: true
  pi:
    binary: pi
    provider: gateway
    model: your-model
    thinking: low
    timeout_seconds: 1800
    environment:
      PI_SKIP_VERSION_CHECK: '1'
      PI_TELEMETRY: '0'
