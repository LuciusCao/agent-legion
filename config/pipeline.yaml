data_dir: data
server:
  host: 127.0.0.1
  port: 8000
worker:
  # Local phases do not consume openclaw runners. Tune these based on disk,
  # network, and ASR capacity.
  phase_concurrency:
    download: 10
    transcribe: 1
    assemble: 10
    package: 10
    waiting_for_url: 10
asr:
  provider: auto
  timeout_seconds: 900
  whisper:
    binary: whisper-cli
    model: ~/.cache/whisper.cpp/ggml-medium.bin
    # VAD model path for voice activity detection (silero-v6.2.0)
    vad_model: ~/.cache/whisper.cpp/ggml-silero-v6.2.0.bin
  sensevoice:
    script: server/app/pipeline/transcribe_sensevoice.py
    model_dir: ~/.cache/SenseVoiceSmall
cms:
  # Set CMS token and token_gen secret via environment overrides; do not commit credentials.
  base_url: "https://cms.example.com/v2"
  env: prod
  bank_version: "v5"
  country_id: "1"
  subject_id: "2"
  page_size: "50"
  token: ""
  token_gen:
    app_id: ""
    nonce: ""
    secret: ""
    url: ""

resource_providers:
  cms.question.detail:
    path: "/question/detail"
  cms.question.list_by_knowledge:
    path: "/question/list"

# Optional: delete the local MP4 after the assemble phase completes to save disk space.
# Playback will fall back to source_url via redirect. Default is false.
cleanup_video_after_assemble: false

executors:
  local-default:
    kind: local
    global_capacity: 16
    capabilities:
      fetch_questions:
        handler: question_comprehension_info.fetch_questions
      clean_and_parse:
        handler: question_comprehension_info.clean_and_parse
      assemble_comprehension_info:
        handler: question_comprehension_info.assemble_comprehension_info
      fetch_question_context:
        handler: question_content.fetch_question_context
      assemble_package:
        handler: question_content.assemble_package
  pi-default:
    kind: pi
    global_capacity: 20
    capabilities:
      generate_key_info:
        skill: question_comprehension_info/generate_key_info
        tools: [read, write, bash]
      review_key_info:
        skill: question_comprehension_info/review_key_info
        tools: [read, write, bash]
      generate_possible_errors:
        skill: question_comprehension_info/generate_possible_errors
        tools: [read, write, bash]
      review_possible_errors:
        skill: question_comprehension_info/review_possible_errors
        tools: [read, write, bash]
      assess_comprehension_difficulty:
        skill: question_comprehension_info/assess_comprehension_difficulty
        tools: [read, write, bash]

pipelines:
  # Enables the new workspace/job DAG surface. This is independent from the
  # existing Video Hive video queue and keeps the old pipeline behavior intact.
  enabled: true
  pi:
    binary: pi
    provider: ""
    model: ""
    thinking: low
    timeout_seconds: 600
    environment:
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"

openclaw:
  cwd: .
  timeout_seconds: 600
  isolated_workspace_root: ""
  # 调用 openclaw agent 前，强制把指定技能目录 checkout 到干净的 ref/tag，
  # 防止 agent 自我修改技能或在技能里写入脏数据。
  skill_safety:
    enabled: true
    repos:
      - path: ~/.openclaw/workspace/skills/generate-interactions
        ref: v1.0.0
      - path: ~/.openclaw/workspace/skills/review-interactions
        ref: v1.0.0
      - path: ~/.openclaw/workspace/skills/review-subtitles
        ref: v1.0.0
      - path: ~/.openclaw/workspace/skills/slice-chapters
        ref: v1.0.0
  # 基础命令模板（如果包含 --agent，程序启动时会自动调用
  # "openclaw agents list --json" 动态发现可用 agent，并为每个 agent
  # 生成一个独立的 runner。如果模板不含 --agent，则只创建单个 runner）
  command_template:
    - openclaw
    - agent
    - --local
    - --agent
    - main
    - --session-id
    - "{video_id}-{timestamp}"
    - --thinking
    - "on"
    - --message
    - "{prompt_text}"
    - --json
  # 显式 runner 配置（可选，优先级高于动态发现）
  # count 字段支持复用同一个 command_template 创建多个 runner，
  # 实现基于同一个 agent 的高并发处理。
  runners:
    - command_template:
        - openclaw
        - agent
        - --local
        - --agent
        - main
        - --session-id
        - "{video_id}-{timestamp}"
        - --thinking
        - "on"
        - --message
        - "{prompt_text}"
        - --json
      count: 8
