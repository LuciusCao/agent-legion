data_dir: data
server:
  host: 127.0.0.1
  port: 8000
asr:
  provider: auto
  whisper:
    binary: /opt/homebrew/Cellar/whisper-cpp/1.8.4/bin/whisper-cli
    model: ~/.cache/whisper.cpp/ggml-medium.bin
  sensevoice:
    script: /Users/user/CatPuru/projects/cms-extensions/engineering/pipeline/scripts/transcribe_sensevoice.py
    model_dir: /Users/user/CatPuru/projects/cms-extensions/models/SenseVoiceSmall
cms:
  env: prod
  knowledge_url: "http://cms.internal.example.com/v2/knowledge/detail?bank_version=v5&country_id=1&subject_id=2"
  question_url: "http://cms.internal.example.com/v2/question/detail?bank_version=v5&country_id=1&subject_id=2"
  token: ""
  token_gen:
    app_id: ""
    nonce: ""
    secret: ""
    url: ""
openclaw:
  cwd: .
  timeout_seconds: 600
  # 基础命令模板（如果包含 --agent，程序启动时会自动调用
  # "openclaw agents list --json" 动态发现可用 agent，并为每个 agent
  # 生成一个独立的 runner。如果模板不含 --agent，则只创建单个 runner）
  command_template:
    - openclaw
    - agent
    - --local
    - --agent
    - main
    - --message
    - "{prompt_text}"
    - --json
  # 显式 runner 配置（可选，优先级高于动态发现）
  # runners:
  #   - command_template:
  #       - openclaw
  #       - agent
  #       - --local
  #       - --agent
  #       - main
  #       - --message
  #       - "{prompt_text}"
  #       - --json
