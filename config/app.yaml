data_dir: data
database:
  url: postgresql://127.0.0.1:5432/agent_legion
server:
  cors:
    allow_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allow_credentials: false

cleanup:
  log_retention_days: 7
  run_dir_retention_days: 3
  interval_seconds: 3600

monitoring:
  sample_interval_seconds: 60
  retention_days: 30

token_usage:
  currency: CNY
  pricing:
    - provider: gateway
      model: your-model-a
      input_per_1m: 3.0
      output_per_1m: 15.0
      cache_read_per_1m: 0.6
    - provider: doubao
      model: Doubao-Seed-2.1-turbo
      input_per_1m: 3.0
      output_per_1m: 15.0
      cache_read_per_1m: 0.6
    - provider: gateway
      model: your-model-b
      input_per_1m: 1.0
      output_per_1m: 2.0
      cache_read_per_1m: 0.2
    - provider: deepseek
      model: your-model-b
      input_per_1m: 1.0
      output_per_1m: 2.0
      cache_read_per_1m: 0.2
