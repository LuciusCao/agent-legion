data_dir: data
database:
  url: postgresql://127.0.0.1:5432/agent_legion
server:
  cors:
    allow_origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allow_credentials: false

cleanup:
  log_retention_days: 7
  run_dir_retention_days: 3
  interval_seconds: 3600

monitoring:
  sample_interval_seconds: 60
  retention_days: 30
