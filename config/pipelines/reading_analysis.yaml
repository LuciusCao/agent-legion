key: reading_analysis
label: 题目审题分析 Pipeline
concurrency:
  local: 4
  agent: 2
intake:
  modes:
    batch_by_knowledge:
      label: 按知识点批量
      input_field: knowledge_codes
    batch_by_ids:
      label: 按题目ID批量
      input_field: question_ids
nodes:
  fetch_questions:
    runner: local
    after: []
    inputs: []
    outputs: [questions.json]
  clean_and_parse:
    runner: local
    after: [fetch_questions]
    inputs: [questions.json]
    outputs: [questions_parsed.json]
  extract_keywords:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/extract_keywords
      tools: [read, write, bash]
    after: [clean_and_parse]
    inputs: [questions_parsed.json]
    outputs: [keywords_raw.json, keywords_report.json]
  review_keywords:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/review_keywords
      tools: [read, write, bash]
    after: [extract_keywords]
    inputs: [questions_parsed.json, keywords_raw.json]
    outputs: [keywords_reviewed.json, keywords_review_report.json]
  assess_difficulty:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/assess_difficulty
      tools: [read, write, bash]
    after: [review_keywords]
    inputs: [questions_parsed.json, keywords_reviewed.json]
    outputs: [difficulty_raw.json, difficulty_report.json]
  review_difficulty:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/review_difficulty
      tools: [read, write, bash]
    after: [assess_difficulty]
    inputs: [questions_parsed.json, keywords_reviewed.json, difficulty_raw.json]
    outputs: [difficulty_reviewed.json, difficulty_review_report.json]
  generate_distractors:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/generate_distractors
      tools: [read, write, bash]
    after: [review_keywords]
    inputs: [questions_parsed.json, keywords_reviewed.json]
    outputs: [distractors_raw.json, distractors_report.json]
  review_distractors:
    runner: agent
    agent:
      engine: pi
      skill: reading_analysis/review_distractors
      tools: [read, write, bash]
    after: [generate_distractors]
    inputs: [questions_parsed.json, keywords_reviewed.json, distractors_raw.json]
    outputs: [distractors_reviewed.json, distractors_review_report.json]
  mark_question:
    runner: local
    after: [review_difficulty, review_distractors]
    inputs: [keywords_reviewed.json, difficulty_reviewed.json, distractors_reviewed.json]
    outputs: [question_marks.json]
