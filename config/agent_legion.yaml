asr:
  provider: auto
  timeout_seconds: 900
  whisper:
    binary: whisper-cli
    model: ~/.cache/whisper.cpp/ggml-medium.bin
    vad_model: ~/.cache/whisper.cpp/ggml-silero-v6.2.0.bin
  sensevoice:
    script: server/app/pipeline/transcribe_sensevoice.py
    model_dir: ~/.cache/SenseVoiceSmall
openclaw:
  cwd: .
  timeout_seconds: 600
  isolated_workspace_root: ''
  skill_safety:
    enabled: true
    # Path whitelist only: refs are pinned by config/skills.lock (single source
    # of truth, config governance G3). A ref key here is rejected at startup.
    repos:
    - path: ~/.agents/skills/agent-legion/video_knowledge/generate_interactions
    - path: ~/.agents/skills/agent-legion/video_knowledge/review_video_content
    - path: ~/.agents/skills/agent-legion/video_knowledge/review_subtitles
    - path: ~/.agents/skills/agent-legion/video_knowledge/generate_chapters
  command_template:
  - openclaw
  - agent
  - --local
  - --agent
  - main
  - --session-id
  - '{video_id}-{timestamp}'
  - --thinking
  - 'on'
  - --message
  - '{prompt_text}'
  - --json
