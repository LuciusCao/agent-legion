asr:
  provider: auto
  timeout_seconds: 900
  whisper:
    binary: whisper-cli
    model: ~/.cache/whisper.cpp/ggml-medium.bin
    vad_model: ~/.cache/whisper.cpp/ggml-silero-v6.2.0.bin
  sensevoice:
    script: server/app/pipeline/transcribe_sensevoice.py
    model_dir: ~/.cache/SenseVoiceSmall
cms:
  base_url: https://cms.example.com/v2
  env: prod
  bank_version: v5
  country_id: '1'
  subject_id: '2'
  page_size: '50'
  token: ''
  token_gen:
    app_id: ''
    nonce: ''
    secret: ''
    url: ''
resource_providers:
  cms.question.detail:
    path: /question/detail
    resource_key: question_detail
    url_key: question_detail_url
    config_schema:
      type: object
      properties:
        api_url:
          type: string
        bank_version:
          type: string
        country_id:
          type: string
        subject_id:
          type: string
        env:
          type: string
        token:
          type: string
          secret: true
  cms.question.list_by_knowledge:
    path: /question/list
    resource_key: by_knowledge
    url_key: question_list_url
    config_schema:
      type: object
      properties:
        api_url:
          type: string
        bank_version:
          type: string
        country_id:
          type: string
        subject_id:
          type: string
        env:
          type: string
        token:
          type: string
          secret: true
        page_size:
          type: integer
          minimum: 1
          maximum: 500
openclaw:
  cwd: .
  timeout_seconds: 600
  isolated_workspace_root: ''
  skill_safety:
    enabled: true
    repos:
    - path: ~/.agents/skills/agent-legion/video_knowledge/generate_interactions
      ref: v1.0.0
    - path: ~/.agents/skills/agent-legion/video_knowledge/review_video_content
      ref: v1.0.0
    - path: ~/.agents/skills/agent-legion/video_knowledge/review_subtitles
      ref: v1.0.0
    - path: ~/.agents/skills/agent-legion/video_knowledge/generate_chapters
      ref: v1.0.0
  command_template:
  - openclaw
  - agent
  - --local
  - --agent
  - main
  - --session-id
  - '{video_id}-{timestamp}'
  - --thinking
  - 'on'
  - --message
  - '{prompt_text}'
  - --json
