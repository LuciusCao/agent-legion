asr:
  provider: auto
  timeout_seconds: 900
  whisper:
    binary: whisper-cli
    model: ~/.cache/whisper.cpp/ggml-medium.bin
    vad_model: ~/.cache/whisper.cpp/ggml-silero-v6.2.0.bin
  sensevoice:
    script: server/app/pipeline/transcribe_sensevoice.py
    model_dir: ~/.cache/SenseVoiceSmall
cms:
  base_url: https://cms.example.com/v2
  env: prod
  bank_version: v5
  country_id: '1'
  subject_id: '2'
  page_size: '50'
  token: ''
  token_gen:
    app_id: ''
    nonce: ''
    secret: ''
    url: ''
resource_providers:
  cms.question.detail:
    path: /question/detail
  cms.question.list_by_knowledge:
    path: /question/list
cleanup_video_after_assemble: false
openclaw:
  cwd: .
  timeout_seconds: 600
  isolated_workspace_root: ''
  skill_safety:
    enabled: true
    repos:
    - path: ~/.openclaw/workspace/skills/generate-interactions
      ref: v1.0.0
    - path: ~/.openclaw/workspace/skills/review-interactions
      ref: v1.0.0
    - path: ~/.openclaw/workspace/skills/review-subtitles
      ref: v1.0.0
    - path: ~/.openclaw/workspace/skills/slice-chapters
      ref: v1.0.0
  command_template:
  - openclaw
  - agent
  - --local
  - --agent
  - main
  - --session-id
  - '{video_id}-{timestamp}'
  - --thinking
  - 'on'
  - --message
  - '{prompt_text}'
  - --json
  runners:
  - command_template:
    - openclaw
    - agent
    - --local
    - --agent
    - main
    - --session-id
    - '{video_id}-{timestamp}'
    - --thinking
    - 'on'
    - --message
    - '{prompt_text}'
    - --json
    count: 8
