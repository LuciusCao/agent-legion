[package]
name = "velites"
# 版本线独立于仓库版本（agent-legion pyproject）：只在 velites/ 自身有源码
# 改动的发版时前进，仓库发版不再锁步 bump。规则由 scripts/check_versions.py
# 强制；理由：ensure-velites.sh 以 velites/ 子树 tree hash 做二进制新鲜度
# 指纹、Docker velites-build stage 以 COPY velites/ 为缓存键——无谓的版本
# bump 会触发全量 cargo build 与镜像层重建。
version = "0.5.0"
edition = "2021"
description = "Agent Legion lightweight agent harness (headless, pi-compatible event stream)"
license = "MIT"

[lib]
name = "velites"
path = "src/lib.rs"

[[bin]]
name = "velites"
path = "src/main.rs"

# #383：沙箱包装器的独立 bin——worker 镜像的基础设施（EXEC-CODE-003 的
# code 节点沙箱），与 agent harness 分家。名字刻意不同：runtime 自动探测
# （#254）按二进制名精确匹配，velites-sandbox 不进 RUNTIME_CATALOG，烤进
# 镜像不会让 worker 声明 velites agent runtime。
[[bin]]
name = "velites-sandbox"
path = "src/bin/velites_sandbox.rs"

[[bin]]
name = "velites-schema"
path = "src/bin/velites_schema.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
jsonschema = { version = "0.53.0", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
