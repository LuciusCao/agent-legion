host_url: http://192.0.2.1:8000
worker_id: remote-worker-1
name: Remote Worker
# 可选值：pi / openclaw / velites。声明 velites 需先在 PATH 提供 velites 二进制。
runtimes: [velites]
max_concurrency: 10
# code 节点执行池容量（0 = 仅 agent）；> 0 需 velites 在 PATH（启动预检强制）。
# max_code_concurrency: 0
labels: {os: linux, arch: arm64, location: remote}
register_token_file: /run/secrets/agent_worker_register_token
work_root: /var/lib/agent-legion-worker
