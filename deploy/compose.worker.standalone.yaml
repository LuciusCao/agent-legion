# Worker 独立部署编排（无需克隆仓库；scripts/install-worker.sh 的拉取目标，
# curl 一键安装的端点文件）：
#   curl -fsSL https://raw.githubusercontent.com/LuciusCao/agent-legion/develop/scripts/install-worker.sh | sh -s -- --host-url http://<host>:8000 --worker-id <id>
# 安装脚本从 worker-v* tag ref 拉取本文件（与镜像版本解耦：镜像 tag 经
# .env 的 AGENT_WORKER_IMAGE 插值选择，不锁定在文件内的默认值），并在
# 安装目录生成配套的挂载资产（velites-bin / velites-config / worker.yaml）。
#
# 与 compose.worker.yaml（仓库内现场构建形态）的差异：无 build 段、image
# 来自 GHCR；其余运维面（seccomp/CAP_SYS_ADMIN、velites 外挂 long syntax
# fail-fast、期望 runtime 守卫、控制卷/数据卷、healthcheck）语义保持一致。
# 需要 Docker Compose v2.24+（env_file 的 path/required long syntax）。
name: agent-legion-worker

services:
  worker:
    image: ${AGENT_WORKER_IMAGE:-ghcr.io/luciuscao/agent-legion-worker:0.6.0}
    restart: unless-stopped
    # velites 沙箱（bwrap）在容器内需要：seccomp 放行 unshare + CAP_SYS_ADMIN
    #（同 compose.worker.yaml 注释）。缺失时沙箱 fail-closed，agent 全部秒退。
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./worker.yaml:/etc/agent-legion/worker.yaml:ro
      # velites 二进制外挂（issue #381）：worker 镜像不含任何 agent runtime
      # 执行器。注意：无 create_host_path 键时 daemon 会在 bind 源缺失时
      # 自动创建空**目录**并照常启动（实测）——期望 runtime 守卫
      # （AGENT_WORKER_EXPECT_RUNTIMES）才是真正的 fail-fast 层：空目录
      # 探测不到二进制 → 容器 fail（安装脚本 install-worker.sh 的落位
      # 守卫负责不把目录留在原地）。
      - type: bind
        source: ./velites-bin/velites
        target: /app/data/bin/velites
        read_only: true
      # pi 在 docker 镜像内不可用（npm 入口依赖 node，#381 已移出镜像）；
      # 挂载点保留空目录，纯 code 池 / 未来形态可自行填充。
      - ./pi-config:/root/.pi/agent:ro
      - ./velites-config:/root/.velites:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
    ports:
      # 端口可插值：宿主机已有服务占用 8787（如本机 dev worker）时，经 .env
      # 设 AGENT_WORKER_UI_BIND / AGENT_WORKER_UI_PORT 换绑定地址或宿主端口。
      - ${AGENT_WORKER_UI_BIND:-127.0.0.1}:${AGENT_WORKER_UI_PORT:-8787}:8787
    # models.json 中 $ENV 引用的凭据变量经此文件注入（0600）；缺失不阻塞
    # 启动（字面 apiKey / 无引用的部署合法）。
    env_file:
      - path: ${VELITES_PROVIDER_ENV_FILE:-./velites-provider.env}
        required: false
    environment:
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      AGENT_WORKER_IMAGE_VERSION: ${AGENT_WORKER_IMAGE:-ghcr.io/luciuscao/agent-legion-worker:0.6.0}
      # 期望 runtime 守卫：探测不到 velites 或模型发现失败（含架构错配）
      # 即 fail-fast（退出码 2）。纯 code 池形态置空并去掉 velites bind
      # mount（参照 compose.worker.zero-runtime.yaml）。
      AGENT_WORKER_EXPECT_RUNTIMES: ${AGENT_WORKER_EXPECT_RUNTIMES-velites}
    stop_grace_period: 30s
    healthcheck:
      # Healthy = 服务可达，且控制面未进入 failed，且（Worker 进程在跑或尚未配置）。
      test: [CMD-SHELL, "python3 -c \"import json,pathlib,urllib.request; base='http://127.0.0.1:8787'; urllib.request.urlopen(base+'/api/health',timeout=2); p=pathlib.Path('/var/lib/agent-legion-worker-control/control_token'); s=json.loads(urllib.request.urlopen(urllib.request.Request(base+'/api/status',headers={'Authorization':'Bearer '+p.read_text().strip()}),timeout=2).read()) if p.is_file() else {}; assert not s.get('failed'),'worker failed'; assert s.get('worker_running') or not s.get('configured'),'worker not running'\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  worker-data:
  worker-control:
