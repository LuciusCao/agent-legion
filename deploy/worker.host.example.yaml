host_url: http://host:8000
worker_id: host-local-1
name: Host-local Worker
# 可选值：pi / velites。Agent runtime 声明 = 启动时自动探测本机
# 已安装的运行时二进制（data/bin/ 优先、PATH 兜底），探测到即默认启用；
# 这里只列「装了但刻意不接」的反选停用项（issue #254）。执行器不在
# worker 镜像内（issue #381）：velites 经 compose 挂载（VELITES_BIN）；
# pi 依赖 node 运行时，docker 形态不可用（走裸机，详见
# agent-worker-deployment.md §5）。防漏装守卫 AGENT_WORKER_EXPECT_RUNTIMES
# 由 compose 注入（默认 velites）。
disabled_runtimes: []
max_concurrency: 10
# code 节点执行池容量（0 = 仅 agent）；> 0 需沙箱包装器可解析（docker 镜像内置
# velites-sandbox，无需外挂；裸机为 velites-sandbox/velites 在 data/bin 或 PATH）。
# max_code_concurrency: 0
labels: {os: linux, arch: arm64, location: host}
# 注册用 scoped token 在 Worker 控制台（8787）配置页添加，或经 workerctl
# configure --register-token-file 导入；不再有全局 token（issue #35）。
# register_token_dir 默认指向 state 目录下的 register_tokens/，通常无需配置。
work_root: /var/lib/agent-legion-worker
