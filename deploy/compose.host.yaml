name: agent-legion

services:
  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_legion
      POSTGRES_USER: agent_legion
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_legion -d agent_legion"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    # 材料对象存储（materials-and-runs 设计 §6.1）：S3 兼容，代码只对 S3 API
    # 编程，可平替 RustFS/MinIO/AWS S3。默认本地后端（#340 调研：RustFS 的
    # 后台 scanner 全量巡检在百万小对象下持续空转，SeaweedFS 的 volume/needle
    # 布局 + filer 元数据 DB 结构性不存在该问题，闲置开销与对象数无关——
    # 实测见 issue #340 评论）。凭据从 deploy/.env 注入，host 经同一组
    # AGENT_LEGION_S3_* 访问。
    #
    # 单容器 all-in-one（master+volume+filer+S3 gateway），S3 口 8333、
    # master UI 9333。
    #
    # 挂在 materials-local profile 下（默认后端）：由 scripts/local-s3-decide.sh
    # （AGENT_LEGION_LOCAL_S3=auto|always|never + BACKEND 默认 seaweedfs）决策；
    # 切回 rustfs 设 AGENT_LEGION_LOCAL_S3_BACKEND=rustfs。凭据插值不能用
    # :? 强校验——profile 未启用时 compose 仍会解析插值，会误伤不配静态凭据的
    # 外部 S3 用户；凭据齐备性由 local-s3-decide.sh 在 start 决策时 fail-fast。
    profiles: ["materials-local"]
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    # entrypoint 覆盖为 sh -c，从插值 env 现场生成 s3.config（凭据是
    # install-deps.sh 生成的 hex，无 JSON 转义风险）；原生 entrypoint.sh 的
    # 两件事自己补：/data 属主修正 + su-exec 降权到 seaweed 用户（非 root）。
    # -master.volumeSizeLimitMB 收小默认 volume（默认 30GB 对 dev 数据集
    # 过大，2GB 让 vacuum 重写更细粒度）。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown -R seaweed:seaweed /data 2>/dev/null || true
        printf '%s\n' '{"identities":[{"name":"agent-legion","credentials":[{"accessKey":"'"$AGENT_LEGION_S3_ACCESS_KEY"'","secretKey":"'"$AGENT_LEGION_S3_SECRET_KEY"'"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec su-exec seaweed weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=2048 -volume.max=0
    environment:
      AGENT_LEGION_S3_ACCESS_KEY: ${AGENT_LEGION_S3_ACCESS_KEY:-}
      AGENT_LEGION_S3_SECRET_KEY: ${AGENT_LEGION_S3_SECRET_KEY:-}
    volumes:
      - seaweedfs-data:/data
    ports:
      - ${AGENT_LEGION_S3_BIND:-127.0.0.1}:8333:8333
      - ${AGENT_LEGION_S3_BIND:-127.0.0.1}:9333:9333
    healthcheck:
      # S3 口的 /healthz 是 weed server 的健康端点（匿名 200；根路径 / 是
      # 403——S3 API 对匿名请求的正常行为，不能当探针，同 rustfs 教训 #340）。
      test: [CMD, "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20

  rustfs:
    # 可选本地后端（逃生舱）：AGENT_LEGION_LOCAL_S3_BACKEND=rustfs 时经
    # materials-local-rustfs profile 拉起（local-s3-decide.sh 分派）。存量
    # rustfs 卷用户迁移前可停在它上面（数据迁移见 docs/materials-storage-
    # deployment.md「迁移后端」）。
    #
    # 镜像 pin 到明确版本而非 latest（#340）：磁盘格式是 MinIO xl 兼容格式
    # 且存量卷由既有版本写入，latest 漂移即行为漂移；升级 = 有意改这一行 +
    # 验证存量卷可挂载。
    #
    # scanner/heal 显式关闭（#340）：单盘本地形态下巡检无意义，而它的命名
    # 空间全量遍历会读每个对象的 xl.meta——小对象（≤128KiB）数据内联其中，
    # 「元数据巡检」= 重读全部数据（rustfs/rustfs#6219 同类案例）。
    profiles: ["materials-local-rustfs"]
    image: rustfs/rustfs:1.0.0-beta.12
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${AGENT_LEGION_S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${AGENT_LEGION_S3_SECRET_KEY:-}
      RUSTFS_SCANNER_ENABLED: "false"
      RUSTFS_HEAL_ENABLED: "false"
    volumes:
      - rustfs-data:/data
    ports:
      - ${AGENT_LEGION_S3_BIND:-127.0.0.1}:9000:9000
      - ${AGENT_LEGION_S3_BIND:-127.0.0.1}:9001:9001
    healthcheck:
      # 根路径 / 对匿名请求返回 403（S3 API 行为，不代表服务故障），须探
      # MinIO 兼容的 liveness 端点；探 / 会让容器永远 unhealthy（#340）。
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  host:
    build:
      context: ..
      target: host
    image: agent-legion-host:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # seaweedfs/rustfs 不在此处：两者挂在各自 profile 下，depends_on 指向
      # 未启用 profile 的服务会让 compose 直接报 "depends on undefined
      # service" 拒绝启动；且 S3 是软依赖（不可达时材料 API 降级 503，
      # 启动自检 probe 会持续暴露，见 server/app/storage/probe.py）。
    environment:
      AGENT_LEGION_DATABASE_URL: postgresql://agent_legion@postgres:5432/agent_legion
      # 共享库 schema 门（server/app/db/schema.py）：容器后端是这台
      # postgres 的有意迁移者，显式授予 opt-in。
      AGENT_LEGION_ALLOW_SHARED_DB_SCHEMA: "1"
      PGPASSFILE: /run/secrets/postgres_pgpass
      AGENT_LEGION_VAULT_MASTER_KEY_FILE: /run/secrets/vault_master_key
      AGENT_LEGION_DATA_DIR: /var/lib/agent-legion
      # 无冒号的 ${VAR-默认值} 形式：deploy/.env 显式写 AGENT_LEGION_S3_ENDPOINT=
      # （空值）时生效为「AWS 默认端点」，不会被默认值盖掉；外部 S3 在这里
      # 配远程地址后，local-s3-decide.sh 会同步跳过本地后端。
      AGENT_LEGION_S3_ENDPOINT: ${AGENT_LEGION_S3_ENDPOINT-http://seaweedfs:8333}
      # presigned URL 的签发地址：浏览器直传与 compose 网络外的 remote worker
      # 都访问不到内部地址 seaweedfs:8333，必须用客户端可达地址签发（SigV4 把
      # Host 签进签名，不能签后改写）。默认值匹配 seaweedfs 的端口映射
      # （${AGENT_LEGION_S3_BIND:-127.0.0.1}:8333）；非本机访问时在
      # deploy/.env 覆盖为外部可达地址；切 rustfs 后端时同步覆盖为 :9000。
      AGENT_LEGION_S3_PUBLIC_ENDPOINT: ${AGENT_LEGION_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
      AGENT_LEGION_S3_BUCKET: ${AGENT_LEGION_S3_BUCKET:-agent-legion}
      # 留空 = boto3 默认凭据链（IAM role 等外部 S3 场景）；本地 RustFS 形态
      # 的凭据齐备性由 scripts/local-s3-decide.sh 在 prod-up 入口 fail-fast。
      AGENT_LEGION_S3_ACCESS_KEY: ${AGENT_LEGION_S3_ACCESS_KEY:-}
      AGENT_LEGION_S3_SECRET_KEY: ${AGENT_LEGION_S3_SECRET_KEY:-}
    secrets: [postgres_pgpass, vault_master_key]
    volumes:
      - host-data:/var/lib/agent-legion
      - ${AGENT_SKILLS_DIR:-../skills}:/root/.agents/skills:ro
    ports:
      - ${AGENT_LEGION_HOST_BIND:-127.0.0.1}:8000:8000
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      target: worker
    image: agent-legion-worker:local
    restart: unless-stopped
    depends_on:
      host:
        condition: service_healthy
    # velites 沙箱（bwrap）在容器内需要：seccomp 放行 unshare（默认 profile
    # 拦截，setuid 绕不过）+ CAP_SYS_ADMIN（创建 mount/pid namespace，
    # 容器默认能力集不含）。缺了则沙箱 fail-closed，agent 全部秒退。
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./worker.host.example.yaml:/etc/agent-legion/worker.yaml:ro
      - ${PI_CONFIG_DIR:-../pi-config}:/root/.pi/agent:ro
      - ${VELITES_CONFIG_DIR:-../velites-config}:/root/.velites:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
    ports:
      - ${AGENT_WORKER_UI_BIND:-127.0.0.1}:8787:8787
    # Optional provider credentials referenced by /root/.velites/models.json.
    # Keep them in a dedicated 0600, git-ignored file instead of Compose YAML.
    env_file:
      - path: ${VELITES_PROVIDER_ENV_FILE:-./velites-provider.env}
        required: false
    environment:
      # Optional shared token for the tailnet-bound LLM gateway; the worker
      # supervisor passes it through to Pi subprocesses. Set it in deploy/.env
      # (git- and docker-ignored) or the shell environment — never inline here.
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      AGENT_WORKER_IMAGE_VERSION: ${AGENT_WORKER_IMAGE_VERSION:-agent-legion-worker:local}
    stop_grace_period: 30s
    healthcheck:
      # Healthy = 服务可达，且控制面未进入 failed，且（Worker 进程在跑或尚未配置）。
      # control_token 在首次启动前可能不存在，此时只探 /api/health。
      test: [CMD-SHELL, "python3 -c \"import json,pathlib,urllib.request; base='http://127.0.0.1:8787'; urllib.request.urlopen(base+'/api/health',timeout=2); p=pathlib.Path('/var/lib/agent-legion-worker-control/control_token'); s=json.loads(urllib.request.urlopen(urllib.request.Request(base+'/api/status',headers={'Authorization':'Bearer '+p.read_text().strip()}),timeout=2).read()) if p.is_file() else {}; assert not s.get('failed'),'worker failed'; assert s.get('worker_running') or not s.get('configured'),'worker not running'\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  postgres_pgpass:
    file: ${POSTGRES_PGPASS_FILE:-./secrets/postgres_pgpass}
  vault_master_key:
    file: ${VAULT_MASTER_KEY_FILE:-./secrets/vault_master_key}

volumes:
  postgres-data:
  seaweedfs-data:
  rustfs-data:
  host-data:
  worker-data:
  worker-control:
