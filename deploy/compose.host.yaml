name: agent-legion

services:
  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_legion
      POSTGRES_USER: agent_legion
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_legion -d agent_legion"]
      interval: 5s
      timeout: 3s
      retries: 20

  host:
    build:
      context: ..
      target: host
    image: agent-legion-host:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_LEGION_DATABASE_URL: postgresql://agent_legion@postgres:5432/agent_legion
      PGPASSFILE: /run/secrets/postgres_pgpass
      AGENT_LEGION_WORKER_REGISTER_TOKEN_FILE: /run/secrets/agent_worker_register_token
      AGENT_LEGION_VAULT_MASTER_KEY_FILE: /run/secrets/vault_master_key
      AGENT_LEGION_DATA_DIR: /var/lib/agent-legion
    secrets: [agent_worker_register_token, postgres_pgpass, vault_master_key]
    volumes:
      - host-data:/var/lib/agent-legion
      - ${AGENT_SKILLS_DIR:-../skills}:/root/.agents/skills/agent-legion:ro
    ports:
      - ${AGENT_LEGION_HOST_BIND:-127.0.0.1}:8000:8000
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      target: worker
    image: agent-legion-worker:local
    restart: unless-stopped
    depends_on:
      host:
        condition: service_healthy
    secrets: [agent_worker_register_token]
    # velites 沙箱（bwrap）在容器内需要：seccomp 放行 unshare（默认 profile
    # 拦截，setuid 绕不过）+ CAP_SYS_ADMIN（创建 mount/pid namespace，
    # 容器默认能力集不含）。缺了则沙箱 fail-closed，agent 全部秒退。
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./worker.host.example.yaml:/etc/agent-legion/worker.yaml:ro
      - ${PI_CONFIG_DIR:-../pi-config}:/root/.pi/agent:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
    ports:
      - ${AGENT_WORKER_UI_BIND:-127.0.0.1}:8787:8787
    environment:
      # Optional shared token for the tailnet-bound LLM gateway; the worker
      # supervisor passes it through to Pi subprocesses. Set it in deploy/.env
      # (git- and docker-ignored) or the shell environment — never inline here.
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      AGENT_WORKER_IMAGE_VERSION: ${AGENT_WORKER_IMAGE_VERSION:-agent-legion-worker:local}
    stop_grace_period: 30s
    healthcheck:
      # Healthy = 服务可达，且控制面未进入 failed，且（Worker 进程在跑或尚未配置）。
      # control_token 在首次启动前可能不存在，此时只探 /api/health。
      test: [CMD-SHELL, "python3 -c \"import json,pathlib,urllib.request; base='http://127.0.0.1:8787'; urllib.request.urlopen(base+'/api/health',timeout=2); p=pathlib.Path('/var/lib/agent-legion-worker-control/control_token'); s=json.loads(urllib.request.urlopen(urllib.request.Request(base+'/api/status',headers={'Authorization':'Bearer '+p.read_text().strip()}),timeout=2).read()) if p.is_file() else {}; assert not s.get('failed'),'worker failed'; assert s.get('worker_running') or not s.get('configured'),'worker not running'\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  postgres_pgpass:
    file: ${POSTGRES_PGPASS_FILE:-./secrets/postgres_pgpass}
  agent_worker_register_token:
    file: ${AGENT_WORKER_REGISTER_TOKEN_FILE:-./secrets/agent_worker_register_token}
  vault_master_key:
    file: ${VAULT_MASTER_KEY_FILE:-./secrets/vault_master_key}

volumes:
  postgres-data:
  host-data:
  worker-data:
  worker-control:
