name: agent-legion-worker-measurement

# Disposable #1049 measurement stack. It is not a deployment example and does
# not propose resource defaults. The worker deliberately mirrors the shipped
# privilege envelope: root, SYS_ADMIN, seccomp:unconfined. Resource limits default
# to unlimited; explicit MEASUREMENT_MEM_LIMIT/MEASUREMENT_PIDS_LIMIT values are
# candidate/fault-injection inputs, not production recommendations.
services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: agent_legion_measurement
      POSTGRES_USER: agent_legion
      POSTGRES_PASSWORD: measurement-only-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${MEASUREMENT_POSTGRES_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent_legion -d agent_legion_measurement"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$(stat -c %u /data 2>/dev/null)" != "1000" ]; then
          chown -R seaweed:seaweed /data 2>/dev/null || true
        fi
        umask 077
        printf '%s\n' '{"identities":[{"name":"agent-legion","credentials":[{"accessKey":"measurement-access-key","secretKey":"measurement-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        chown seaweed:seaweed /tmp/s3.json
        exec su-exec seaweed weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=2048 -volume.max=10
    volumes:
      - seaweedfs-data:/data
    ports:
      - 127.0.0.1:${MEASUREMENT_S3_PORT:-58333}:8333
    healthcheck:
      test: [CMD, "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  host:
    build:
      context: ..
      target: host
    image: agent-legion-host:measurement
    # Measurement-only support image setup: in-place skill resolution executes
    # git in Host. This does not alter the measured Worker privilege envelope.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y --no-install-recommends git && \
        chown -R "${MEASUREMENT_HOST_UID:?generated by worker_resource_workload.py}:${MEASUREMENT_HOST_GID:?generated by worker_resource_workload.py}" /var/lib/agent-legion && \
        exec setpriv --reuid="${MEASUREMENT_HOST_UID}" --regid="${MEASUREMENT_HOST_GID}" --clear-groups \
        env HOME=/tmp uvicorn server.app.main:create_prod_app --factory --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 20 --log-config deploy/uvicorn-log-config.json
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      AGENT_LEGION_DATABASE_URL: postgresql://agent_legion:measurement-only-password@postgres:5432/agent_legion_measurement
      AGENT_LEGION_VAULT_MASTER_KEY: ${MEASUREMENT_VAULT_KEY:?generated by worker_resource_workload.py}
      AGENT_LEGION_DATA_DIR: /var/lib/agent-legion
      AGENT_LEGION_S3_ENDPOINT: http://seaweedfs:8333
      AGENT_LEGION_S3_PUBLIC_ENDPOINT: http://seaweedfs:8333
      AGENT_LEGION_S3_BUCKET: agent-legion-measurement
      AGENT_LEGION_S3_ACCESS_KEY: measurement-access-key
      AGENT_LEGION_S3_SECRET_KEY: measurement-secret-key
      AGENT_LEGION_WORKER_CONSOLE_URL: http://127.0.0.1:58787
    volumes:
      - host-data:/var/lib/agent-legion
      - ${MEASUREMENT_SKILLS_DIR:?generated by worker_resource_workload.py}:/tmp/.agents/skills:ro
    ports:
      - 127.0.0.1:${MEASUREMENT_HOST_PORT:-58080}:8000
    stop_grace_period: 25s
    healthcheck:
      test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ..
      target: worker
    image: agent-legion-worker:measurement
    depends_on:
      host:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
      # Measurement-only: Ubuntu's default AppArmor profile can deny bwrap's
      # mount propagation; production keeps the Docker default profile.
      - ${MEASUREMENT_APPARMOR:-apparmor:unconfined}
    cap_add:
      - SYS_ADMIN
      # Default repeats SYS_ADMIN (no new privilege). Desktop functional runs
      # explicitly opt into NET_ADMIN for the private-netns loopback (#39).
      - ${MEASUREMENT_NET_ADMIN:-SYS_ADMIN}
    mem_limit: ${MEASUREMENT_MEM_LIMIT:-0}
    pids_limit: ${MEASUREMENT_PIDS_LIMIT:--1}
    volumes:
      - ${MEASUREMENT_WORKER_CONFIG:?generated by worker_resource_workload.py}:/etc/agent-legion/worker.yaml:ro
      - type: bind
        source: ${VELITES_BIN:?built by the measurement workflow}
        target: /app/data/bin/velites
        read_only: true
      - ${MEASUREMENT_MODELS_PATH:?generated by worker_resource_workload.py}:/root/.velites/models.json:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
    environment:
      AGENT_WORKER_IMAGE_VERSION: agent-legion-worker:measurement
      AGENT_WORKER_EXPECT_RUNTIMES: velites
      AGENT_WORKER_CONSOLE_URL: ""
      AGENT_WORKER_UI_EFFECTIVE_BIND: 127.0.0.1
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MEASUREMENT_WORKER_PORT:-58787}:8787
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "python3 -c \"import json,pathlib,urllib.request; base='http://127.0.0.1:8787'; urllib.request.urlopen(base+'/api/health',timeout=2); p=pathlib.Path('/var/lib/agent-legion-worker-control/control_token'); s=json.loads(urllib.request.urlopen(urllib.request.Request(base+'/api/status',headers={'Authorization':'Bearer '+p.read_text().strip()}),timeout=2).read()) if p.is_file() else {}; assert not s.get('failed'),'worker failed'; assert s.get('worker_running') or not s.get('configured'),'worker not running'\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  seaweedfs-data:
  host-data:
  worker-data:
  worker-control:
