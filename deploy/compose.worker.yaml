name: agent-legion-worker

services:
  worker:
    build:
      context: ..
      target: worker
    image: agent-legion-worker:local
    restart: unless-stopped
    # velites 沙箱（bwrap）在容器内需要：seccomp 放行 unshare + CAP_SYS_ADMIN
    # （同 compose.host.yaml 注释）。缺失时沙箱 fail-closed，agent 全部秒退。
    # 特权组合的风险定性与分级收敛路径（含 no-new-privileges 需实测的原因）
    # 见 docs/architecture/deployment.md「Worker 容器特权边界」（#274）。
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    volumes:
      - ${AGENT_WORKER_CONFIG:-../deploy/worker.remote.example.yaml}:/etc/agent-legion/worker.yaml:ro
      # velites 二进制外挂（issue #381）：worker 镜像不含任何 agent runtime
      # 执行器，velites 以平台匹配的二进制挂到自带副本目录（/app/data/bin，
      # binary_resolution.py 自带副本优先、PATH 兜底）。产物来自
      # velites-release workflow 的 GitHub Release（velites-v* tag）：x86_64
      # 主机取 *-x86_64-unknown-linux-gnu.tar.gz、arm64 取
      # *-aarch64-unknown-linux-gnu.tar.gz，解出的 velites chmod +x 后放这里；
      # 必须与 worker 镜像架构一致。
      #
      # long syntax（review on #381）：短语法下源路径不存在时 docker 会
      # 静默创建 root 属主的空**目录**，resolve_binary 的 is_file 检查
      # fail-closed 但报错迷惑。勘误（PR #474 实测）：long syntax 也不带
      # create_host_path 键，daemon 对缺失源同样自动建目录、容器照常启动——
      # 真正的 fail-fast 层是 AGENT_WORKER_EXPECT_RUNTIMES 守卫（空目录
      # 探测不到二进制 → fail）。
      - type: bind
        source: ${VELITES_BIN:-../velites-bin/velites}
        target: /app/data/bin/velites
        read_only: true
      - ${PI_CONFIG_DIR:-../pi-config}:/root/.pi/agent:ro
      - ${VELITES_CONFIG_DIR:-../velites-config}:/root/.velites:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
    ports:
      - ${AGENT_WORKER_UI_BIND:-127.0.0.1}:8787:8787
    # Optional provider credentials referenced by /root/.velites/models.json.
    # Keep them in a dedicated 0600, git-ignored file instead of Compose YAML.
    env_file:
      - path: ${VELITES_PROVIDER_ENV_FILE:-./velites-provider.env}
        required: false
    environment:
      # Optional shared token for the tailnet-bound LLM gateway; the worker
      # supervisor passes it through to Pi subprocesses. Set it in deploy/.env
      # (git- and docker-ignored) or the shell environment — never inline here.
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      AGENT_WORKER_IMAGE_VERSION: ${AGENT_WORKER_IMAGE_VERSION:-agent-legion-worker:local}
      # Expected-runtime guard (issue #381): fail-fast (exit 2) at startup
      # when these runtimes cannot be probed, turning "forgot to mount
      # velites" from silent zero capacity into an explicit startup error.
      # 无冒号的 ${VAR-默认值} 形式：deploy/.env 显式写空值时生效为「禁用
      # 守卫」（零 runtime 注册合法，如纯 code 池形态），不会被默认值盖掉。
      AGENT_WORKER_EXPECT_RUNTIMES: ${AGENT_WORKER_EXPECT_RUNTIMES-velites}
    stop_grace_period: 30s
    healthcheck:
      # Healthy = 服务可达，且控制面未进入 failed，且（Worker 进程在跑或尚未配置）。
      # control_token 在首次启动前可能不存在，此时只探 /api/health。
      test: [CMD-SHELL, "python3 -c \"import json,pathlib,urllib.request; base='http://127.0.0.1:8787'; urllib.request.urlopen(base+'/api/health',timeout=2); p=pathlib.Path('/var/lib/agent-legion-worker-control/control_token'); s=json.loads(urllib.request.urlopen(urllib.request.Request(base+'/api/status',headers={'Authorization':'Bearer '+p.read_text().strip()}),timeout=2).read()) if p.is_file() else {}; assert not s.get('failed'),'worker failed'; assert s.get('worker_running') or not s.get('configured'),'worker not running'\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  worker-data:
  worker-control:
