# 零 agent runtime 形态 override（issue #381，codex P2）：
# 基础 compose 无条件 bind mount velites（long syntax；源缺失时 daemon 自动
# 建空目录、容器照常启动，「忘了放二进制」由 AGENT_WORKER_EXPECT_RUNTIMES
# 守卫 fail-fast，见 compose.worker.yaml 同段勘误）；纯 code 池 / 实验形态
# 不挂任何 agent runtime 时，那条挂载只会在 velites-bin/ 下留一个无用的
# 空目录，本 override 把它去掉。
#
# 用法（zero-runtime 形态专用；compose v2.24+ 的 !override 语义整列表替换，
# 故此处需完整复制基础文件的全部挂载、仅去掉 velites 一条——新增挂载时
# 两文件同步）：
#   docker compose -f deploy/compose.worker.yaml \
#     -f deploy/compose.worker.zero-runtime.yaml up -d
# 配合 deploy/.env 写 AGENT_WORKER_EXPECT_RUNTIMES=（置空禁用期望守卫）。
services:
  worker:
    volumes: !override
      - ${AGENT_WORKER_CONFIG:-../deploy/worker.remote.example.yaml}:/etc/agent-legion/worker.yaml:ro
      - ${PI_CONFIG_DIR:-../pi-config}:/root/.pi/agent:ro
      - ${VELITES_CONFIG_DIR:-../velites-config}:/root/.velites:ro
      - worker-data:/var/lib/agent-legion-worker
      - worker-control:/var/lib/agent-legion-worker-control
