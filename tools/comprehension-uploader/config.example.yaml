# Example configuration for the standalone comprehension uploader.
# Copy this file and adjust the values for your environment.

api_base_url: "https://cms.example.com/questionsource"

# Authentication (priority order):
#   1. CMS_TOKEN from the environment (or .env): use a ready-made JWT.
#   2. token: below.
#   3. user_auth: user-login JWT flow (the auth the CMS side currently supports):
#        POST {login_url} {app_id, account_type, uname, password} -> data.user_token
#        POST {auth_url}  {user_token, app_id}                   -> data.token (24h JWT)
#      uname/password come from CMS_USER_NAME / CMS_USER_PASSWORD (or .env);
#      never put the password in a tracked config file.
#   4. token_gen: legacy HMAC flow (deprecated; CMS no longer issues these).
#      BASECMS_* names remain as deprecated aliases for the CMS_* env vars.
# token: "hardcoded-token-only-for-local-tests"
# user_auth:
#   app_id: 1001
#   account_type: 1            # 1=student, 2=parent
#   client_params: '{"source":"..."}'   # optional; some deployments reject
#                                       # logins without it (code -9980440)
#   login_url: "http://study-user-api.internal.example.com/user/user/login"
#   login_resolve_ip: "10.0.0.1"   # optional: bind the internal login host to
#                                  # this IP when DNS does not resolve it
#   auth_url: "https://addons-api.example.com/common/v1/auth"
# token_gen:
#   app_id: "..."
#   nonce: "..."
#   secret: "..."
#   url: "https://cms.example.com/openapi/token"

db_path: "data/comprehension_uploader.db"

question_source:
  type: "json_file"
  path: "data/question_snapshots.json"      # question_id -> {stem, options, ...}
  # Or use an HTTP source:
  # type: "http"
  # url_template: "https://cms.example.com/api/question/{question_id}"
  # headers:
  #   Authorization: "Bearer {token}"
  # response_path: "data.normalized"

upload_on_duplicate: "update"   # "update" | "skip"
request_timeout: 30
max_retries: 3
